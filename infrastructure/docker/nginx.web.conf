# Quality360 · nginx para servir el build estático de Vite (apps/web)
# SPA: cualquier ruta que no sea un archivo existente cae a index.html
# (necesario para React Router en modo history).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"estado":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
