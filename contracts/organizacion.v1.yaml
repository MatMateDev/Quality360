openapi: 3.1.0
info:
  title: Quality360 · Servicio de Organización y seguimiento
  version: 1.0.0
  license:
    name: Uso académico · Capstone Duoc UC
    identifier: LicenseRef-Capstone-Duoc-UC
  description: |
    API interna del servicio dueño de usuarios, roles, supervisión, células,
    sprints, HDU, historial y auditoría (D9). No se publica fuera de la red
    interna; el portal llega a través del gateway.

    **Consumidores**
    - Gateway: reenvía con el token del usuario (`sesionSupabase`) las rutas
      de igual nombre de `gateway.v1.yaml` y compone `/v1/inicio/*` con
      `/v1/resumenes/*`.
    - Certificaciones e Impedimentos: resuelven acceso con `/v1/interno/*` y
      el token propagado. Nunca leen el esquema `organizacion`.
    - Integraciones: carga semilla con `credencialServicio` en
      `/v1/interno/carga/*` y en las operaciones que declaran `SERVICIO` en
      `x-roles`.

    **Reglas que aplica en cada solicitud**
    - Identidad desde el token verificado (`sub`); rol y `activo` desde su base
      de datos, nunca desde el token (D4). Usuario inactivo o sin registro →
      403 `ACCESO_DENEGADO`.
    - Ámbito de HDU: el Analista QA ve las HDU con `analistaId` igual a su id;
      el QE, aquellas donde es responsable o cuyo analista supervisa hoy; el
      Líder QA, las de sus células vigentes; el Administrador y el Auditor,
      todas. Fuera de ámbito → 403 (D12, E7-B02).
    - Líder QA y Auditor son de solo lectura: ninguna escritura los admite
      (D32). Las bandejas (`/v1/bandeja/*`) se componen aquí, con
      Certificaciones por contrato interno (D46).
    - Toda escritura audita valor anterior, nuevo, actor y fecha en la misma
      transacción (E1-B12, E2-B04). No hay borrados físicos.

    Las operaciones compartidas con el gateway tienen el mismo cuerpo,
    respuesta y códigos, salvo 429 y 503 `SERVICIO_NO_DISPONIBLE`, que solo
    emite el gateway. Convenciones: `comun.v1.yaml`.
servers:
  - url: http://organizacion:3001
    description: Red interna de Docker Compose
  - url: http://localhost:3001
    description: Desarrollo local
security:
  - sesionSupabase: []
tags:
  - name: Salud
    description: Estado del proceso.
  - name: Sesión
    description: Perfil del usuario autenticado.
  - name: Acceso interno
    description: Resolución de rol, estado activo y ámbito para otros servicios.
  - name: Resúmenes
    description: Fuentes de los bloques de `/v1/inicio/*` del gateway.
  - name: Equipo
    description: Analistas supervisados y asignables.
  - name: Usuarios
    description: Administración de usuarios y roles.
  - name: Supervisión
    description: Relación QE–analista y su historial.
  - name: Auditoría
    description: Registro de cambios.
  - name: Catálogos
    description: Células y sprints.
  - name: HDU
    description: Historias de usuario, estados, asignación e historial.
  - name: Carga semilla
    description: Altas idempotentes para Integraciones con credencial de servicio.
  - name: Bandejas
    description: Bandeja de inicio de cada rol (E7-B03, D29, D33, D46).
  - name: Auditor
    description: Consultas y exportaciones del Auditor que pertenecen a Organización (E7-B04).

x-hdu-transversal: [E1-B02#1, E1-B07#3, E1-B11#1]

paths:
  /health:
    get:
      operationId: obtenerSaludOrganizacion
      tags: [Salud]
      summary: Estado del servicio
      security: []
      x-roles: [PUBLICO]
      x-hdu: []
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/me:
    get:
      operationId: obtenerPerfil
      tags: [Sesión]
      summary: Perfil del usuario autenticado
      description: Rol leído de la base en cada solicitud. Usuario inactivo o sin registro → 403.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E1-F11#3, E1-B01#2, E1-B10#1, E1-B10#2, E1-B10#3, E7-F01#1]
      responses:
        '200':
          description: Perfil vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/acceso:
    get:
      operationId: resolverAcceso
      tags: [Acceso interno]
      summary: Rol vigente, estado activo y ámbito del usuario del token
      description: |
        Implementación remota de `ResolutorDeAcceso` (`packages/auth-nest`)
        para Certificaciones e Impedimentos. Responde 200 también si el
        usuario está inactivo (`activo: false`) para que el guard del llamador
        lo deniegue. Sin caché: refleja desactivaciones y cambios de rol en la
        siguiente solicitud. Usuario sin registro en Organización → 403.
        Para `LIDER_QA`, `ambito.celulasIds` trae sus células vigentes (D47);
        Certificaciones exige `rol: AUDITOR` en `/v1/auditor/*`.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E1-B02#2, E1-B02#3, E7-B02#1, E7-B04#2]
      responses:
        '200':
          description: Resolución de acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolucionAcceso'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/hdu/{id}/acceso:
    parameters:
      - $ref: '#/components/parameters/HduIdPath'
    get:
      operationId: resolverAccesoHdu
      tags: [Acceso interno]
      summary: ¿Puede el usuario del token acceder a esta HDU?
      description: |
        Aplica el ámbito de HDU. Responde 200 con `permitido: false` si está
        fuera de ámbito o no existe, para no revelar existencia. Usuario
        inactivo o sin registro → 403. Si se permite, incluye `actor` (nombre y
        rol de quien consulta) y `hdu` (código, título, estado, célula, sprint,
        QE responsable y analista), que Certificaciones usa para sus reglas y
        para el certificado (E3).

        Relaciones de solo lectura (D32): `LECTOR_CELULA` si el usuario es
        Líder QA y la célula de la HDU está entre sus vigentes;
        `LECTOR_AUDITORIA` si es Auditor. Una célula quitada deja de dar acceso
        en la siguiente solicitud (E7-B02-T05).
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E2-F04#2, E2-B03#1, E2-B03#2, E2-B03#3, E3-B01#1, E7-B02#1, E7-B02#2, E7-F04#3]
      responses:
        '200':
          description: Resolución de acceso a la HDU.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccesoHdu'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/hdu/responsable:
    get:
      operationId: listarHduResponsable
      tags: [Acceso interno]
      summary: HDU donde el QE del token es el responsable
      description: Para la bandeja de aprobaciones de Certificaciones (E3-F03#3). Solo rol QE.
      x-roles: [QE]
      x-hdu: [E3-F03#3]
      responses:
        '200':
          description: HDU del QE responsable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaHduResponsable'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/hdu/ambito:
    get:
      operationId: resolverAmbitoLecturaHdu
      tags: [Acceso interno]
      summary: HDU que el usuario del token puede leer
      description: |
        Para que Certificaciones autorice lecturas en lote (bandejas y
        consultas del Auditor) con una sola llamada, sin leer el esquema
        `organizacion` (D47). Mismo ámbito que `GET /v1/hdu` (E2-B03, E7-B02):
        Administrador y Auditor → `todas: true`; Líder QA → HDU de sus células
        vigentes; QE y Analista QA → su ámbito de E2. Sin caché. Usuario
        inactivo o sin registro → 403.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E7-B02#1, E7-B02#2, E7-B03#1]
      responses:
        '200':
          description: Ámbito de lectura.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/AmbitoLecturaHdu'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/hdu/consulta:
    post:
      operationId: consultarHduLote
      tags: [Acceso interno]
      summary: Datos de varias HDU del ámbito del usuario
      description: |
        Es una lectura; usa POST solo para enviar hasta 1000 ids. Devuelve
        código, título, estado, célula, sprint, QE responsable y analista de
        cada HDU pedida, para que Certificaciones muestre la HDU en la
        bitácora global (E7-B04#1). Si algún id está fuera del ámbito del
        usuario o no existe, responde 403 completo, sin datos parciales (D12).
        Excepción (D55): para Administrador y Auditor, que leen todo, los ids
        que Organización no conoce se omiten de `items` en vez de dar 403, y
        quien llama los muestra como «HDU no disponible».
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E7-B04#1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/ConsultaHduLote'
      responses:
        '200':
          description: Una HDU por id, en el orden pedido.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ListaHduLote'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/auditoria/exportaciones:
    post:
      operationId: registrarExportacion
      tags: [Acceso interno]
      summary: Registrar en la auditoría una exportación hecha por otro servicio
      description: |
        Certificaciones lo llama, con el token del Auditor, antes de entregar
        el CSV de bitácora o de certificados (D48). Organización verifica que
        el usuario del token sea Auditor activo y registra `EXPORTAR`
        (entidad `EXPORTACION`) con actor, recurso, filtros y filas (D35). Si
        no responde, Certificaciones no entrega el archivo. Las exportaciones
        de Organización se registran sin pasar por aquí.
      x-roles: [AUDITOR]
      x-hdu: [E7-B04#3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/RegistroExportacion'
      responses:
        '201':
          description: Exportación registrada.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                additionalProperties: false
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------------------------------------------ E7 · bandejas
  /v1/bandeja/analista:
    get:
      operationId: obtenerBandejaAnalista
      tags: [Bandejas]
      summary: Bandeja del Analista QA
      description: |
        Solo rol `ANALISTA_QA`; cualquier otro, incluido el Administrador, 403
        con el mismo cuerpo (D33). Ámbito: HDU con `analistaId` igual al
        usuario. Organización compone sus datos con
        `POST /v1/interno/checklist/estados` de Certificaciones (2 s de tiempo
        límite, `CERTIFICACIONES_TIMEOUT_MS`), propagando `Authorization` y
        `x-trace-id` (D46).

        - Contadores: `abiertas` (Organización), `conObservaciones` y
          `esperandoAprobacion` (Certificaciones). No dependen de los filtros.
        - Lista: orden por defecto observadas primero, luego prioridad (alta a
          baja), luego sprint. Si Certificaciones no responde, sus contadores y
          el `seguimiento` de cada fila vienen `indisponible`, la lista sigue
          con orden de respaldo `prioridad:desc` y la respuesta es 200 (E7-B03#2).
        - `soloConObservaciones` depende de Certificaciones: si no responde, el
          bloque `hdu` viene `indisponible` en vez de una lista sin filtrar.
      x-roles: [ANALISTA_QA]
      x-hdu: [E7-F01#3, E7-F02#1, E7-F02#2, E7-F02#3, E7-B03#1, E7-B03#2, E7-B03#3]
      parameters:
        - $ref: '#/components/parameters/FiltroEstadoHdu'
        - $ref: '#/components/parameters/FiltroCelula'
        - $ref: '#/components/parameters/FiltroSprint'
        - name: soloConObservaciones
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/FiltroBusqueda'
        - $ref: '#/components/parameters/Orden'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Bandeja con cada bloque `ok` o `indisponible`.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/BandejaAnalista'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/bandeja/qe:
    get:
      operationId: obtenerBandejaQe
      tags: [Bandejas]
      summary: Bandeja del QE
      description: |
        Solo rol `QE` (D33). Ámbito: HDU donde el usuario es QE responsable;
        las de sus analistas con otro QE responsable no aparecen (E7-F03#3).
        Una fila por HDU y acción pendiente, la más antigua primero.

        - `sinAnalista` y las acciones `ASIGNAR` salen de Organización.
        - `porAprobar`, `listasCertificar`, `listasCerrar` y las acciones
          `APROBAR`, `CERTIFICAR` y `CERRAR` salen de Certificaciones. Si no
          responde, esos contadores vienen `indisponible` y la lista trae solo
          las acciones `ASIGNAR` con `calculoParcial: true` (E7-B03-T09).
        - Filtrar por `tipoAccion` distinto de `ASIGNAR` con Certificaciones
          caída deja el bloque `acciones` `indisponible`.
        - El resumen de equipo de E1-F03 sigue en `GET /v1/inicio/qe`.
      x-roles: [QE]
      x-hdu: [E7-F01#3, E7-F03#1, E7-F03#2, E7-F03#3, E7-B03#1, E7-B03#2, E7-B03#3]
      parameters:
        - name: tipoAccion
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/TipoAccionQe'
        - $ref: '#/components/parameters/FiltroCelula'
        - $ref: '#/components/parameters/FiltroSprint'
        - $ref: '#/components/parameters/FiltroAnalista'
        - $ref: '#/components/parameters/FiltroBusqueda'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Bandeja con cada bloque `ok` o `indisponible`.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/BandejaQe'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/bandeja/lider:
    get:
      operationId: obtenerBandejaLider
      tags: [Bandejas]
      summary: Bandeja del Líder QA
      description: |
        Solo rol `LIDER_QA` (D33). Ámbito: HDU cuya célula está entre las
        vigentes del líder en `celula_lider` (D30). Solo lectura.

        - `celulaId` fuera de sus células vigentes → 403 (E7-B02-T04).
        - Sin células: 200 con `celulas.datos.items` vacío, contadores en 0
          con `ok` y listas vacías (E7-B02#1).
        - `certificados`, `avancePromedioAbiertas` y el `seguimiento` de cada
          fila salen de Certificaciones; si no responde, van `indisponible` y
          la lista se mantiene (E7-F04#2). `hduAbiertas`, `hduCerradas` y
          `sinAnalista` no se degradan.
        - Orden por defecto: célula, sprint más reciente, código.
      x-roles: [LIDER_QA]
      x-hdu: [E7-F01#3, E7-F04#1, E7-F04#2, E7-F04#3, E7-B02#1, E7-B03#1, E7-B03#2, E7-B03#3]
      parameters:
        - $ref: '#/components/parameters/FiltroCelula'
        - $ref: '#/components/parameters/FiltroSprint'
        - $ref: '#/components/parameters/FiltroEstadoHdu'
        - $ref: '#/components/parameters/FiltroQe'
        - $ref: '#/components/parameters/FiltroAnalista'
        - name: sinAnalista
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/FiltroBusqueda'
        - $ref: '#/components/parameters/Orden'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Bandeja con cada bloque `ok` o `indisponible`.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/BandejaLider'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/bandeja/admin:
    get:
      operationId: obtenerBandejaAdmin
      tags: [Bandejas]
      summary: Bandeja del Administrador
      description: |
        Solo rol `ADMINISTRADOR` (D33). Todo sale de Organización y no
        depende de Certificaciones (E7-B03-T11). Si Organización no responde,
        el gateway devuelve 503 y el portal muestra el error con «Reintentar»
        (E7-F05#2).

        - Contadores sobre usuarios activos, salvo `usuariosInactivos`.
          `celulasSinLider` cuenta células activas sin asignación vigente.
        - `pendientes`: una fila por analista activo sin QE, QE activo sin
          analistas, Líder activo sin células y célula sin líder (D51).
        - `ultimosCambios`: las 10 entradas más recientes de la auditoría de
          usuarios, sin contraseñas ni tokens.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E7-F01#3, E7-F05#1, E7-F05#2, E7-F05#3, E7-B03#1, E7-B03#3]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Bandeja del Administrador.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/BandejaAdmin'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/bandeja/auditor:
    get:
      operationId: obtenerBandejaAuditor
      tags: [Bandejas]
      summary: Bandeja del Auditor (contadores y pestaña HDU)
      description: |
        Solo rol `AUDITOR` (D33). Ámbito: todas las HDU, solo lectura.
        `hduTotal` y `cambiosUsuarios7d` salen de Organización; `certificados`
        y `eventos7d` de `GET /v1/interno/resumen-auditoria` de
        Certificaciones. Si Certificaciones no responde, esos contadores y el
        `seguimiento` de cada fila vienen `indisponible`; filtrar por
        `certificado` deja el bloque `hdu` `indisponible`.
        `desde`/`hasta` filtran por `actualizadoEn`.
      x-roles: [AUDITOR]
      x-hdu: [E7-F01#3, E7-F06#1, E7-F06#3, E7-B02#2, E7-B03#1, E7-B03#2, E7-B03#3]
      parameters:
        - $ref: '#/components/parameters/FiltroCelula'
        - $ref: '#/components/parameters/FiltroSprint'
        - $ref: '#/components/parameters/FiltroEstadoHdu'
        - $ref: '#/components/parameters/FiltroQe'
        - $ref: '#/components/parameters/FiltroAnalista'
        - name: certificado
          in: query
          required: false
          schema:
            type: string
            enum: [con, sin]
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroBusqueda'
        - $ref: '#/components/parameters/Orden'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Bandeja con cada bloque `ok` o `indisponible`.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/BandejaAuditor'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ----------------------------------------------------- E7 · consultas del Auditor
  /v1/auditor/auditoria-usuarios:
    get:
      operationId: listarAuditoriaUsuarios
      tags: [Auditor]
      summary: Auditoría de usuarios con filtros
      description: |
        Solo rol `AUDITOR`; el Administrador también recibe 403 (D38,
        E7-B04#2). Entidades `USUARIO`, `SUPERVISION` y `EXPORTACION`, de la
        más reciente a la más antigua. `antes` y `despues` solo traen campos
        de la lista blanca: nunca contraseñas, tokens ni secretos (E1-B12#3).
        Un filtro sin coincidencias → 200 con `items` vacío y `total` 0.
      x-roles: [AUDITOR]
      x-hdu: [E7-F06#1, E7-F06#2, E7-F06#3, E7-F07#3, E7-B04#1, E7-B04#2]
      parameters:
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - name: actorId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: operacion
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/OperacionAuditoriaUsuarios'
        - name: usuarioAfectadoId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de la auditoría de usuarios.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaAuditoriaUsuarios'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

