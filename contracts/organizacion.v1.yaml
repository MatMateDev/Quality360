          $ref: '#/components/responses/AccesoDenegado'
        '422':
          description: La célula indicada no existe.
          x-codigos: [CATALOGO_INVALIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/interno/carga/hdu:
    post:
      operationId: cargarHdu
      tags: [Carga semilla]
      summary: Alta idempotente de una HDU con su QE responsable
      description: |
        Idempotente por código: si existe responde 200 con `creado: false` y no
        cambia nada. Crea en `PENDIENTE` sin analista; la semilla asigna
        analista y avanza estados con las operaciones normales.
      x-roles: [SERVICIO]
      x-hdu: []
      security:
        - credencialServicio: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargaHdu'
      responses:
        '200':
          description: Ya existía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCargaHdu'
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCargaHdu'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '422':
          description: Célula o sprint inexistentes, o QE responsable no válido.
          x-codigos: [CATALOGO_INVALIDO, QE_INVALIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  securitySchemes:
    sesionSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth del usuario, propagado por el gateway o por otro servicio.
    credencialServicio:
      type: apiKey
      in: header
      name: X-Q360-Servicio-Token
      description: |
        Credencial de servicio a servicio (ADR 0007). Cada servicio llamador
        tiene su propio secreto en `.env`; en esta corrida solo
        `integraciones`. El actor auditado es `{tipo: SERVICIO, id:
        integraciones}`. El gateway descarta esta cabecera si llega desde
        afuera. Las rutas `/v1/interno/carga/*` responden 403 si
        `PERMITIR_CARGA_SEMILLA` no es `true`.

  parameters:
    AnalistaIdQuery:
      name: analistaId
      in: query
      required: false
      description: Opcional para Analista QA (solo su propio id); obligatorio para Administrador.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    Pagina: {$ref: './comun.v1.yaml#/components/parameters/Pagina'}
    TamanoPagina: {$ref: './comun.v1.yaml#/components/parameters/TamanoPagina'}
    UsuarioIdPath: {$ref: './comun.v1.yaml#/components/parameters/UsuarioIdPath'}
    AnalistaIdPath: {$ref: './comun.v1.yaml#/components/parameters/AnalistaIdPath'}
    HduIdPath: {$ref: './comun.v1.yaml#/components/parameters/HduIdPath'}
    TamanoPaginaBandeja: {$ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'}
    FiltroCelula: {$ref: './comun.v1.yaml#/components/parameters/FiltroCelula'}
    FiltroSprint: {$ref: './comun.v1.yaml#/components/parameters/FiltroSprint'}
    FiltroEstadoHdu: {$ref: './comun.v1.yaml#/components/parameters/FiltroEstadoHdu'}
    FiltroQe: {$ref: './comun.v1.yaml#/components/parameters/FiltroQe'}
    FiltroAnalista: {$ref: './comun.v1.yaml#/components/parameters/FiltroAnalista'}
    FiltroBusqueda: {$ref: './comun.v1.yaml#/components/parameters/FiltroBusqueda'}
    FiltroDesde: {$ref: './comun.v1.yaml#/components/parameters/FiltroDesde'}
    FiltroHasta: {$ref: './comun.v1.yaml#/components/parameters/FiltroHasta'}
    Orden: {$ref: './comun.v1.yaml#/components/parameters/Orden'}

  schemas:
    Salud:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          const: ok
    ResolucionAcceso:
      type: object
      required: [usuarioId, rol, activo, ambito]
      additionalProperties: false
      properties:
        usuarioId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        rol:
          $ref: './comun.v1.yaml#/components/schemas/Rol'
        activo:
          type: boolean
        ambito:
          type: object
          required: [qeSupervisorId, analistasSupervisadosIds, celulasIds]
          additionalProperties: false
          properties:
            qeSupervisorId:
              description: QE vigente si el rol es `ANALISTA_QA`; si no, `null`.
              oneOf:
                - $ref: './comun.v1.yaml#/components/schemas/Uuid'
                - type: 'null'
            analistasSupervisadosIds:
              type: array
              description: Analistas vigentes si el rol es `QE`; si no, vacío.
              items:
                $ref: './comun.v1.yaml#/components/schemas/Uuid'
            celulasIds:
              type: array
              description: Células vigentes si el rol es `LIDER_QA` (D30); si no, vacío.
              items:
                $ref: './comun.v1.yaml#/components/schemas/Uuid'

    CargaUsuario:
      type: object
      required: [nombre, correo, rol, contrasenaInicial]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 150
        rol:
          $ref: './comun.v1.yaml#/components/schemas/Rol'
        activo:
          type: boolean
          default: true
        contrasenaInicial:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 72
          description: Solo para cuentas de demo locales. Se envía a Supabase Auth y nunca se guarda ni se audita.
        celulaIds:
          $ref: './comun.v1.yaml#/components/schemas/CelulaIdsLider'
          description: 'Solo con `rol: LIDER_QA` (fixture E7). Se aplica al crear; si el usuario ya existía, sus células no cambian.'
    ResultadoCargaUsuario:
      type: object
      required: [creado, usuario]
      additionalProperties: false
      properties:
        creado:
          type: boolean
        usuario:
          $ref: './comun.v1.yaml#/components/schemas/Usuario'
    CargaCelula:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
    ResultadoCargaCelula:
      type: object
      required: [creado, celula]
      additionalProperties: false
      properties:
        creado:
          type: boolean
        celula:
          $ref: './comun.v1.yaml#/components/schemas/CatalogoRef'
    CargaSprint:
      type: object
      required: [nombre, inicio, fin, celulaId]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        inicio:
          $ref: './comun.v1.yaml#/components/schemas/Fecha'
        fin:
          $ref: './comun.v1.yaml#/components/schemas/Fecha'
          description: Igual o posterior a `inicio`; si no, 400.
        celulaId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
          description: Célula dueña del sprint; si no existe, 422 `CATALOGO_INVALIDO`.
    ResultadoCargaSprint:
      type: object
      required: [creado, sprint]
      additionalProperties: false
      properties:
        creado:
          type: boolean
        sprint:
          $ref: './comun.v1.yaml#/components/schemas/Sprint'
    CargaHdu:
      type: object
      required: [codigo, titulo, celulaId, sprintId, prioridad, qeResponsableId]
      additionalProperties: false
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        celulaId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        sprintId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        prioridad:
          $ref: './comun.v1.yaml#/components/schemas/PrioridadHdu'
        qeResponsableId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
    ResultadoCargaHdu:
      type: object
      required: [creado, hdu]
      additionalProperties: false
      properties:
        creado:
          type: boolean
        hdu:
          $ref: './comun.v1.yaml#/components/schemas/HduDetalleBase'

    # Alias de esquemas comunes
    Uuid: {$ref: './comun.v1.yaml#/components/schemas/Uuid'}
    Rol: {$ref: './comun.v1.yaml#/components/schemas/Rol'}
    EstadoHdu: {$ref: './comun.v1.yaml#/components/schemas/EstadoHdu'}
    Error: {$ref: './comun.v1.yaml#/components/schemas/Error'}
    ErrorTransicionInvalida: {$ref: './comun.v1.yaml#/components/schemas/ErrorTransicionInvalida'}
    ErrorCierreRechazado: {$ref: './comun.v1.yaml#/components/schemas/ErrorCierreRechazado'}
    ErrorRelacionesIncompatibles: {$ref: './comun.v1.yaml#/components/schemas/ErrorRelacionesIncompatibles'}
    Perfil: {$ref: './comun.v1.yaml#/components/schemas/Perfil'}
    AccesoHdu: {$ref: './comun.v1.yaml#/components/schemas/AccesoHdu'}
    ListaHduResponsable: {$ref: './comun.v1.yaml#/components/schemas/ListaHduResponsable'}
    ResumenEquipoQe: {$ref: './comun.v1.yaml#/components/schemas/ResumenEquipoQe'}
    ResumenHduQe: {$ref: './comun.v1.yaml#/components/schemas/ResumenHduQe'}
    ResumenSupervisorQa: {$ref: './comun.v1.yaml#/components/schemas/ResumenSupervisorQa'}
    ResumenHduQa: {$ref: './comun.v1.yaml#/components/schemas/ResumenHduQa'}
    ResumenUsuariosAdmin: {$ref: './comun.v1.yaml#/components/schemas/ResumenUsuariosAdmin'}
    ResumenSupervisionAdmin: {$ref: './comun.v1.yaml#/components/schemas/ResumenSupervisionAdmin'}
    EquipoQe: {$ref: './comun.v1.yaml#/components/schemas/EquipoQe'}
    ListaAnalistasAsignables: {$ref: './comun.v1.yaml#/components/schemas/ListaAnalistasAsignables'}
    Usuario: {$ref: './comun.v1.yaml#/components/schemas/Usuario'}
    PaginaUsuarios: {$ref: './comun.v1.yaml#/components/schemas/PaginaUsuarios'}
    NuevoUsuario: {$ref: './comun.v1.yaml#/components/schemas/NuevoUsuario'}
    ActualizacionUsuario: {$ref: './comun.v1.yaml#/components/schemas/ActualizacionUsuario'}
    CambioRol: {$ref: './comun.v1.yaml#/components/schemas/CambioRol'}
    AsignacionSupervisor: {$ref: './comun.v1.yaml#/components/schemas/AsignacionSupervisor'}
    ResultadoCambioSupervision: {$ref: './comun.v1.yaml#/components/schemas/ResultadoCambioSupervision'}
    HistorialSupervision: {$ref: './comun.v1.yaml#/components/schemas/HistorialSupervision'}
    PaginaAuditoria: {$ref: './comun.v1.yaml#/components/schemas/PaginaAuditoria'}
    ListaCelulas: {$ref: './comun.v1.yaml#/components/schemas/ListaCelulas'}
    ListaSprints: {$ref: './comun.v1.yaml#/components/schemas/ListaSprints'}
    PaginaHdu: {$ref: './comun.v1.yaml#/components/schemas/PaginaHdu'}
    NuevaHdu: {$ref: './comun.v1.yaml#/components/schemas/NuevaHdu'}
    HduDetalleBase: {$ref: './comun.v1.yaml#/components/schemas/HduDetalleBase'}
    AsignacionAnalista: {$ref: './comun.v1.yaml#/components/schemas/AsignacionAnalista'}
    ResultadoAsignacion: {$ref: './comun.v1.yaml#/components/schemas/ResultadoAsignacion'}
    SolicitudCambioEstado: {$ref: './comun.v1.yaml#/components/schemas/SolicitudCambioEstado'}
    ResultadoCambioEstado: {$ref: './comun.v1.yaml#/components/schemas/ResultadoCambioEstado'}
    HistorialHdu: {$ref: './comun.v1.yaml#/components/schemas/HistorialHdu'}

  responses:
    Validacion: {$ref: './comun.v1.yaml#/components/responses/Validacion'}
    NoAutenticado: {$ref: './comun.v1.yaml#/components/responses/NoAutenticado'}
    AccesoDenegado: {$ref: './comun.v1.yaml#/components/responses/AccesoDenegado'}
    NoEncontrado: {$ref: './comun.v1.yaml#/components/responses/NoEncontrado'}
    ErrorInterno: {$ref: './comun.v1.yaml#/components/responses/ErrorInterno'}
    ServicioNoDisponible: {$ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'}
    ProveedorIdentidadNoDisponible: {$ref: './comun.v1.yaml#/components/responses/ProveedorIdentidadNoDisponible'}
    ExportacionCsv: {$ref: './comun.v1.yaml#/components/responses/ExportacionCsv'}
    ExportacionExcedeLimite: {$ref: './comun.v1.yaml#/components/responses/ExportacionExcedeLimite'}
