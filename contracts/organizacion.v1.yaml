      tags: [Usuarios]
      summary: Asignar o cambiar el rol de un usuario
      description: |
        Mismas reglas que en el gateway: catálogo cerrado (400), último
        administrador, relaciones incompatibles (D31, D40, D43) y cambio
        atómico con `celulaIds` (D42). Todo en una transacción con bloqueo de
