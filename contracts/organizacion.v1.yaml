  /v1/usuarios:
    get:
      operationId: listarUsuarios
      tags: [Usuarios]
      summary: Listar y buscar usuarios
      description: Igual que en el gateway. Orden por `nombre`; `q` busca en nombre o correo sin distinguir mayúsculas. Cada fila trae `celulasVigentes` (D44).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E1-F09#1, E1-F10#1, E7-F05#3, E7-F07#1]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Rol'
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearUsuario
      tags: [Usuarios]
      summary: Registrar un usuario
      description: |
        Orden: esquema (400) → correo único (409) → cuenta en Supabase Auth con
        `auth.admin.inviteUserByEmail` → registro con `id = sub` y auditoría
        `CREAR_USUARIO` en una transacción. Si falla el registro local tras
        crear la cuenta, se elimina la cuenta creada (compensación).
        Con `rol: LIDER_QA` y `celulaIds`, las células se asignan en la misma
        transacción y se audita además `ASIGNAR_CELULAS_LIDER` (D42). Una
        célula inexistente → 422 `CATALOGO_INVALIDO` antes de crear la cuenta.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E1-F09#2, E1-B06#3, E1-B07#1, E1-B12#1, E7-F07#1, E7-F07#2, E7-B01#1, E7-B01#2, E7-B01#3, E7-B02#3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoUsuario'
      responses:
        '201':
          description: Usuario creado y activo.
          headers:
            Location:
              description: '`/v1/usuarios/{id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: Correo duplicado.
          x-codigos: [CORREO_DUPLICADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Alguna célula de `celulaIds` no existe.
          x-codigos: [CATALOGO_INVALIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ProveedorIdentidadNoDisponible'

