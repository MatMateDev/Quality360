        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Último administrador o relaciones incompatibles.
          x-codigos: [ULTIMO_ADMINISTRADOR, RELACIONES_INCOMPATIBLES]
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorRelacionesIncompatibles'
                  - $ref: '#/components/schemas/Error'
        '422':
          description: Alguna célula de `celulaIds` no existe. No se aplica el cambio de rol.
          x-codigos: [CATALOGO_INVALIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /v1/usuarios/{id}/celulas-lider:
    parameters:
      - $ref: '#/components/parameters/UsuarioIdPath'
    get:
      operationId: obtenerCelulasLider
      tags: [Usuarios]
      summary: Células vigentes e historial de un Líder QA
      description: |
        Vigentes e historial con fechas, quién asignó y quién retiró (E7-F07#3).
        Para un usuario que no es Líder QA responde 200 con `vigentes` vacío y
        el historial que tenga (puede haber sido líder antes). Inexistente → 404.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E7-F07#3, E7-B01#1, E7-B01#2]
      responses:
        '200':
          description: Células del líder.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/CelulasLider'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: reemplazarCelulasLider
      tags: [Usuarios]
      summary: Fijar las células vigentes de un Líder QA
      description: |
        Reemplaza el conjunto vigente en una transacción (D30): cierra con
        `fecha_hasta = now()` las que sobran (se conservan en el historial) y
        abre las nuevas; las que siguen no se tocan. Lista vacía = quitar
        todas.

        - El usuario debe tener rol `LIDER_QA`; si no, 409
          `ROL_INCOMPATIBLE` sin cambios (E7-B01-T04).
        - Célula inexistente → 422 `CATALOGO_INVALIDO` sin cambios.
        - Sin diferencias → 200 sin auditar. Con diferencias, auditoría
          `ASIGNAR_CELULAS_LIDER` con `antes` y `despues` (`celulas`).
        - El nuevo ámbito rige en la siguiente solicitud del líder (E7-B02-T05).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E7-F05#3, E7-F07#2, E7-F07#3, E7-B01#1, E7-B01#2, E7-B01#3, E7-B02#3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudCelulasLider'
      responses:
        '200':
          description: Células después del cambio.
          content:
