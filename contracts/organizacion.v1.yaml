      x-hdu: [E7-F06#2, E7-B04#2, E7-B04#3]
      parameters:
        - $ref: '#/components/parameters/FiltroCelula'
        - $ref: '#/components/parameters/FiltroSprint'
        - $ref: '#/components/parameters/FiltroEstadoHdu'
        - $ref: '#/components/parameters/FiltroQe'
        - $ref: '#/components/parameters/FiltroAnalista'
        - name: certificado
          in: query
          required: false
          schema:
            type: string
            enum: [con, sin]
        - $ref: '#/components/parameters/FiltroDesde'
        - $ref: '#/components/parameters/FiltroHasta'
        - $ref: '#/components/parameters/FiltroBusqueda'
      responses:
        '200':
          $ref: '#/components/responses/ExportacionCsv'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '422':
          $ref: '#/components/responses/ExportacionExcedeLimite'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

