    put:
      operationId: reasignarQeResponsableHdu
      tags: [HDU]
      summary: Reasignar el QE responsable de una HDU
      description: |
        Solo el Administrador (D54); el QE —también el responsable—, el
        analista, el Líder QA y el Auditor reciben 403. Permite liberar a un QE
        antes de cambiarle el rol (resuelve `hduAbiertas` del 409 de D43).

        - `qeResponsableId` debe ser un usuario activo con rol QE
          (422 `QE_INVALIDO`). `motivo` es obligatorio (3 a 500 caracteres).
        - HDU `CERRADA`: 409 `HDU_CERRADA`. HDU inexistente: 404.
        - Mismo QE: 200 con `cambio: false`, sin historial ni auditoría.
