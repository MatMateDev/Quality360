openapi: 3.1.0
info:
  title: Quality360 · Servicio de Integraciones (Jira Cloud y archivos)
  version: 1.0.0
  license:
    name: Uso académico · Capstone Duoc UC
    identifier: LicenseRef-Capstone-Duoc-UC
  description: |
    Configuración de la conexión con Jira Cloud, consulta de Jira con
    revisión, asignación y confirmación, importación de archivos CSV/JSON e
    historial de ejecuciones (E5: D93–D112 del backlog E5, D113–D128 de
    `docs/arquitectura/decisiones-mvp.md`; consulta y asignación: D132–D144
    de `docs/backlog/e5-consulta-asignacion.md` y D145–D151). Lo consume el gateway, que publica
    estas mismas rutas (`INTEGRACIONES_URL`, D127).

    - **Acceso (D93, D126).** No lee el esquema `organizacion`. Cada operación
      resuelve rol, estado activo y ámbito con `GET /v1/interno/acceso` de
      Organización (token propagado). Escribir (configurar, probar,
      consultar, asignar, confirmar, descartar, vista previa, importar): solo
      `ADMINISTRADOR`; también **leer la consulta** (borrador, D142). Leer el
      historial: `ADMINISTRADOR`, `QE` y `AUDITOR`. `LIDER_QA` y `ANALISTA_QA`:
      403 en todo. Un id de ejecución inexistente: 404 al Administrador y al
      Auditor, 403 al QE (D50, D106). Una consulta inexistente: 404 al
      Administrador, 403 al resto.
    - **Dos pasos (D132).** «Consultar Jira» es lo único que llama a Jira;
      revisar, asignar y confirmar no lo llaman y funcionan con Jira caído.
      `POST /v1/integraciones/jira/sincronizaciones` ya no existe (404).
      Una sola consulta `ABIERTA` (D134), vigencia
      `INTEGRACIONES_CONSULTA_VIGENCIA_MS` (24 h), tope
      `INTEGRACIONES_CONSULTA_TOPE_ITEMS` (500).
    - **Orden de validación.** 401 → 403 → 413 → 400 → 422 de estructura →
      409 → ejecución. Si Organización no responde antes de empezar: 503
      `SERVICIO_NO_DISPONIBLE`, sin ejecución registrada.
    - **Escritura de HDU (D100).** Solo con `POST
      /v1/interno/integraciones/hdu/upsert` de Organización, en lotes de 25 y
      con el token del Administrador. Integraciones no escribe en otro esquema.
    - **Errores de Jira (D105, D117).** Probar, consultar e importar
      responden 200 con el resultado y un `CodigoErrorIntegracion` de mensaje
      fijo; nunca se copia texto de Jira. Ningún cuerpo, log ni tabla contiene
      el token, la cabecera `Authorization` ni el correo en Base64 (D94).
    - **Una petición, sin progreso (D96, D114).** Consultar, confirmar e importar son
      una sola petición acotada por `INTEGRACIONES_PRESUPUESTO_MS` (8 s) que
      termina en menos de 10 s. No hay sondeo de progreso; el portal muestra
      una espera indeterminada. Si la respuesta no llega, el portal consulta
      `GET /v1/integraciones/estado` (`SIN_RESPUESTA` es solo del portal, D115).
    - **Una ejecución a la vez (D104).** Otra en curso: 409
      `INTEGRACION_EN_CURSO`. Una `EN_CURSO` de más de 5 minutos se cierra como
      `INTERRUMPIDA` al iniciar la siguiente.
servers:
  - url: http://integraciones:3004
    description: Red interna de Docker Compose
  - url: http://localhost:3004
    description: Desarrollo local
security:
  - sesionSupabase: []
tags:
  - name: Salud
    description: Estado del proceso.
  - name: Conexión
    description: Configuración cifrada de Jira Cloud y prueba de conexión (E5-F01, E5-B01).
  - name: Consulta
    description: Consultar Jira, revisar, asignar y confirmar (E5-F02, E5-F05, E5-B02, E5-B05).
  - name: Archivos
    description: Vista previa e importación de CSV/JSON (E5-F03, E5-B03).
  - name: Historial
    description: Ejecuciones, detalle por fila y estado (E5-F04, E5-B04).

x-escenarios-sin-operacion:
  - id: E5-F01#3
    motivo: 'Además de `GET /v1/integraciones/jira/configuracion` (que no trae el token), el campo del portal es de tipo contraseña, nunca se rellena y se vacía tras cada intento (D116).'

paths:
  /health:
    get:
      operationId: obtenerSaludIntegraciones
      tags: [Salud]
      summary: Estado del servicio
      description: No consulta Jira ni Organización. No informa si la llave de cifrado está configurada.
      security: []
      x-roles: [PUBLICO]
      x-hdu: []
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                additionalProperties: false
                properties:
                  estado:
                    type: string
                    const: ok
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'

  # ------------------------------------------------------------ Conexión
  /v1/integraciones/jira/configuracion:
    get:
      operationId: obtenerConfiguracionJira
      tags: [Conexión]
      summary: Configuración de Jira sin secretos
      description: |
        Sitio, correo, proyecto, tipos, destino (con nombres resueltos en
        Organización con `POST /v1/interno/integraciones/destino`), estado de
        la conexión y `token {configurado, ultimos4, descifrable}`. Nunca el
        token ni su cifrado (E5-B01#1). Sin configuración: 200 con
        `configurado: false`. No necesita la llave de cifrado: informa
        `llaveDisponible` y `token.descifrable` (con la llave ausente,
        ambos `false`, y el portal muestra `aviso-integracion-deshabilitada`).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F01#3, E5-B01#1, E5-B01#3]
      responses:
        '200':
          description: Configuración.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ConfiguracionJira'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'
    put:
      operationId: guardarConfiguracionJira
      tags: [Conexión]
      summary: Probar y guardar la configuración
      description: |
        Valida formato (400; el sitio según D95, sin ninguna llamada saliente
        si no cumple) → valida el destino con Organización (422; el sprint de
        respaldo debe ser de la célula, D120) → prueba la conexión (`GET
        myself`, `GET project/{clave}` y `GET field` para detectar el campo
        Sprint) → guarda **solo si la prueba pasa** (D112). Si la prueba
        falla: 200 con `guardado: false`, `prueba.error` y la configuración
        anterior intacta; se actualiza solo `estadoConexion`. Con `token`
        cifra con AES-256-GCM e IV nuevo (D94); sin `token` conserva el
        guardado. Registra un `EventoConfiguracionJira` (D111) solo si guarda.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F01#1, E5-F01#2, E5-F01#3, E5-B01#1, E5-B01#2, E5-B01#3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudConfiguracionJira'
      responses:
        '200':
          description: Resultado de la prueba y de la configuración vigente después del intento.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoGuardadoJira'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/TokenNoDescifrable'
        '422':
          $ref: '#/components/responses/DestinoInvalido'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/IntegracionNoDisponible'

  /v1/integraciones/jira/configuracion/probar:
    post:
      operationId: probarConexionJira
      tags: [Conexión]
      summary: Probar la conexión sin guardar
      description: |
        Con los campos del cuerpo y, para los que falten, los guardados. Hace
        exactamente `GET myself` y `GET project/{clave}` (E5-B01-T05). No
        cambia la configuración ni registra eventos. Errores de Jira: 200 con
        `ok: false` y `error`. Sin token en el cuerpo y token guardado no
        descifrable: 409 `TOKEN_NO_DESCIFRABLE` sin llamar a Jira.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F01#2, E5-B01#2, E5-B01#3]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudPruebaJira'
      responses:
        '200':
          description: Resultado de la prueba.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoPruebaJira'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/TokenNoDescifrable'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/IntegracionNoDisponible'

  /v1/integraciones/jira/configuracion/eventos:
    get:
      operationId: listarEventosConfiguracionJira
      tags: [Conexión]
      summary: Cambios de configuración
      description: Quién, cuándo y qué campos cambió; nunca valores ni el token (D111). El portal muestra los 10 últimos.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F01#1, E5-B01#1]
      parameters:
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Eventos.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaEventosConfiguracionJira'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  # ------------------------------------------- Consulta de Jira y asignación (D132–D150)
  # `POST /v1/integraciones/jira/sincronizaciones` se retiró (D132): responde 404 como cualquier ruta inexistente.
  /v1/integraciones/jira/consultas:
    post:
      operationId: consultarJira
      tags: [Consulta]
      summary: Consultar Jira y guardar la consulta
      description: |
        Una sola petición (D114, D135). Orden: 401 → 403 → 400 → 409
        (`JIRA_NO_CONFIGURADO`, `TOKEN_NO_DESCIFRABLE`, `CONSULTA_ABIERTA` sin
        `reemplazar`, `INTEGRACION_EN_CURSO`) → 503 inicial (Organización o la
        llave) → ejecución. Ninguno de esos registra ejecución ni llama a
        Jira. Después inserta la ejecución `EN_CURSO` (fase `CONSULTA`), lee
        `project = <CLAVE> AND issuetype in (<tipos>) ORDER BY key ASC` en
        páginas de 50 hasta 100 issues, mapea (D101), clasifica contra
        Organización en solo lectura (`POST
        /v1/interno/integraciones/hdu/estado-codigos`, D136) y, **solo si hay
        algo que guardar**, en una transacción: cierra la abierta anterior
        como `REEMPLAZADA` (purga sus filas), crea la consulta `ABIERTA`
        (`version 1`, `venceEn` = ahora + `INTEGRACIONES_CONSULTA_VIGENCIA_MS`,
        instantánea de `sugerencia`, D146) y sus filas. **No crea ni modifica
        HDU.** Si Jira falla antes de leer o la clasificación no puede hacerse
        (`ORGANIZACION_NO_DISPONIBLE`): 200 con la ejecución `FALLIDA`,
        `consulta: null`, y la consulta abierta anterior sigue intacta
        (E5-B02-T14, E5-B05-T34). Con 0 issues: consulta `ABIERTA` sin filas
        (`EXITOSA`).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F02#1, E5-F02#2, E5-F02#3, E5-F02#4, E5-B02#1, E5-B02#2, E5-B02#3, E5-B02#4, E5-B05#2, E5-B05#10, E5-B05#14, E5-B04#1, E5-B04#3]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudConsultaJira'
      responses:
        '200':
          description: Tanda cerrada (`EXITOSA`, `CON_ERRORES`, `INCOMPLETA` o `FALLIDA`) y la consulta resultante.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoConsultaJira'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/ConflictoConsultar'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/IntegracionNoDisponible'

  /v1/integraciones/jira/consultas/actual:
    get:
      operationId: obtenerConsultaActual
      tags: [Consulta]
      summary: La consulta abierta, si hay
      description: |
        Aplica el vencimiento perezoso (D134): si la abierta pasó `venceEn`,
        la cierra como `VENCIDA` (purga sus filas, sube `version`) y responde
        `consulta: null` con ella en `ultimaCerrada`. No llama a Jira ni a
        Organización. Compartida entre Administradores (D134).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F02#1, E5-F05#8, E5-F05#13, E5-B05#1, E5-B05#10, E5-B05#13]
      responses:
        '200':
          description: Consulta actual.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ConsultaActual'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/jira/consultas/{id}:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    get:
      operationId: obtenerConsulta
      tags: [Consulta]
      summary: Cabecera, contadores y versión de una consulta
      description: |
        Lectura barata (una fila y conteos): el portal la usa para saber si
        otra persona cambió la consulta (`version`, D148), al volver a la
        pestaña y antes de confirmar. Aplica el vencimiento perezoso. Una
        consulta cerrada responde 200 con su estado y contadores (sin filas).
        Inexistente: 404 `CONSULTA_NO_ENCONTRADA` al Administrador; 403 al
        resto (D142).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F05#8, E5-F05#9, E5-B05#1, E5-B05#10, E5-B05#11, E5-B05#13]
      responses:
        '200':
          description: Consulta.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Consulta'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/jira/consultas/{id}/continuaciones:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    post:
      operationId: continuarConsultaJira
      tags: [Consulta]
      summary: Continuar consulta (leer la tanda siguiente)
      description: |
        Lee desde el `continuarDesde` guardado en la consulta (`key >
        "<clave>"`) con los mismos límites (D135) y **acumula** en la misma
        consulta sin tocar asignaciones ni marcas; una issue ya leída no se
        duplica (gana la primera lectura). Renueva `venceEn` (cuenta desde la
        última llamada a Jira, D134) y sube `version`. Registra su propia
        ejecución (fase `CONSULTA`). Al llegar a 500 filas la tanda termina
        `INCOMPLETA` con `TOPE_DE_CONSULTA`. Orden: 401 → 403 → 404 → 410
        `CONSULTA_VENCIDA` → 409 (`CONSULTA_NO_ABIERTA`, `CONSULTA_LLENA`,
        `CONSULTA_COMPLETA` si `hayMas` es `false`, `JIRA_NO_CONFIGURADO`,
        `TOKEN_NO_DESCIFRABLE`, `INTEGRACION_EN_CURSO`) → ejecución. Usa la
        credencial de la configuración vigente y el proyecto guardado en la
        consulta; sin configuración → 409 `JIRA_NO_CONFIGURADO`.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F02#5, E5-B02#2, E5-B02#3, E5-B05#12]
      responses:
        '200':
          description: Tanda cerrada y la consulta con los acumulados. Si la tanda es `FALLIDA`, `consulta` es la misma, sin cambios.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoConsultaJira'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoContinuar'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/IntegracionNoDisponible'

  /v1/integraciones/jira/consultas/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    get:
      operationId: listarItemsConsulta
      tags: [Consulta]
      summary: Filas de la consulta por grupo
      description: |
        Por `posicion`. `q` busca en código o título sin distinguir
        mayúsculas, como texto literal. Paginación D49 (25 por defecto,
        máximo 100, un valor mayor se recorta). No llama a Jira ni a
        Organización. Una consulta cerrada no tiene filas: 409
        `CONSULTA_NO_ABIERTA` (o 410 si venció), nunca una lista vacía que
        parezca real (D148).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F05#1, E5-F05#2, E5-B05#1, E5-B05#2, E5-B05#3, E5-B05#13]
      parameters:
        - name: grupo
          in: query
          required: true
          schema:
            $ref: './comun.v1.yaml#/components/schemas/GrupoConsulta'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de filas.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaItemsConsulta'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConsultaNoAbierta'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'
    patch:
      operationId: editarItemsConsulta
      tags: [Consulta]
      summary: Asignar y marcar filas (por fila o en grupo)
      description: |
        D139, D145. Última escritura gana (no exige `version`). Para cada fila
        del alcance calcula la combinación final y la valida con Organización
        (`POST /v1/interno/integraciones/asignaciones/validar`, combinaciones
        deduplicadas, lotes de 100), que también propone el sprint al fijar la
        célula (D137, con `sugerencia.sprintRespaldo` de la consulta). Reglas:
        solo `NUEVA` se asigna (`CAMBIO`, `SIN_CAMBIOS` y `CON_ERROR` →
        `FILA_NO_ASIGNABLE`); marcar una `NUEVA` exige asignación completa y
        válida (`ASIGNACION_INCOMPLETA` con `faltantes`); `SIN_CAMBIOS` y
        `CON_ERROR` no se marcan (`FILA_NO_MARCABLE`); una fila `aplicada` es
        de solo lectura (`FILA_NO_ASIGNABLE` / `FILA_NO_MARCABLE`, D148); si
        una edición invalida una `NUEVA` marcada, se desmarca (`desmarcadas`).

        **Respuesta:** con alcance de varias filas (o `todas`), 200 con
        `rechazadas` (las rechazadas no cambian; las demás sí). Con alcance de
        **una sola fila** (`itemIds` de un elemento), un rechazo es **422**
        con el código y `detalles[].campo` (E5-B05-T08, T10), y nada cambia.
        Un `itemId` de otra consulta: 404 `CONSULTA_NO_ENCONTRADA`. Sube
        `version` en 1 si algo cambió. Guarda `asignado_por` y `asignado_en`;
        no audita fila por fila (borrador, D141). Si Organización no responde:
        503 `SERVICIO_NO_DISPONIBLE` y nada cambia. Orden: 401 → 403 → 404 →
        400 → 410 → 409 → 422.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F05#2, E5-F05#3, E5-F05#4, E5-F05#7, E5-B05#3, E5-B05#4, E5-B05#5, E5-B05#12, E5-B05#13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudEdicionItems'
      responses:
        '200':
          description: Resultado de la edición.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoEdicionItems'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConsultaNoAbierta'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '422':
          $ref: '#/components/responses/FilaRechazada'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/jira/consultas/{id}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    post:
      operationId: confirmarConsulta
      tags: [Consulta]
      summary: Confirmar (o continuar la confirmación)
      description: |
        D140. **No llama a Jira ni lee la configuración**: usa el proyecto y
        el host guardados en la consulta. Orden: 401 → 403 → 404 → 400 → 410
        → 409 `CONSULTA_NO_ABIERTA` → 409 `CONSULTA_MODIFICADA` (la `version`
        no es la actual) → 422 `SIN_SELECCION` (ninguna fila marcada sin
        aplicar) → 409 `INTEGRACION_EN_CURSO` → pre-validación de **todas**
        las asignaciones marcadas sin aplicar (`POST
        /v1/interno/integraciones/asignaciones/validar`): si alguna dejó de
        ser válida → 409 `ASIGNACIONES_INVALIDAS`, nada se escribe, esas
        filas quedan desmarcadas y no se registra ejecución; si Organización
        no responde → 503 sin ejecución. Luego registra la ejecución
        `CONFIRMACION` y escribe por lotes de 25 con el upsert de Organización
        en modo confirmación (`consultaId`, `operacion` por fila) y el token
        del Administrador: crea las `NUEVA` marcadas con su asignación y
        actualiza solo título, descripción y prioridad de las `CAMBIO`
        marcadas. Cada fila procesada queda `aplicada` y deja su fila de
        detalle (con `asignacion` en nombres). Si el presupuesto (D114) u
        Organización cortan: `INCOMPLETA` (o `FALLIDA` si no se aplicó nada)
        con `ORGANIZACION_NO_DISPONIBLE` o `PRESUPUESTO_DE_TIEMPO`, la
        consulta sigue `ABIERTA` con `pendientes`, y repetir esta ruta (con la
        `version` nueva) procesa solo lo no aplicado. Al aplicar la última:
        `CONFIRMADA`, purga todas las filas y cuenta las no marcadas en
        `descartadas`. Dos confirmaciones simultáneas: una sola ejecución (la
        otra, 409 `INTEGRACION_EN_CURSO` o `CONSULTA_NO_ABIERTA`).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F05#5, E5-F05#6, E5-F05#9, E5-F05#10, E5-F05#11, E5-F05#12, E5-B05#3, E5-B05#6, E5-B05#7, E5-B05#8, E5-B05#9, E5-B05#11, E5-B05#12, E5-B05#14, E5-B04#4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudConfirmacion'
      responses:
        '200':
          description: Ejecución `CONFIRMACION` cerrada y la consulta después.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoConfirmacion'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoConfirmar'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '422':
          $ref: '#/components/responses/SinSeleccion'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/jira/consultas/{id}/descartes:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    post:
      operationId: descartarConsulta
      tags: [Consulta]
      summary: Descartar la consulta
      description: |
        Pasa la consulta a `DESCARTADA`, purga sus filas, sube `version` y
        guarda quién la cerró. No crea HDU ni registra ejecución. Otra vez, o
        sobre una cerrada: 409 `CONSULTA_NO_ABIERTA`; vencida: 410.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F05#8, E5-B05#10, E5-B05#11]
      responses:
        '200':
          description: Consulta descartada.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Consulta'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConsultaNoAbierta'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  # ------------------------------------------------------------- Archivos
  /v1/integraciones/archivos/vista-previa:
    post:
      operationId: previsualizarArchivo
      tags: [Archivos]
      summary: Validar y simular la importación de un archivo
      description: |
        Valida estructura y filas y simula con el upsert de Organización
        (`soloSimular: true`). No escribe, no audita y no registra ejecución
        (E5-B03-T01, E5-B04-T13). Errores de estructura: 413 o 422 con
        `ErrorArchivo` (`ejecucionId: null`). Exige Jira configurado solo si
        alguna fila necesita el destino por defecto (D99); si falta, esas
        filas salen con error `QE_INVALIDO`/`CELULA_NO_ENCONTRADA` según el
        campo que falte.
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F03#1, E5-F03#2, E5-B03#1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudArchivo'
      responses:
        '200':
          description: Vista previa.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/VistaPreviaArchivo'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '413':
          $ref: '#/components/responses/ArchivoMuyGrande'
        '422':
          $ref: '#/components/responses/ArchivoInvalido'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/archivos/importaciones:
    post:
      operationId: importarArchivo
      tags: [Archivos]
      summary: Importar un archivo
      description: |
        Valida todo de nuevo (no confía en la vista previa) y registra la
        ejecución apenas pasa la autorización. Modo normal: cada fila es su
        transacción en Organización; las válidas se importan y las demás se
        informan. Modo estricto (D125): simula el archivo completo y, si hay
        una sola fila con error, no escribe nada (200 `FALLIDA` con
        `MODO_ESTRICTO`); si no hay errores, escribe en lotes atómicos.
        Estructura inválida: 422 con `ErrorArchivo.ejecucionId` de la
        ejecución `FALLIDA` registrada con nombre, tamaño y huella. Un 413 no
        registra ejecución. Una `INCOMPLETA` no tiene `continuarDesde`: se
        repite el mismo archivo y lo ya importado queda `SIN_CAMBIOS` (D118).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E5-F03#1, E5-F03#2, E5-F03#3, E5-B03#1, E5-B03#2, E5-B03#3, E5-B04#1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudArchivo'
      responses:
        '200':
          description: Ejecución cerrada.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Ejecucion'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/EjecucionEnCurso'
        '413':
          $ref: '#/components/responses/ArchivoMuyGrande'
        '422':
          $ref: '#/components/responses/ArchivoInvalido'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  # ------------------------------------------------------------ Historial
  /v1/integraciones/ejecuciones:
    get:
      operationId: listarEjecuciones
      tags: [Historial]
      summary: Historial de ejecuciones
      description: |
        Todas las ejecuciones con su fase y sus contadores, para Administrador,
        QE y Auditor (D106: el resumen no revela HDU). QE y Auditor ven las
        ejecuciones de consulta, nunca el borrador (D142). Por `iniciadaEn`
        descendente. `desde` y `hasta` son fechas de Chile
        (`America/Santiago`), inclusivas.
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#2, E5-F04#4, E5-B04#2, E5-B04#4, E5-B05#14]
      parameters:
        - name: origen
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/OrigenEjecucion'
        - name: fase
          in: query
          required: false
          description: 'D141. Las ejecuciones anteriores a D132 y las de archivo son `DIRECTA`.'
          schema:
            $ref: './comun.v1.yaml#/components/schemas/FaseEjecucion'
        - name: resultado
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ResultadoEjecucion'
        - name: desde
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Fecha'
        - name: hasta
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Fecha'
        - name: orden
          in: query
          required: false
          description: '`iniciadaEn:asc` o `iniciadaEn:desc` (por defecto). Otra columna → 400.'
          schema:
            type: string
            pattern: '^iniciadaEn:(asc|desc)$'
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de ejecuciones.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaEjecuciones'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/ejecuciones/{id}:
    parameters:
      - $ref: '#/components/parameters/EjecucionId'
    get:
      operationId: obtenerEjecucion
      tags: [Historial]
      summary: Una ejecución con contadores, eventos y error
      description: Inexistente → 404 para Administrador y Auditor; 403 para el QE (D106).
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#1, E5-F04#3, E5-F04#4, E5-B04#1, E5-B04#3]
      responses:
        '200':
          description: Ejecución.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Ejecucion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: './comun.v1.yaml#/components/responses/NoEncontrado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/ejecuciones/{id}/detalle:
    parameters:
      - $ref: '#/components/parameters/EjecucionId'
    get:
      operationId: listarFilasEjecucion
      tags: [Historial]
      summary: Filas de una ejecución
      description: |
        Por `fila` ascendente. Visibilidad (D106): Administrador y Auditor,
        todo. QE: filas cuyo `idHistoria` está en su ámbito (`GET
        /v1/interno/hdu/ambito` de Organización, una llamada) más las filas
        `ERROR` completas con `titulo: null`; las demás se cuentan en
        `filasOcultas`. `soloErrores=true` equivale a `resultado=ERROR`;
        ambos a la vez con otro resultado → 400. Fase `CONSULTA`: siempre 0
        filas (el detalle es la consulta mientras vive, D141). Fase
        `CONFIRMACION`: cada fila trae `asignacion` en nombres.
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F03#3, E5-F04#3, E5-F04#4, E5-F05#5, E5-B04#2, E5-B04#4, E5-B05#14]
      parameters:
        - name: resultado
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ResultadoFila'
        - name: soloErrores
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de filas.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaFilasEjecucion'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: './comun.v1.yaml#/components/responses/NoEncontrado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/estado:
    get:
      operationId: obtenerEstadoIntegracion
      tags: [Historial]
      summary: Última ejecución, última completada y ejecución en curso
      description: |
        «Última completada» = la más reciente `EXITOSA` o `CON_ERRORES`
        (D121; una consulta o una confirmación cuentan). Para el
        Administrador agrega `jiraConfigurado`; `continuar` ya no se emite
        (D150: las ejecuciones directas no se continúan). El portal lo consulta
        tras `SIN_RESPUESTA` (D115) y, con una ejecución ajena en curso, cada 3 s
        hasta 30 s (diseño 4.3).
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#1, E5-F02#1]
      responses:
        '200':
          description: Estado.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/EstadoIntegracion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

components:
  securitySchemes:
    sesionSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth del usuario, propagado por el gateway.

  parameters:
    EjecucionId:
      name: id
      in: path
      required: true
      description: UUID de la ejecución.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    ConsultaId:
      name: id
      in: path
      required: true
      description: UUID de la consulta.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'

  responses:
    TokenNoDescifrable:
      description: El token guardado no se puede descifrar con la llave actual (D94). Hay que volver a ingresarlo.
      x-codigos: [TOKEN_NO_DESCIFRABLE]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: TOKEN_NO_DESCIFRABLE
            mensaje: Vuelve a ingresar el API token.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    DestinoInvalido:
      description: Célula o sprint inexistentes, sprint de respaldo de otra célula (D120), o QE inexistente, inactivo o sin rol QE.
      x-codigos: [CATALOGO_INVALIDO, QE_INVALIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: CATALOGO_INVALIDO
            mensaje: La célula o el sprint indicados no existen.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles:
              - campo: sprintRespaldoId
                codigo: NO_PERMITIDO
                mensaje: El sprint de respaldo debe pertenecer a la célula elegida.
    IntegracionNoDisponible:
      description: '`LLAVE_CIFRADO_NO_DISPONIBLE` si falta o es inválida `INTEGRACIONES_LLAVE_CIFRADO` (sin nombrar ni mostrar la variable); `SERVICIO_NO_DISPONIBLE` si Organización no responde.'
      x-codigos: [LLAVE_CIFRADO_NO_DISPONIBLE, SERVICIO_NO_DISPONIBLE]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: LLAVE_CIFRADO_NO_DISPONIBLE
            mensaje: La integración no está habilitada en el servidor.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    ConflictoConsultar:
      description: 'Sin configuración, token no descifrable, otra ejecución en curso o una consulta abierta sin `reemplazar` (`ErrorConsultaAbierta`). No se llama a Jira ni se registra ejecución.'
      x-codigos: [JIRA_NO_CONFIGURADO, TOKEN_NO_DESCIFRABLE, INTEGRACION_EN_CURSO, CONSULTA_ABIERTA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsultaAbierta'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: CONSULTA_ABIERTA
            mensaje: Ya hay una consulta abierta.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
            consultaId: 6f1c2d3e-4a5b-4c6d-8e7f-901234567890
            creadaPor:
              id: 0b9a6a2e-7c6f-4d4b-9a3e-1f2d3c4b5a69
              nombre: Admin Uno
            creadaEn: '2026-11-02T13:20:00Z'
            asignadas: 3
    ConflictoContinuar:
      description: 'Consulta cerrada (`ErrorConsulta`), llena (500 filas), completa (`hayMas: false`), sin configuración, token no descifrable u otra ejecución en curso. No se llama a Jira ni se registra ejecución.'
      x-codigos: [CONSULTA_NO_ABIERTA, CONSULTA_LLENA, CONSULTA_COMPLETA, JIRA_NO_CONFIGURADO, TOKEN_NO_DESCIFRABLE, INTEGRACION_EN_CURSO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsulta'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
    ConflictoConfirmar:
      description: 'Consulta cerrada o modificada (`ErrorConsulta`, con la `version` actual), asignaciones que dejaron de ser válidas (`ErrorAsignacionesInvalidas`) u otra ejecución en curso. Ninguno escribe HDU ni registra ejecución.'
      x-codigos: [CONSULTA_NO_ABIERTA, CONSULTA_MODIFICADA, ASIGNACIONES_INVALIDAS, INTEGRACION_EN_CURSO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorAsignacionesInvalidas'
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsulta'
