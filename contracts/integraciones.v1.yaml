  /v1/integraciones/jira/consultas/{id}/items/{itemId}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: confirmarItemConsulta
      tags: [Consulta]
      summary: Confirmar la asignación de una HDU (crea esa HDU)
      description: |
        D202, ADR 0018. **No llama a Jira ni lee la configuración.** Solo
        filas `NUEVA` completas; no exige `marcada` (el clic es la
        intención). Orden de validación: 401 → 403 → 404 (consulta o fila) →
        400 (cuerpo; campos desconocidos) → 410 `CONSULTA_VENCIDA` → 409
        `CONSULTA_NO_ABIERTA` → 422 `FILA_NO_ASIGNABLE` (no es `NUEVA`) →
        409 `HDU_YA_ASIGNADA` (la fila ya tiene `yaAsignada`) → reintento
        idempotente (fila ya `aplicada` por **este** Administrador: 200 con
        `repetida: true`; por otro: 409 `HDU_YA_ASIGNADA`) → 409
        `FILA_MODIFICADA` (`revision` distinta, trae la fila) → 422
        `ASIGNACION_INCOMPLETA` (con `detalles[]` por campo) → **toma
        atómica** (`UPDATE … SET aplicando_desde = now() WHERE id_item = $1
        AND revision = $2 AND NOT aplicada AND (aplicando_desde IS NULL OR
        aplicando_desde < now() - 30 s)`; 0 filas → 409 `FILA_EN_CURSO`) →
        `asignaciones/validar` (inválida → 409 `ASIGNACIONES_INVALIDAS` con
        una fila: se limpia el campo afectado, se desmarca y se libera la
        toma) → `hdu/upsert` en modo confirmación con **una** fila `CREAR`
        y su asignación → en una transacción: fila `aplicada` y `marcada`
        (CHECK `aplicada_marcada`), `id_historia`, `aplicacion` con
        `alcance: HDU`, `revision` y `version` suben, `consulta.creadas`
        suma 1, y se inserta la ejecución `CONFIRMACION` **ya cerrada**
        (`alcance: HDU`, `leidas = creadas = 1`, una fila de detalle con
        `asignacion`), de modo que nunca ocupa el índice
        `ejecucion_en_curso_key` de D104. Si el upsert devuelve `OMITIDA`
        `HDU_CREADA_DESPUES` con `existente`: si la creó esta consulta y
        este actor → 200 `repetida: true` (se marca la fila y se registra la
        ejecución si faltaba); si no → se guarda `yaAsignada` con los
        nombres **actuales**, se desmarca la fila y responde 409
        `HDU_YA_ASIGNADA`. Si Organización no responde → se libera la toma y
        503 `SERVICIO_NO_DISPONIBLE` (el reintento es idempotente). La
        consulta sigue `ABIERTA` y su `venceEn` no cambia (D205). Usa el
        cubo de tasa de la edición (`LIMITE_TASA_CONSULTA_MAX`, D152).
