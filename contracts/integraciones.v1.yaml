    ConsultaNoEncontrada:
      description: 'Id de consulta inexistente, o `itemId` de otra consulta (solo Administrador; el resto recibe 403, D142).'
      x-codigos: [CONSULTA_NO_ENCONTRADA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    FilaRechazada:
      description: 'Alcance de una sola fila rechazado (D145). `detalles[0].campo` es el campo de la asignación (`qeId`, `analistaId`, `sprintId`, `celulaId`) o `itemId`; con `ASIGNACION_INCOMPLETA`, un detalle por campo faltante. `HDU_YA_ASIGNADA` (D204, solo `NUEVA` con `yaAsignada`) trae `ErrorHduYaAsignada`; `FILA_EN_CURSO` (D202) es otra petición confirmando esa fila. Nada cambia y `version` no sube.'
      x-codigos: [QE_INVALIDO, ANALISTA_INVALIDO, ANALISTA_FUERA_DE_EQUIPO, CATALOGO_INVALIDO, ASIGNACION_INCOMPLETA, FILA_NO_MARCABLE, FILA_NO_ASIGNABLE, FILA_EN_CURSO, HDU_YA_ASIGNADA]
