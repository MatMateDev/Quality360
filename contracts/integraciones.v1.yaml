        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudArchivo'
      responses:
        '200':
          description: Ejecución cerrada.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Ejecucion'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/EjecucionEnCurso'
        '413':
          $ref: '#/components/responses/ArchivoMuyGrande'
        '422':
          $ref: '#/components/responses/ArchivoInvalido'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  # ------------------------------------------------------------ Historial
  /v1/integraciones/ejecuciones:
    get:
      operationId: listarEjecuciones
      tags: [Historial]
      summary: Historial de ejecuciones
      description: |
        Todas las ejecuciones con su fase y sus contadores, para Administrador,
        QE y Auditor (D106: el resumen no revela HDU). QE y Auditor ven las
        ejecuciones de consulta, nunca el borrador (D142). Por `iniciadaEn`
        descendente. `desde` y `hasta` son fechas de Chile
        (`America/Santiago`), inclusivas.
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#2, E5-F04#4, E5-F04#5, E5-B04#2, E5-B04#4, E5-B04#5, E5-B05#14, E5-B07#15]
      parameters:
        - name: alcance
          in: query
          required: false
          description: 'D206. `HDU` = confirmaciones de una sola fila (chip «Una HDU»); `LOTE` = el resto.'
          schema:
            $ref: './comun.v1.yaml#/components/schemas/AlcanceEjecucion'
        - name: origen
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/OrigenEjecucion'
        - name: fase
          in: query
          required: false
          description: 'D141. Las ejecuciones anteriores a D132 y las de archivo son `DIRECTA`.'
          schema:
            $ref: './comun.v1.yaml#/components/schemas/FaseEjecucion'
        - name: resultado
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ResultadoEjecucion'
        - name: desde
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Fecha'
        - name: hasta
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Fecha'
        - name: orden
          in: query
          required: false
          description: '`iniciadaEn:asc` o `iniciadaEn:desc` (por defecto). Otra columna → 400.'
          schema:
            type: string
            pattern: '^iniciadaEn:(asc|desc)$'
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de ejecuciones.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaEjecuciones'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/ejecuciones/{id}:
    parameters:
      - $ref: '#/components/parameters/EjecucionId'
    get:
      operationId: obtenerEjecucion
      tags: [Historial]
      summary: Una ejecución con contadores, eventos y error
      description: Inexistente → 404 para Administrador y Auditor; 403 para el QE (D106).
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#1, E5-F04#3, E5-F04#4, E5-F04#5, E5-B04#1, E5-B04#3, E5-B04#5]
      responses:
        '200':
          description: Ejecución.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/Ejecucion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: './comun.v1.yaml#/components/responses/NoEncontrado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/ejecuciones/{id}/detalle:
    parameters:
      - $ref: '#/components/parameters/EjecucionId'
    get:
      operationId: listarFilasEjecucion
      tags: [Historial]
      summary: Filas de una ejecución
      description: |
        Por `fila` ascendente. Visibilidad (D106): Administrador y Auditor,
        todo. QE: filas cuyo `idHistoria` está en su ámbito (`GET
        /v1/interno/hdu/ambito` de Organización, una llamada) más las filas
        `ERROR` completas con `titulo: null`; las demás se cuentan en
        `filasOcultas`. `soloErrores=true` equivale a `resultado=ERROR`;
        ambos a la vez con otro resultado → 400. Fase `CONSULTA`: siempre 0
        filas (el detalle es la consulta mientras vive, D141). Fase
        `CONFIRMACION`: cada fila trae `asignacion` en nombres.
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F03#3, E5-F04#3, E5-F04#4, E5-F05#5, E5-B04#2, E5-B04#4, E5-B05#14, E5-B07#15]
      parameters:
        - name: resultado
          in: query
          required: false
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ResultadoFila'
        - name: soloErrores
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: './comun.v1.yaml#/components/parameters/Pagina'
        - $ref: './comun.v1.yaml#/components/parameters/TamanoPaginaBandeja'
      responses:
        '200':
          description: Página de filas.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/PaginaFilasEjecucion'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: './comun.v1.yaml#/components/responses/NoEncontrado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/estado:
    get:
      operationId: obtenerEstadoIntegracion
      tags: [Historial]
      summary: Última ejecución, última completada y ejecución en curso
      description: |
        «Última completada» = la más reciente `EXITOSA` o `CON_ERRORES`
        (D121; una consulta o una confirmación cuentan). Para el
        Administrador agrega `jiraConfigurado`; `continuar` ya no se emite
        (D150: las ejecuciones directas no se continúan). El portal lo consulta
        tras `SIN_RESPUESTA` (D115) y, con una ejecución ajena en curso, cada 3 s
        hasta 30 s (diseño 4.3).
      x-roles: [ADMINISTRADOR, QE, AUDITOR]
      x-hdu: [E5-F04#1, E5-F02#1]
      responses:
        '200':
          description: Estado.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/EstadoIntegracion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

components:
  securitySchemes:
    sesionSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth del usuario, propagado por el gateway.

  parameters:
    EjecucionId:
      name: id
      in: path
      required: true
      description: UUID de la ejecución.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    ConsultaId:
      name: id
      in: path
      required: true
      description: UUID de la consulta.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    ItemId:
      name: itemId
      in: path
      required: true
      description: UUID de la fila (`ItemConsulta.id`). De otra consulta → 404 `CONSULTA_NO_ENCONTRADA`.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'

  responses:
    TokenNoDescifrable:
      description: El token guardado no se puede descifrar con la llave actual (D94). Hay que volver a ingresarlo.
      x-codigos: [TOKEN_NO_DESCIFRABLE]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: TOKEN_NO_DESCIFRABLE
            mensaje: Vuelve a ingresar el API token.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    DestinoInvalido:
      description: Célula o sprint inexistentes, sprint de respaldo de otra célula (D120), o QE inexistente, inactivo o sin rol QE.
      x-codigos: [CATALOGO_INVALIDO, QE_INVALIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: CATALOGO_INVALIDO
            mensaje: La célula o el sprint indicados no existen.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles:
              - campo: sprintRespaldoId
                codigo: NO_PERMITIDO
                mensaje: El sprint de respaldo debe pertenecer a la célula elegida.
    IntegracionNoDisponible:
      description: '`LLAVE_CIFRADO_NO_DISPONIBLE` si falta o es inválida `INTEGRACIONES_LLAVE_CIFRADO` (sin nombrar ni mostrar la variable); `SERVICIO_NO_DISPONIBLE` si Organización no responde.'
      x-codigos: [LLAVE_CIFRADO_NO_DISPONIBLE, SERVICIO_NO_DISPONIBLE]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: LLAVE_CIFRADO_NO_DISPONIBLE
            mensaje: La integración no está habilitada en el servidor.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    ConflictoConsultar:
      description: 'Sin configuración, token no descifrable, otra ejecución en curso o una consulta abierta sin `reemplazar` (`ErrorConsultaAbierta`). No se llama a Jira ni se registra ejecución.'
      x-codigos: [JIRA_NO_CONFIGURADO, TOKEN_NO_DESCIFRABLE, INTEGRACION_EN_CURSO, CONSULTA_ABIERTA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsultaAbierta'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: CONSULTA_ABIERTA
            mensaje: Ya hay una consulta abierta.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
            consultaId: 6f1c2d3e-4a5b-4c6d-8e7f-901234567890
            creadaPor:
              id: 0b9a6a2e-7c6f-4d4b-9a3e-1f2d3c4b5a69
              nombre: Admin Uno
            creadaEn: '2026-11-02T13:20:00Z'
            asignadas: 3
    ConflictoContinuar:
      description: 'Consulta cerrada (`ErrorConsulta`), llena (500 filas), completa (`hayMas: false`), sin configuración, token no descifrable u otra ejecución en curso. No se llama a Jira ni se registra ejecución.'
      x-codigos: [CONSULTA_NO_ABIERTA, CONSULTA_LLENA, CONSULTA_COMPLETA, JIRA_NO_CONFIGURADO, TOKEN_NO_DESCIFRABLE, INTEGRACION_EN_CURSO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsulta'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
    ConflictoConfirmar:
      description: 'Consulta cerrada o modificada (`ErrorConsulta`, con la `version` actual), asignaciones que dejaron de ser válidas (`ErrorAsignacionesInvalidas`) u otra ejecución en curso. Ninguno escribe HDU ni registra ejecución.'
      x-codigos: [CONSULTA_NO_ABIERTA, CONSULTA_MODIFICADA, ASIGNACIONES_INVALIDAS, INTEGRACION_EN_CURSO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorAsignacionesInvalidas'
              - $ref: './comun.v1.yaml#/components/schemas/ErrorConsulta'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: CONSULTA_MODIFICADA
            mensaje: Otra persona modificó la consulta.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
            consultaId: 6f1c2d3e-4a5b-4c6d-8e7f-901234567890
            estado: ABIERTA
            version: 8
    ConsultaNoAbierta:
      description: 'La consulta está `CONFIRMADA`, `REEMPLAZADA` o `DESCARTADA` (trae `estado` y `cerradaPor`).'
      x-codigos: [CONSULTA_NO_ABIERTA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ErrorConsulta'
