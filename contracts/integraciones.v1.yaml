      x-codigos: [FILA_NO_ASIGNABLE, ASIGNACION_INCOMPLETA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: ASIGNACION_INCOMPLETA
            mensaje: Falta completar la asignación.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles:
              - campo: analistaId
                codigo: REQUERIDO
                mensaje: 'Falta: analista'
    SinSeleccion:
      description: No hay filas marcadas sin aplicar (D140).
      x-codigos: [SIN_SELECCION]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    EjecucionEnCurso:
      description: Otra consulta, confirmación o importación en curso (D104). No se registra ejecución.
      x-codigos: [INTEGRACION_EN_CURSO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    ArchivoMuyGrande:
      description: El contenido supera 1 MB. No se registra ejecución.
      x-codigos: [ARCHIVO_MUY_GRANDE]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ErrorArchivo'
    ArchivoInvalido:
      description: Error de estructura del archivo (sección 4.3 del backlog E5). No se importa nada.
      x-codigos: [ARCHIVO_VACIO, FORMATO_NO_SOPORTADO, ARCHIVO_ILEGIBLE, COLUMNAS_FALTANTES, DEMASIADAS_FILAS]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ErrorArchivo'
          example:
            codigo: COLUMNAS_FALTANTES
            mensaje: 'Faltan las columnas: titulo'
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
            ejecucionId: 0b9a6a2e-7c6f-4d4b-9a3e-1f2d3c4b5a69
            columnasFaltantes: [titulo]
