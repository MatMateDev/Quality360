        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/ConsultaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoConfirmar'
        '410':
          $ref: '#/components/responses/ConsultaVencida'
        '422':
          $ref: '#/components/responses/SinSeleccion'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  /v1/integraciones/jira/consultas/{id}/descartes:
    parameters:
      - $ref: '#/components/parameters/ConsultaId'
    post:
      operationId: descartarConsulta
      tags: [Consulta]
      summary: Descartar la consulta
      description: |
        Pasa la consulta a `DESCARTADA`, purga sus filas, sube `version` y
        guarda quién la cerró. No crea HDU ni registra ejecución. Otra vez, o
        sobre una cerrada: 409 `CONSULTA_NO_ABIERTA`; vencida: 410.
        Es también «Terminar revisión» (D205): las HDU ya creadas por fila
        se conservan siempre; `descartadas` cuenta las filas sin confirmar
        que se pierden y `creadas` se mantiene. Una fila con `aplicando`
        vigente no impide descartar: si su confirmación termina después,
        la HDU queda creada y la marca de la fila ya no se escribe (la fila
        se purgó); la ejecución `HDU` se registra igual.
