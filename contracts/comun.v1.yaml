openapi: 3.1.0
info:
  title: Quality360 · Componentes comunes
  version: 1.0.0
  license:
    name: Uso académico · Capstone Duoc UC
    identifier: LicenseRef-Capstone-Duoc-UC
  description: |
    Esquemas, respuestas y parámetros compartidos por `gateway.v1.yaml`,
    `organizacion.v1.yaml`, `certificaciones.v1.yaml` e `impedimentos.v1.yaml`. No es un contrato
    desplegable: se referencia con `$ref: './comun.v1.yaml#/...'`.

    ## Convenciones (ADR 0007)

    - JSON en UTF-8, nombres de campo en camelCase, fechas ISO 8601 en UTC.
    - Toda respuesta lleva la cabecera `x-trace-id`. Si la solicitud trae
      `x-trace-id`, se propaga; si no, el gateway genera uno. El mismo valor va
      en `Error.traceId`.
    - Los cuerpos de solicitud rechazan campos desconocidos (400 `VALIDACION`).
    - Paginación: `pagina` desde 1 y `tamanoPagina` de 1 a 100 (20 por
      defecto). La respuesta trae `items`, `total`, `pagina` y `tamanoPagina`.
    - Una lista vacía o un conteo 0 solo significan «consulta exitosa sin
      registros». Una fuente caída nunca se traduce en 0 ni en `[]`: se informa
      con un error o con un bloque `indisponible`.
    - Cada respuesta de error declara en `x-codigos` los valores posibles de
      `Error.codigo`.

    ## Estados HTTP

    | Estado | Uso |
    | --- | --- |
    | 400 | `VALIDACION`: esquema, obligatorios, formato o valor fuera de catálogo. `detalles[]` indica cada campo. |
    | 401 | `NO_AUTENTICADO` (sin token o token inválido) o `SESION_EXPIRADA` (token vencido). |
    | 403 | `ACCESO_DENEGADO`: rol no permitido, usuario inactivo o recurso fuera del ámbito. Mensaje genérico (D12). |
    | 404 | `NO_ENCONTRADO`: solo en recursos administrativos. Para QE, Analista QA y Líder QA, una HDU inexistente responde 403 igual que una fuera de ámbito. |
    | 409 | Conflicto con el estado actual: duplicados, transición inválida, cierre rechazado, último administrador, relaciones incompatibles, rol incompatible. |
    | 422 | Regla de negocio sobre datos bien formados: motivo requerido, supervisión inválida, analista fuera del equipo, catálogo inexistente, exportación que excede el límite. |

    ## Roles de solo lectura (E7, D32)

    `LIDER_QA` y `AUDITOR` nunca figuran en `x-roles` de una operación que
    modifica datos: «denegar por defecto». Toda operación nueva que escriba
    debe listar explícitamente sus roles. Las exportaciones del Auditor son
    `GET` y solo escriben su propio registro de auditoría.
    | 429 | `DEMASIADAS_SOLICITUDES` (límite de tasa del gateway). |
    | 500 | `ERROR_INTERNO`. |
    | 503 | `SERVICIO_NO_DISPONIBLE`, `PROVEEDOR_IDENTIDAD_NO_DISPONIBLE` o `CAPACIDAD_NO_DISPONIBLE`. |

paths: {}

components:
  schemas:
    # ------------------------------------------------------------------ base
    Uuid:
      type: string
      format: uuid
      examples: ['5b0c2f0e-8f1e-4c47-9a57-3a0f5d1e2b11']
    FechaHora:
      type: string
      format: date-time
      description: Instante en UTC, ISO 8601.
      examples: ['2026-09-15T14:30:00Z']
    Fecha:
      type: string
      format: date
      examples: ['2026-09-01']
    Rol:
      type: string
      description: |
        Catálogo cerrado de roles (D28). Un rol por usuario. El rol vigente se
        lee siempre desde Organización, nunca desde el token (D4). `LIDER_QA` y
        `AUDITOR` son de solo lectura (D32): ninguna operación que modifica
        datos los incluye en `x-roles`.
      enum: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
    EstadoHdu:
      type: string
      description: |
        Estados de HDU (D10). Solo se avanza un paso; `CERRADA` es terminal.

        | Desde | Transiciones permitidas |
        | --- | --- |
        | `PENDIENTE` | `DISENO_PRUEBAS` |
        | `DISENO_PRUEBAS` | `EN_EJECUCION` |
        | `EN_EJECUCION` | `PENDIENTE_CIERRE` |
        | `PENDIENTE_CIERRE` | `CERRADA`, `EN_EJECUCION` (reapertura) |
        | `CERRADA` | ninguna |

        Pasar a `CERRADA` exige el checklist completo según Certificaciones (D11)
        y que no haya impedimentos `ABIERTO` ni `ESCALADO` (D60).
      enum: [PENDIENTE, DISENO_PRUEBAS, EN_EJECUCION, PENDIENTE_CIERRE, CERRADA]
      x-transiciones:
        PENDIENTE: [DISENO_PRUEBAS]
        DISENO_PRUEBAS: [EN_EJECUCION]
        EN_EJECUCION: [PENDIENTE_CIERRE]
        PENDIENTE_CIERRE: [CERRADA, EN_EJECUCION]
        CERRADA: []
    PrioridadHdu:
      type: string
      enum: [BAJA, MEDIA, ALTA, CRITICA]

    # --------------------------------------------------------------- errores
    CodigoError:
      type: string
      description: |
        | Código | Estado | Mensaje de referencia |
        | --- | --- | --- |
        | `VALIDACION` | 400 | Los datos enviados no son válidos. |
        | `NO_AUTENTICADO` | 401 | Debes iniciar sesión. |
        | `SESION_EXPIRADA` | 401 | Tu sesión expiró. Inicia sesión nuevamente. |
        | `ACCESO_DENEGADO` | 403 | No tienes acceso a este recurso. |
        | `NO_ENCONTRADO` | 404 | El recurso solicitado no existe. |
        | `CORREO_DUPLICADO` | 409 | Ya existe un usuario con ese correo. |
        | `CODIGO_HDU_DUPLICADO` | 409 | Ya existe una HDU con ese identificador. |
        | `ULTIMO_ADMINISTRADOR` | 409 | La plataforma debe conservar al menos un administrador activo. |
        | `RELACIONES_INCOMPATIBLES` | 409 | Resuelve las relaciones de supervisión antes de continuar. (Con HDU abiertas o células vigentes, el mensaje las nombra; ver `ErrorRelacionesIncompatibles`, D31, D40, D43.) |
        | `ROL_INCOMPATIBLE` | 409 | El usuario no tiene el rol Líder QA. |
        | `TRANSICION_INVALIDA` | 409 | La HDU no puede pasar a ese estado. (En impedimentos: «Un impedimento resuelto solo puede reabrirse» o «El impedimento ya cambió de estado», ver `ErrorTransicionImpedimento`.) |
        | `CHECKLIST_INCOMPLETO` | 409 | No se puede cerrar la HDU: el checklist de entregables está incompleto. |
        | `CHECKLIST_NO_DISPONIBLE` | 409 | No se puede cerrar la HDU: el checklist de entregables no está disponible para verificarse. |
        | `HDU_CERRADA` | 409 | La HDU está cerrada y no admite cambios. |
        | `ORDEN_ENTREGABLES` | 409 | Completa el entregable anterior antes de continuar. |
        | `ENTREGABLE_YA_REGISTRADO` | 409 | El entregable ya está registrado para esta HDU. |
        | `ESTADO_ENTREGABLE_INVALIDO` | 409 | El entregable no está en un estado que permita esta acción. |
        | `ENTREGABLE_AUTOMATICO` | 409 | Este entregable se completa al generar el certificado. |
        | `ENTREGABLES_PENDIENTES` | 409 | No se puede generar el certificado: faltan entregables por aprobar. |
        | `CERTIFICADO_EXISTENTE` | 409 | La HDU ya tiene un certificado emitido. |
        | `HDU_BLOQUEADA` | 409 | No se puede cerrar la HDU: tiene impedimentos abiertos o escalados. (Ver `ErrorHduBloqueada`, D60, D77.) |
        | `MOTIVO_REQUERIDO` | 422 | Indica el motivo del cambio. |
        | `COMENTARIO_REQUERIDO` | 422 | Indica la acción tomada. |
        | `JUSTIFICACION_REQUERIDA` | 422 | La justificación es obligatoria. |
        | `RESPONSABLE_INVALIDO` | 422 | El responsable indicado no está entre los candidatos de esta HDU. |
        | `SUPERVISION_INVALIDA` | 422 | El supervisor debe ser QE y el supervisado Analista QA, ambos activos. |
        | `ANALISTA_INVALIDO` | 422 | El analista debe tener rol Analista QA y estar activo. |
        | `ANALISTA_FUERA_DE_EQUIPO` | 422 | El analista no pertenece al equipo vigente del QE responsable. |
        | `QE_INVALIDO` | 422 | El QE responsable debe tener rol QE y estar activo. |
        | `CATALOGO_INVALIDO` | 422 | La célula o el sprint indicados no existen. |
        | `EVIDENCIA_INVALIDA` | 422 | La evidencia debe ser un enlace https o un archivo PDF, PNG o JPEG de hasta 10 MB. |
        | `EXPORTACION_EXCEDE_LIMITE` | 422 | La exportación supera las 50.000 filas. Acota los filtros. |
        | `DEMASIADAS_SOLICITUDES` | 429 | Demasiadas solicitudes. Intenta más tarde. |
        | `ERROR_INTERNO` | 500 | Ocurrió un error inesperado. |
        | `SERVICIO_NO_DISPONIBLE` | 503 | El servicio no está disponible. Intenta nuevamente. |
        | `PROVEEDOR_IDENTIDAD_NO_DISPONIBLE` | 503 | No fue posible coordinar el cambio con el proveedor de identidad. |
        | `CAPACIDAD_NO_DISPONIBLE` | 503 | Esta capacidad aún no está disponible. |
      enum:
        - VALIDACION
        - NO_AUTENTICADO
        - SESION_EXPIRADA
        - ACCESO_DENEGADO
        - NO_ENCONTRADO
        - CORREO_DUPLICADO
        - CODIGO_HDU_DUPLICADO
        - ULTIMO_ADMINISTRADOR
        - RELACIONES_INCOMPATIBLES
        - ROL_INCOMPATIBLE
        - TRANSICION_INVALIDA
        - CHECKLIST_INCOMPLETO
        - CHECKLIST_NO_DISPONIBLE
        - HDU_CERRADA
        - ORDEN_ENTREGABLES
        - ENTREGABLE_YA_REGISTRADO
        - ESTADO_ENTREGABLE_INVALIDO
        - ENTREGABLE_AUTOMATICO
        - ENTREGABLES_PENDIENTES
        - CERTIFICADO_EXISTENTE
        - HDU_BLOQUEADA
        - MOTIVO_REQUERIDO
        - COMENTARIO_REQUERIDO
        - JUSTIFICACION_REQUERIDA
        - RESPONSABLE_INVALIDO
        - SUPERVISION_INVALIDA
        - ANALISTA_INVALIDO
        - ANALISTA_FUERA_DE_EQUIPO
        - QE_INVALIDO
        - CATALOGO_INVALIDO
        - EVIDENCIA_INVALIDA
        - EXPORTACION_EXCEDE_LIMITE
        - DEMASIADAS_SOLICITUDES
        - ERROR_INTERNO
        - SERVICIO_NO_DISPONIBLE
        - PROVEEDOR_IDENTIDAD_NO_DISPONIBLE
        - CAPACIDAD_NO_DISPONIBLE
    DetalleError:
      type: object
      required: [campo, codigo, mensaje]
      additionalProperties: false
      properties:
        campo:
          type: string
          description: Campo del cuerpo (`correo`), del query (`query.estado`) o de la ruta (`path.id`).
          examples: [correo]
        codigo:
          type: string
          enum: [REQUERIDO, FORMATO_INVALIDO, LONGITUD_INVALIDA, VALOR_NO_PERMITIDO, DUPLICADO, NO_EXISTE, NO_PERMITIDO]
        mensaje:
          type: string
          examples: [El correo es obligatorio.]
    Error:
      type: object
      description: Esquema de error común a todos los contratos.
      required: [codigo, mensaje, traceId, detalles]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoError'
        mensaje:
          type: string
          description: Texto para mostrar al usuario. Nunca revela si un correo existe ni detalles internos.
        traceId:
          type: string
          description: Igual a la cabecera `x-trace-id` de la respuesta.
          examples: ['4bf92f3577b34da6a3ce929d0e0e4736']
        detalles:
          type: array
          description: Errores por campo. Vacío cuando no aplica.
          items:
            $ref: '#/components/schemas/DetalleError'
    ErrorTransicionInvalida:
      description: 409 `TRANSICION_INVALIDA`. Lista las transiciones permitidas desde el estado actual (E2-B02#2).
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [estadoActual, estadoSolicitado, transicionesPermitidas]
          properties:
            estadoActual:
              $ref: '#/components/schemas/EstadoHdu'
            estadoSolicitado:
              $ref: '#/components/schemas/EstadoHdu'
            transicionesPermitidas:
              type: array
              items:
                $ref: '#/components/schemas/EstadoHdu'
    ErrorCierreRechazado:
      description: 409 `CHECKLIST_INCOMPLETO` o `CHECKLIST_NO_DISPONIBLE` al solicitar `CERRADA` (E2-B02#3, D11).
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [checklist]
          properties:
            checklist:
              $ref: '#/components/schemas/BloqueChecklist'
    ErrorHduBloqueada:
      description: |
        409 `HDU_BLOQUEADA` al pedir `CERRADA` con impedimentos `ABIERTO` o
        `ESCALADO` (D60, D77). Orden de validación: transición (D10) →
        checklist (D11) → impedimentos. El estado de la HDU no cambia.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [impedimentos]
          properties:
            impedimentos:
              $ref: '#/components/schemas/ListaImpedimentosBloqueantes'
    ErrorImpedimentosNoVerificables:
      description: |
        503 `SERVICIO_NO_DISPONIBLE` al pedir `CERRADA` cuando Impedimentos no
        responde (D60). Mensaje: «No pudimos verificar los impedimentos de la
        HDU». El bloque `impedimentos` permite al portal distinguirlo de una
        caída del gateway o de Organización.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [impedimentos]
          properties:
            impedimentos:
              $ref: '#/components/schemas/BloqueIndisponible'
    ErrorTransicionImpedimento:
      description: 409 `TRANSICION_INVALIDA` sobre un impedimento (E4-B02#3). Lista las operaciones que admite el estado actual.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [estadoActual, operacion, operacionesPermitidas]
          properties:
            estadoActual:
              $ref: '#/components/schemas/EstadoImpedimento'
            operacion:
              $ref: '#/components/schemas/OperacionImpedimento'
            operacionesPermitidas:
              type: array
              items:
                $ref: '#/components/schemas/OperacionImpedimento'
    ErrorRelacionesIncompatibles:
      description: |
        409 `RELACIONES_INCOMPATIBLES`. Indica qué relaciones de trabajo
        resolver antes de cambiar el rol o desactivar al usuario (E1-B08#3,
        D31, D40, D43). Los cuatro campos vienen siempre; los que no aplican
        van vacíos o en `null`. Se informan todas las relaciones a la vez, no
        solo la primera. No se aplicó ningún cambio.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [relaciones]
          properties:
            relaciones:
              type: object
              required: [analistasVigentes, supervisorVigente, hduAbiertas, celulasVigentes]
              properties:
                hduAbiertas:
                  type: object
                  description: |
                    HDU no cerradas donde el usuario es el analista asignado
                    (si es Analista QA) o el QE responsable (si es QE). Solo
                    las exige el cambio de rol (D40). `items` trae hasta 20,
                    ordenadas por código; `total` las cuenta todas.
                  required: [total, items]
                  additionalProperties: false
                  properties:
                    total:
                      type: integer
                      minimum: 0
                    items:
                      type: array
                      maxItems: 20
                      items:
                        $ref: '#/components/schemas/HduReferencia'
                celulasVigentes:
                  type: array
                  description: Células vigentes de un Líder QA, que deben quitarse antes de cambiarle el rol (D31).
                  items:
                    $ref: '#/components/schemas/CatalogoRef'
                analistasVigentes:
                  type: array
                  description: Analistas que el QE supervisa hoy y que deben reasignarse.
                  items:
                    $ref: '#/components/schemas/UsuarioResumen'
                supervisorVigente:
                  description: QE vigente del analista, que debe cambiarse antes de dejar el rol Analista QA.
                  oneOf:
                    - $ref: '#/components/schemas/UsuarioResumen'
                    - type: 'null'

    # ------------------------------------------------- bloques de composición
    FuenteDatos:
      type: string
      description: Capacidad que alimenta un bloque compuesto.
      enum: [organizacion.usuarios, organizacion.supervision, organizacion.hdu, organizacion.celulas, organizacion.auditoria, certificaciones.checklist, certificaciones.bitacora, certificaciones.certificados, impedimentos.impedimentos, impedimentos.riesgo]
    EstadoBloque:
      type: string
      enum: [ok, indisponible]
    BloqueCompuesto:
      type: object
      description: |
        Forma general de un bloque compuesto por el gateway. `datos` existe
        solo con `estado: ok`. Con `indisponible` no hay `datos`: el portal
        muestra «no disponible», nunca 0. Cada bloque concreto la especializa
        como unión discriminada por `estado`.
      required: [fuente, estado]
      properties:
        fuente:
          $ref: '#/components/schemas/FuenteDatos'
        estado:
          $ref: '#/components/schemas/EstadoBloque'
        datos:
          description: Presente solo si `estado` es `ok`.
    BloqueIndisponible:
      type: object
      required: [fuente, estado]
      additionalProperties: false
      properties:
        fuente:
          $ref: '#/components/schemas/FuenteDatos'
        estado:
          type: string
          const: indisponible
    BloqueChecklist:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              type: string
              const: certificaciones.checklist
            estado:
              type: string
              const: ok
            datos:
              $ref: '#/components/schemas/ResumenChecklist'
        - $ref: '#/components/schemas/BloqueIndisponible'
    ResumenChecklist:
      type: object
      description: Avance del checklist de entregables de una HDU. Lo entrega Certificaciones a partir de E3.
      required: [hduId, totalEntregables, completados, porcentajeCumplimiento, completo]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        totalEntregables:
          type: integer
          minimum: 0
          examples: [10]
        completados:
          type: integer
          minimum: 0
        porcentajeCumplimiento:
          type: number
          minimum: 0
          maximum: 100
        completo:
          type: boolean
          description: Verdadero si todos los entregables aplicables están completos y aprobados.

    # ------------------------------------------------------- checklist (E3)
    ClaveEntregable:
      type: string
      description: Entregables del checklist, en su orden obligatorio (D15, D17).
      enum: [PLAN_PRUEBAS, DASHBOARD, CASOS_PRUEBA, APROBACION_CASOS, EJECUCION, EVIDENCIAS, DEFECTOS, APROBACION_UAT, CERTIFICADO, CIERRE_PRUEBAS]
    EstadoEntregable:
      type: string
      description: '`PENDIENTE → POR_APROBAR → APROBADO`. Un rechazo del QE vuelve a `PENDIENTE` con observaciones (D16).'
      enum: [PENDIENTE, POR_APROBAR, APROBADO]
    PersonaFecha:
      type: object
      description: Quién hizo algo y cuándo.
      required: [id, nombre, fecha]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        fecha:
          $ref: '#/components/schemas/FechaHora'
    Evidencia:
      description: Evidencia registrada de un entregable (D20). `CERTIFICADO` solo aparece en el entregable 9.
      oneOf:
        - type: object
          required: [tipo, url]
          additionalProperties: false
          properties:
            tipo:
              type: string
              const: ENLACE
            url:
              type: string
              format: uri
        - type: object
          required: [tipo, nombre, tipoContenido, tamanoBytes]
          additionalProperties: false
          properties:
            tipo:
              type: string
              const: ARCHIVO
            nombre:
              type: string
            tipoContenido:
              type: string
              enum: [application/pdf, image/png, image/jpeg]
            tamanoBytes:
              type: integer
              minimum: 1
        - type: object
          required: [tipo, folio]
          additionalProperties: false
          properties:
            tipo:
              type: string
              const: CERTIFICADO
            folio:
              type: string
    Observacion:
      type: object
      description: Comentario del último rechazo del QE (E3-F03#2).
      required: [comentario, autor]
      additionalProperties: false
      properties:
        comentario:
          type: string
        autor:
          $ref: '#/components/schemas/PersonaFecha'
    Entregable:
      type: object
      required: [clave, orden, nombre, estado, evidencia, completado, aprobado, observacion]
      additionalProperties: false
      properties:
        clave:
          $ref: '#/components/schemas/ClaveEntregable'
        orden:
          type: integer
          minimum: 1
          maximum: 10
        nombre:
          type: string
          examples: [Plan de pruebas]
        estado:
          $ref: '#/components/schemas/EstadoEntregable'
        evidencia:
          oneOf:
            - $ref: '#/components/schemas/Evidencia'
            - type: 'null'
        completado:
          description: Analista que lo marcó y cuándo (E3-B01#1).
          oneOf:
            - $ref: '#/components/schemas/PersonaFecha'
            - type: 'null'
        aprobado:
          description: QE que lo aprobó y cuándo (E3-F03#1).
          oneOf:
            - $ref: '#/components/schemas/PersonaFecha'
            - type: 'null'
        observacion:
          oneOf:
            - $ref: '#/components/schemas/Observacion'
            - type: 'null'
    CertificadoResumen:
      type: object
      required: [folio, emitido, huellaSha256]
      additionalProperties: false
      properties:
        folio:
          type: string
          pattern: '^Q360-\d{4}-[A-Z2-7]{8}$'
          examples: [Q360-2026-K7M2QX4A]
        emitido:
          $ref: '#/components/schemas/PersonaFecha'
        huellaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ChecklistHdu:
      type: object
      description: Checklist completo de una HDU con lo que puede hacer quien consulta (E3-F01).
      required: [hduId, resumen, entregables, permisos, certificado, certificacion]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        resumen:
          $ref: '#/components/schemas/ResumenChecklist'
        entregables:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/Entregable'
        permisos:
          type: object
          required: [puedeMarcar, puedeAprobar, puedeGenerarCertificado]
          additionalProperties: false
          properties:
            puedeMarcar:
              type: boolean
              description: Analista asignado y HDU no cerrada (D18, E3-F01#3).
            puedeAprobar:
              type: boolean
              description: QE responsable y HDU no cerrada (D18).
            puedeGenerarCertificado:
              type: boolean
              description: QE responsable, sin certificado previo y HDU no cerrada.
        certificado:
          oneOf:
            - $ref: '#/components/schemas/CertificadoResumen'
            - type: 'null'
        certificacion:
          type: object
          description: Si hoy se puede generar el certificado y, si no, por qué (E3-F04#2).
          required: [habilitada, motivo, faltantes]
          additionalProperties: false
          properties:
            habilitada:
              type: boolean
            motivo:
              type: [string, 'null']
            faltantes:
              type: array
              items:
                $ref: '#/components/schemas/ClaveEntregable'
    EntradaEvidencia:
      description: Evidencia al marcar. El archivo debe haberse subido antes con la URL firmada de `SubidaEvidencia`.
      oneOf:
        - type: object
          required: [tipo, url]
          additionalProperties: false
          properties:
            tipo:
              type: string
              const: ENLACE
            url:
              type: string
              format: uri
              pattern: '^https://'
              maxLength: 500
        - type: object
          required: [tipo, ruta]
          additionalProperties: false
          properties:
            tipo:
              type: string
              const: ARCHIVO
            ruta:
              type: string
              maxLength: 500
    SolicitudMarca:
      type: object
      required: [evidencia]
      additionalProperties: false
      properties:
        evidencia:
          $ref: '#/components/schemas/EntradaEvidencia'
    SolicitudDesmarca:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
    SolicitudRechazo:
      type: object
      required: [comentario]
      additionalProperties: false
      properties:
        comentario:
          type: string
          minLength: 1
          maxLength: 1000
    SolicitudSubidaEvidencia:
      type: object
      required: [nombreArchivo, tipoContenido, tamanoBytes]
      additionalProperties: false
      properties:
        nombreArchivo:
          type: string
          minLength: 1
          maxLength: 200
        tipoContenido:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
        tamanoBytes:
          type: integer
          minimum: 1
          maximum: 10485760
    SubidaEvidencia:
      type: object
      description: URL firmada para subir el archivo directo a Supabase Storage (bucket privado `evidencias`, D20).
      required: [ruta, urlSubida, token, expiraEn]
      additionalProperties: false
      properties:
        ruta:
          type: string
        urlSubida:
          type: string
          format: uri
        token:
          type: string
        expiraEn:
          $ref: '#/components/schemas/FechaHora'
    EnlaceDescarga:
      type: object
      required: [url, expiraEn]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        expiraEn:
          $ref: '#/components/schemas/FechaHora'
    CertificadoDescarga:
      type: object
      required: [hduId, certificado, descarga]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        certificado:
          $ref: '#/components/schemas/CertificadoResumen'
        descarga:
          $ref: '#/components/schemas/EnlaceDescarga'
    VerificacionCertificado:
      type: object
      description: Resultado público de verificar un folio (E3-B03#2, D21). No expone datos personales salvo el nombre del emisor.
      required: [folio, valido, hdu, emitidoEn, emitidoPor, huellaSha256]
      additionalProperties: false
      properties:
        folio:
          type: string
        valido:
          type: boolean
        hdu:
          type: object
          required: [codigo, titulo]
          additionalProperties: false
          properties:
            codigo:
              type: string
            titulo:
              type: string
        emitidoEn:
          $ref: '#/components/schemas/FechaHora'
        emitidoPor:
          type: string
        huellaSha256:
          type: string
    BandejaAprobaciones:
      type: object
      description: Entregables `POR_APROBAR` de las HDU donde el QE es responsable, agrupados por HDU (E3-F03#3).
      required: [total, grupos]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        grupos:
          type: array
          items:
            type: object
            required: [hdu, entregables]
            additionalProperties: false
            properties:
              hdu:
                $ref: '#/components/schemas/HduParaCertificacion'
              entregables:
                type: array
                items:
                  $ref: '#/components/schemas/Entregable'
    EventoChecklist:
      type: object
      required: [id, accion, clave, actor, fecha, valorAnterior, valorNuevo, motivo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        accion:
          $ref: '#/components/schemas/AccionChecklist'
        clave:
          $ref: '#/components/schemas/ClaveEntregable'
        actor:
          $ref: '#/components/schemas/PersonaRol'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        valorAnterior:
          type: [object, 'null']
          description: Estado y datos del entregable antes del cambio.
        valorNuevo:
          type: [object, 'null']
        motivo:
          type: [string, 'null']
          description: Motivo del retroceso o comentario del rechazo (E3-B04#2).
    AccionChecklist:
      type: string
      description: |
        Catálogo de acciones de la bitácora de checklist (D22, D45). El código
        es estable; el portal muestra el infinitivo en filtros y columnas del
        Auditor y el pasado en el historial de la HDU.

        | Código | Filtro y columna (Auditor) | Historial de la HDU |
        | --- | --- | --- |
        | `MARCAR` | Marcar | marcó |
        | `DESMARCAR` | Desmarcar | desmarcó |
        | `APROBAR` | Aprobar | aprobó |
        | `RECHAZAR` | Rechazar | rechazó |
        | `GENERAR_CERTIFICADO` | Certificar | generó el certificado de |
      enum: [MARCAR, DESMARCAR, APROBAR, RECHAZAR, GENERAR_CERTIFICADO]
    BitacoraChecklist:
      type: object
      required: [hduId, eventos]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        eventos:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/EventoChecklist'

    # ------------------------------------------------------ actores y usuarios
    Actor:
      type: object
      description: Quien ejecutó un cambio. Un servicio aparece solo en cargas semilla.
      required: [tipo, id, nombre]
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [USUARIO, SERVICIO]
        id:
          type: string
          description: UUID del usuario, o nombre del servicio (`integraciones`).
        nombre:
          type: string
    UsuarioResumen:
      type: object
      required: [id, nombre, correo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          examples: [Camila Rojas]
        correo:
          type: string
          format: email
          examples: [camila.rojas@quality360.local]
    Perfil:
      type: object
      description: Datos mínimos del usuario autenticado (E1-B10). Sin contraseñas, tokens ni metadatos del proveedor.
      required: [id, nombre, correo, rol]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
    Usuario:
      type: object
      required: [id, nombre, correo, rol, activo, supervisorVigente, analistasVigentes, celulasVigentes, creadoEn, actualizadoEn]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        supervisorVigente:
          description: QE vigente. Solo aplica a `ANALISTA_QA`; `null` si no tiene o si el rol es otro.
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        analistasVigentes:
          type: integer
          minimum: 0
          description: Analistas que supervisa hoy. Solo aplica a `QE`; 0 para otros roles.
        celulasVigentes:
          type: array
          description: Células vigentes si el rol es `LIDER_QA`, ordenadas por nombre; vacío para otros roles (D30, D44).
          items:
            $ref: '#/components/schemas/CatalogoRef'
        creadoEn:
          $ref: '#/components/schemas/FechaHora'
        actualizadoEn:
          $ref: '#/components/schemas/FechaHora'
    PaginaUsuarios:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    NuevoUsuario:
      type: object
      required: [nombre, correo, rol]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          description: Se recortan espacios; vacío tras recortar es `REQUERIDO`.
        correo:
          type: string
          format: email
          maxLength: 150
          description: Se normaliza a minúsculas. Único sin distinguir mayúsculas.
        rol:
          $ref: '#/components/schemas/Rol'
        celulaIds:
          $ref: '#/components/schemas/CelulaIdsLider'
    ActualizacionUsuario:
      type: object
      description: Cambia datos o estado de acceso. El rol se cambia con `PUT /v1/usuarios/{id}/rol`.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 150
          description: El `id` no cambia; Organización actualiza el correo también en Supabase Auth (E1-B07#2).
        activo:
          type: boolean
          description: '`false` desactiva: el usuario pierde acceso en su siguiente solicitud aunque su token siga vigente. No borra historial.'
    CambioRol:
      type: object
      description: |
        Cambio de rol atómico (D42). Con `rol: LIDER_QA`, `celulaIds` fija sus
        células vigentes en la misma transacción que el rol: o se aplica todo o
        nada. Omitido o vacío = Líder sin células (permitido, E7-F07#2). Si el
        usuario ya es Líder QA, `celulaIds` reemplaza sus células igual que
        `PUT /v1/usuarios/{id}/celulas-lider`.
      required: [rol]
      additionalProperties: false
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
        celulaIds:
          $ref: '#/components/schemas/CelulaIdsLider'
    CelulaIdsLider:
      type: array
      description: |
        Células a cargo de un Líder QA (D30, D42). Solo se acepta con
        `rol: LIDER_QA`; con otro rol y una lista no vacía, 400 `VALIDACION`
        con `{campo: celulaIds, codigo: NO_PERMITIDO}`. Una célula inexistente,
        422 `CATALOGO_INVALIDO` con `{campo: celulaIds[i], codigo: NO_EXISTE}`.
      uniqueItems: true
      maxItems: 50
      items:
        $ref: '#/components/schemas/Uuid'

    # ------------------------------------------------------------ supervisión
    AsignacionSupervisor:
      type: object
      required: [qeId]
      additionalProperties: false
      properties:
        qeId:
          $ref: '#/components/schemas/Uuid'
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: Obligatorio si el analista ya tiene un QE vigente distinto (422 `MOTIVO_REQUERIDO`).
    RelacionSupervision:
      type: object
      required: [id, analista, qe, desde, hasta, motivo, registradoPor]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        analista:
          $ref: '#/components/schemas/UsuarioResumen'
        qe:
          $ref: '#/components/schemas/UsuarioResumen'
        desde:
          $ref: '#/components/schemas/FechaHora'
        hasta:
          description: '`null` mientras la relación está vigente.'
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        motivo:
          description: Motivo con que se creó esta relación al reemplazar a la anterior. `null` en la primera asignación.
          oneOf:
            - type: string
            - type: 'null'
        registradoPor:
          $ref: '#/components/schemas/Actor'
    ResultadoCambioSupervision:
      type: object
      required: [cambio, vigente, anterior]
      additionalProperties: false
      properties:
        cambio:
          type: boolean
          description: '`false` si el QE indicado ya era el vigente; entonces no se registra historial ni auditoría.'
        vigente:
          $ref: '#/components/schemas/RelacionSupervision'
        anterior:
          description: Relación finalizada en la misma transacción (`hasta` informado), o `null`.
          oneOf:
            - $ref: '#/components/schemas/RelacionSupervision'
            - type: 'null'
    HistorialSupervision:
      type: object
      required: [analista, items]
      additionalProperties: false
      properties:
        analista:
          $ref: '#/components/schemas/UsuarioResumen'
        items:
          type: array
          description: Relaciones en orden cronológico ascendente por `desde`; la vigente es la última.
          items:
            $ref: '#/components/schemas/RelacionSupervision'
    AnalistaSupervisado:
      type: object
      required: [id, nombre, correo, activo, supervisadoDesde]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        correo:
          type: string
          format: email
        activo:
          type: boolean
        supervisadoDesde:
          $ref: '#/components/schemas/FechaHora'
    EquipoQe:
      type: object
      required: [qe, items, total]
      additionalProperties: false
      properties:
        qe:
          $ref: '#/components/schemas/UsuarioResumen'
        items:
          type: array
          description: Solo relaciones vigentes (`hasta` nulo), ordenadas por nombre.
          items:
            $ref: '#/components/schemas/AnalistaSupervisado'
        total:
          type: integer
          minimum: 0
    ListaAnalistasAsignables:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Analistas activos seleccionables, ordenados por nombre.
          items:
            $ref: '#/components/schemas/UsuarioResumen'

    # --------------------------------------------------------------- resúmenes
    ConteoPorEstado:
      type: object
      required: [PENDIENTE, DISENO_PRUEBAS, EN_EJECUCION, PENDIENTE_CIERRE, CERRADA]
      additionalProperties: false
      properties:
        PENDIENTE: {type: integer, minimum: 0}
        DISENO_PRUEBAS: {type: integer, minimum: 0}
        EN_EJECUCION: {type: integer, minimum: 0}
        PENDIENTE_CIERRE: {type: integer, minimum: 0}
        CERRADA: {type: integer, minimum: 0}
    ResumenEquipoQe:
      type: object
      required: [analistasVigentes]
      additionalProperties: false
      properties:
        analistasVigentes:
          type: integer
          minimum: 0
    ResumenHduQe:
      type: object
      required: [hduEnAmbito, porEstado]
      additionalProperties: false
      properties:
        hduEnAmbito:
          type: integer
          minimum: 0
          description: HDU donde el QE es responsable o cuyo analista supervisa hoy.
        porEstado:
          $ref: '#/components/schemas/ConteoPorEstado'
    ResumenSupervisorQa:
      type: object
      required: [supervisor]
      additionalProperties: false
      properties:
        supervisor:
          description: QE vigente, o `null` explícito si no tiene (E1-B05#2).
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
    ResumenHduQa:
      type: object
      required: [hduAsignadas, porEstado]
      additionalProperties: false
      properties:
        hduAsignadas:
          type: integer
          minimum: 0
        porEstado:
          $ref: '#/components/schemas/ConteoPorEstado'
    ResumenUsuariosAdmin:
      type: object
      required: [total, activos, inactivos, porRol]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        activos: {type: integer, minimum: 0}
        inactivos: {type: integer, minimum: 0}
        porRol:
          type: object
          description: Usuarios por rol; los 5 roles vienen siempre (D28).
          required: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
          additionalProperties: false
          properties:
            ADMINISTRADOR: {type: integer, minimum: 0}
            QE: {type: integer, minimum: 0}
            ANALISTA_QA: {type: integer, minimum: 0}
            LIDER_QA: {type: integer, minimum: 0}
            AUDITOR: {type: integer, minimum: 0}
    ResumenSupervisionAdmin:
      type: object
      required: [relacionesVigentes, analistasSinSupervisor, qeSinAnalistas]
      additionalProperties: false
      properties:
        relacionesVigentes: {type: integer, minimum: 0}
        analistasSinSupervisor:
          type: integer
          minimum: 0
          description: Analistas activos sin QE vigente.
        qeSinAnalistas:
          type: integer
          minimum: 0
          description: QE activos sin analistas vigentes.

    # -------------------------------------------------------------- catálogos
    CatalogoRef:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
    ListaCelulas:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordenadas por nombre.
          items:
            $ref: '#/components/schemas/CatalogoRef'
    Sprint:
      type: object
      required: [id, nombre, inicio, fin]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          examples: [Sprint 2026-18]
        inicio:
          $ref: '#/components/schemas/Fecha'
        fin:
          $ref: '#/components/schemas/Fecha'
    ListaSprints:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordenados por `inicio` ascendente.
          items:
            $ref: '#/components/schemas/Sprint'

    # -------------------------------------------------------------------- HDU
    HduResumen:
      type: object
      required: [id, codigo, titulo, celula, sprint, prioridad, estado, estadoActualizadoEn, qeResponsable, analista, creadoEn]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          examples: [PAGOS-1042]
        titulo:
          type: string
        celula:
          $ref: '#/components/schemas/CatalogoRef'
        sprint:
          $ref: '#/components/schemas/CatalogoRef'
        prioridad:
          $ref: '#/components/schemas/PrioridadHdu'
        estado:
          $ref: '#/components/schemas/EstadoHdu'
        estadoActualizadoEn:
          $ref: '#/components/schemas/FechaHora'
        qeResponsable:
          $ref: '#/components/schemas/UsuarioResumen'
        analista:
          description: Analista QA asignado, o `null` si la HDU no tiene.
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        creadoEn:
          $ref: '#/components/schemas/FechaHora'
    PermisosHdu:
      type: object
      description: Acciones que el usuario autenticado puede ejecutar sobre la HDU. Orienta la interfaz; el servicio vuelve a validar. Para Líder QA y Auditor todas son `false` (D32, D39).
      required: [cambiarEstado, asignarAnalista]
      additionalProperties: false
      properties:
        cambiarEstado:
          type: boolean
        asignarAnalista:
          type: boolean
    HduDetalleBase:
      description: Detalle de HDU según Organización, sin datos de otros servicios.
      allOf:
        - $ref: '#/components/schemas/HduResumen'
        - type: object
          required: [creadoPor, transicionesPermitidas, permisos]
          properties:
            creadoPor:
              $ref: '#/components/schemas/Actor'
            transicionesPermitidas:
              type: array
              description: Estados a los que puede pasar desde el actual (D10). Vacío si `CERRADA` o si el usuario no puede cambiar el estado.
              items:
                $ref: '#/components/schemas/EstadoHdu'
            permisos:
              $ref: '#/components/schemas/PermisosHdu'
    PaginaHdu:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordenadas por `creadoEn` descendente.
          items:
            $ref: '#/components/schemas/HduResumen'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    NuevaHdu:
      type: object
      required: [codigo, titulo, celulaId, sprintId, prioridad]
      additionalProperties: false
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: Identificador de la HDU. Único sin distinguir mayúsculas; se guarda tal como llega, sin espacios.
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        celulaId:
          $ref: '#/components/schemas/Uuid'
        sprintId:
          $ref: '#/components/schemas/Uuid'
        prioridad:
          $ref: '#/components/schemas/PrioridadHdu'
    AsignacionAnalista:
      type: object
      required: [analistaId]
      additionalProperties: false
      properties:
        analistaId:
          $ref: '#/components/schemas/Uuid'
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: Obligatorio si la HDU ya tiene otro analista (422 `MOTIVO_REQUERIDO`).
    ReasignacionQeResponsable:
      type: object
      required: [qeResponsableId, motivo]
      additionalProperties: false
      properties:
        qeResponsableId:
          $ref: '#/components/schemas/Uuid'
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: Obligatorio. En blanco tras recortar espacios, 422 `MOTIVO_REQUERIDO`.
    ResultadoReasignacionQe:
      type: object
      required: [cambio, hdu, qeAnterior, qeNuevo, motivo, fecha, actor]
      additionalProperties: false
      properties:
        cambio:
          type: boolean
          description: '`false` si el QE indicado ya era el responsable; no se registra historial ni auditoría.'
        hdu:
          $ref: '#/components/schemas/HduResumen'
        qeAnterior:
          $ref: '#/components/schemas/UsuarioResumen'
        qeNuevo:
          $ref: '#/components/schemas/UsuarioResumen'
        motivo:
          oneOf:
            - type: string
            - type: 'null'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
    PersonaCatalogo:
      type: object
      required: [id, nombre, correo, rol]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
    ListaPersonas:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordenadas por nombre.
          items:
            $ref: '#/components/schemas/PersonaCatalogo'
    ResultadoAsignacion:
      type: object
      required: [cambio, hdu, analistaAnterior, analistaNuevo, motivo, fecha, actor]
      additionalProperties: false
      properties:
        cambio:
          type: boolean
          description: '`false` si el analista indicado ya estaba asignado; no se registra historial.'
        hdu:
          $ref: '#/components/schemas/HduResumen'
        analistaAnterior:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        analistaNuevo:
          $ref: '#/components/schemas/UsuarioResumen'
        motivo:
          oneOf:
            - type: string
            - type: 'null'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
    SolicitudCambioEstado:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoHdu'
    ResultadoCambioEstado:
      type: object
      required: [hdu, estadoAnterior, estadoNuevo, fecha, actor, transicionesPermitidas]
      additionalProperties: false
      properties:
        hdu:
          $ref: '#/components/schemas/HduResumen'
        estadoAnterior:
          $ref: '#/components/schemas/EstadoHdu'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoHdu'
        fecha:
          $ref: '#/components/schemas/FechaHora'
          description: Igual a `hdu.estadoActualizadoEn` (E2-F04#3).
        actor:
          $ref: '#/components/schemas/Actor'
        transicionesPermitidas:
          type: array
          description: Transiciones desde el nuevo estado.
          items:
            $ref: '#/components/schemas/EstadoHdu'
    EventoEstadoHdu:
      type: object
      required: [tipo, fecha, actor, estadoAnterior, estadoNuevo]
      additionalProperties: false
      properties:
        tipo:
          type: string
          const: ESTADO
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
        estadoAnterior:
          description: '`null` en el evento de creación (estado inicial `PENDIENTE`).'
          oneOf:
            - $ref: '#/components/schemas/EstadoHdu'
            - type: 'null'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoHdu'
    EventoAsignacionHdu:
      type: object
      required: [tipo, fecha, actor, analistaAnterior, analistaNuevo, motivo]
      additionalProperties: false
      properties:
        tipo:
          type: string
          const: ASIGNACION
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
        analistaAnterior:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        analistaNuevo:
          $ref: '#/components/schemas/UsuarioResumen'
        motivo:
          oneOf:
            - type: string
            - type: 'null'
    EventoResponsableHdu:
      type: object
      description: Reasignación del QE responsable (D54, E7-B05).
      required: [tipo, fecha, actor, qeAnterior, qeNuevo, motivo]
      additionalProperties: false
      properties:
        tipo:
          type: string
          const: QE_RESPONSABLE
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
        qeAnterior:
          $ref: '#/components/schemas/UsuarioResumen'
        qeNuevo:
          $ref: '#/components/schemas/UsuarioResumen'
        motivo:
          type: string
    EventoHistorialHdu:
      oneOf:
        - $ref: '#/components/schemas/EventoEstadoHdu'
        - $ref: '#/components/schemas/EventoAsignacionHdu'
        - $ref: '#/components/schemas/EventoResponsableHdu'
      discriminator:
        propertyName: tipo
        mapping:
          ESTADO: '#/components/schemas/EventoEstadoHdu'
          ASIGNACION: '#/components/schemas/EventoAsignacionHdu'
          QE_RESPONSABLE: '#/components/schemas/EventoResponsableHdu'
    HistorialHdu:
      type: object
      required: [hduId, items]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        items:
          type: array
          description: Cambios de estado, de asignación y de QE responsable en orden cronológico ascendente por `fecha` (E2-B04#3, D54). El primero es la creación.
          items:
            $ref: '#/components/schemas/EventoHistorialHdu'
    AccesoHdu:
      type: object
      description: Resolución de acceso del usuario autenticado a una HDU, para otros servicios (E3 en adelante).
      required: [hduId, permitido, relacion]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        permitido:
          type: boolean
        relacion:
          description: |
            Motivo del acceso, o `null` si no se permite (D18). `LECTOR_CELULA`
            (Líder QA, HDU de sus células vigentes) y `LECTOR_AUDITORIA`
            (Auditor, todas) solo permiten leer y descargar: nunca marcar,
            desmarcar, aprobar, rechazar, certificar ni cambiar la HDU (D32).
          oneOf:
            - type: string
              enum: [ADMINISTRADOR, QE_RESPONSABLE, QE_SUPERVISOR_DEL_ANALISTA, ANALISTA_ASIGNADO, LECTOR_CELULA, LECTOR_AUDITORIA]
            - type: 'null'
        actor:
          description: Solo si `permitido`. Quién consulta, para registrar su nombre (E3-B01#1).
          $ref: '#/components/schemas/PersonaRol'
        hdu:
          description: Solo si `permitido`. Datos de la HDU que necesita Certificaciones (reglas y certificado).
          $ref: '#/components/schemas/HduParaCertificacion'
        candidatosResponsable:
          description: |
            Solo si `permitido` y se pidió `incluirCandidatos=true` (E4, D86).
            Personas activas para el responsable de un impedimento (tabla 3.5
            del backlog E4): `registro` = QE responsable y QE supervisor
            vigente del analista (sin repetir); `escalamiento` = Líderes QA
            con la célula de la HDU vigente y Administradores activos.
          type: object
          required: [registro, escalamiento]
          additionalProperties: false
          properties:
            registro:
              type: array
              items:
                $ref: '#/components/schemas/PersonaRol'
            escalamiento:
              type: array
              items:
                $ref: '#/components/schemas/PersonaRol'
    PersonaRol:
      type: object
      required: [id, nombre, rol]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
    Persona:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
    HduParaCertificacion:
      type: object
      required: [id, codigo, titulo, estado, celula, sprint, qeResponsable, analista, celulaId, sprintId, sprintFin]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          examples: [HDU-PAG-001]
        titulo:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoHdu'
        celula:
          type: string
          description: Nombre de la célula.
        sprint:
          type: string
          description: Nombre del sprint.
        celulaId:
          $ref: '#/components/schemas/Uuid'
          description: E4 (D86). Para filtrar por célula en Impedimentos.
        sprintId:
          $ref: '#/components/schemas/Uuid'
          description: E4 (D86). Sprint vigente de `historia_sprint`.
        sprintFin:
          $ref: '#/components/schemas/Fecha'
          description: E4 (D68, D69). Fecha de fin del sprint vigente.
        qeResponsable:
          $ref: '#/components/schemas/Persona'
        analista:
          oneOf:
            - $ref: '#/components/schemas/Persona'
            - type: 'null'
    ListaHduResponsable:
      type: object
      description: HDU donde el QE del token es el responsable (E3-F03#3).
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HduParaCertificacion'

    # -------------------------------------------------------------- auditoría
    RegistroAuditoria:
      type: object
      description: Cambio auditado (E1-B12, E2-B04). `antes` y `despues` nunca incluyen contraseñas ni tokens.
      required: [id, fecha, actor, entidad, entidadId, accion, antes, despues, motivo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
        entidad:
          $ref: '#/components/schemas/EntidadAuditoria'
        entidadId:
          $ref: '#/components/schemas/Uuid'
        accion:
          $ref: '#/components/schemas/AccionAuditoria'
        antes:
          description: Campos relevantes antes del cambio; `null` en creaciones.
          oneOf:
            - type: object
            - type: 'null'
        despues:
          oneOf:
            - type: object
            - type: 'null'
        motivo:
          oneOf:
            - type: string
            - type: 'null'
    PaginaAuditoria:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Ordenados por `fecha` descendente.
          items:
            $ref: '#/components/schemas/RegistroAuditoria'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    EntidadAuditoria:
      type: string
      description: '`EXPORTACION` registra cada exportación del Auditor (D35, D48).'
      enum: [USUARIO, SUPERVISION, HDU, EXPORTACION]
    AccionAuditoria:
      type: string
      description: |
        Catálogo de operaciones auditadas (E1-B12, E2-B04, D45). Etiquetas del portal:

        | Código | Etiqueta | Auditoría de usuarios |
        | --- | --- | --- |
        | `CREAR_USUARIO` | Registro de usuario | sí |
        | `ACTUALIZAR_USUARIO` | Actualización de datos | sí |
        | `ACTIVAR_USUARIO` | Activación | sí |
        | `DESACTIVAR_USUARIO` | Desactivación | sí |
        | `CAMBIAR_ROL` | Cambio de rol | sí |
        | `ASIGNAR_SUPERVISOR` | Asignación de supervisor | sí |
        | `CAMBIAR_SUPERVISOR` | Cambio de supervisor | sí |
        | `ASIGNAR_CELULAS_LIDER` | Asignación de células | sí |
        | `EXPORTAR` | Exportación | sí |
        | `CREAR_HDU` | Registro de HDU | no |
        | `CAMBIAR_ESTADO_HDU` | Cambio de estado de HDU | no |
        | `ASIGNAR_ANALISTA` | Asignación de analista | no |
        | `REASIGNAR_ANALISTA` | Reasignación de analista | no |
        | `REASIGNAR_QE_RESPONSABLE` | Reasignación de QE responsable (D54) | no |
      enum: [CREAR_USUARIO, ACTUALIZAR_USUARIO, ACTIVAR_USUARIO, DESACTIVAR_USUARIO, CAMBIAR_ROL, ASIGNAR_SUPERVISOR, CAMBIAR_SUPERVISOR, CREAR_HDU, CAMBIAR_ESTADO_HDU, ASIGNAR_ANALISTA, REASIGNAR_ANALISTA, ASIGNAR_CELULAS_LIDER, EXPORTAR, REASIGNAR_QE_RESPONSABLE]
    OperacionAuditoriaUsuarios:
      type: string
      description: Subconjunto de `AccionAuditoria` que forma la auditoría de usuarios (entidades `USUARIO`, `SUPERVISION` y `EXPORTACION`). Es el filtro `operacion` del Auditor (D45).
      enum: [CREAR_USUARIO, ACTUALIZAR_USUARIO, ACTIVAR_USUARIO, DESACTIVAR_USUARIO, CAMBIAR_ROL, ASIGNAR_SUPERVISOR, CAMBIAR_SUPERVISOR, ASIGNAR_CELULAS_LIDER, EXPORTAR]

    # ----------------------------------------------------------- E7 · roles
    HduReferencia:
      type: object
      required: [id, codigo, titulo, estado]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
        titulo:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoHdu'
    RolCatalogo:
      type: object
      required: [codigo, nombre, soloLectura]
      additionalProperties: false
      properties:
        codigo:
          $ref: '#/components/schemas/Rol'
        nombre:
          type: string
          description: Analista QA, QE, Líder QA, Administrador o Auditor.
        soloLectura:
          type: boolean
          description: Verdadero para `LIDER_QA` y `AUDITOR` (D32).
    ListaRoles:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: 'Los 5 roles en el orden del selector: Analista QA, QE, Líder QA, Administrador, Auditor.'
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/RolCatalogo'
    ConteoPorRol:
      type: object
      required: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      additionalProperties: false
      properties:
        ADMINISTRADOR: {type: integer, minimum: 0}
        QE: {type: integer, minimum: 0}
        ANALISTA_QA: {type: integer, minimum: 0}
        LIDER_QA: {type: integer, minimum: 0}
        AUDITOR: {type: integer, minimum: 0}
    AsignacionCelulaLider:
      type: object
      description: Una fila de `organizacion.celula_lider` (D30). Vigente si `hasta` es `null`.
      required: [id, celula, desde, hasta, asignadoPor, retiradoPor]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        celula:
          $ref: '#/components/schemas/CatalogoRef'
        desde:
          $ref: '#/components/schemas/FechaHora'
        hasta:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        asignadoPor:
          $ref: '#/components/schemas/Actor'
        retiradoPor:
          description: Quién la quitó; `null` mientras está vigente.
          oneOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
    CelulasLider:
      type: object
      required: [usuario, vigentes, historial]
      additionalProperties: false
      properties:
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        vigentes:
          type: array
          description: Asignaciones vigentes, ordenadas por nombre de célula.
          items:
            $ref: '#/components/schemas/AsignacionCelulaLider'
        historial:
          type: array
          description: Todas las asignaciones, vigentes y terminadas, de la más reciente a la más antigua por `desde` (E7-F07#3).
          items:
            $ref: '#/components/schemas/AsignacionCelulaLider'
    SolicitudCelulasLider:
      type: object
      description: Conjunto completo de células vigentes que debe quedar. Lista vacía = quitar todas.
      required: [celulaIds]
      additionalProperties: false
      properties:
        celulaIds:
          $ref: '#/components/schemas/CelulaIdsLider'

    # --------------------------------------------------------- E7 · bandejas
    Contador:
      description: Contador de bandeja (D34). `datos.valor` existe solo con `estado` `ok`; 0 con `ok` es un resultado válido.
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              $ref: '#/components/schemas/FuenteDatos'
            estado:
              type: string
              const: ok
            datos:
              type: object
              required: [valor]
              additionalProperties: false
              properties:
                valor:
                  type: integer
                  minimum: 0
        - $ref: '#/components/schemas/BloqueIndisponible'
    ContadorPorAprobar:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              type: string
              const: certificaciones.checklist
            estado:
              type: string
              const: ok
            datos:
              type: object
              required: [valor, hdu]
              additionalProperties: false
              properties:
                valor:
                  type: integer
                  minimum: 0
                  description: Entregables en `POR_APROBAR`.
                hdu:
                  type: integer
                  minimum: 0
                  description: HDU distintas a las que pertenecen.
        - $ref: '#/components/schemas/BloqueIndisponible'
    ContadorUsuariosActivos:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              type: string
              const: organizacion.usuarios
            estado:
              type: string
              const: ok
            datos:
              type: object
              required: [valor, porRol]
              additionalProperties: false
              properties:
                valor:
                  type: integer
                  minimum: 0
                porRol:
                  $ref: '#/components/schemas/ConteoPorRol'
        - $ref: '#/components/schemas/BloqueIndisponible'
    SeguimientoHdu:
      type: object
      description: |
        Estado del checklist de una HDU calculado por Certificaciones (D46).
        Una HDU sin ciclo de certificación tiene 0 aprobados y su siguiente
        entregable es el 1: es un dato válido, no una falla.
      required: [hduId, certificacionId, aprobados, porcentaje, porAprobar, observaciones, siguienteEntregable, certificado, listaParaCertificar, listaParaCerrar, porAprobarDesde, listaDesde, ultimaActividad]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        certificacionId:
          description: E4 (D58, D86). Ciclo de certificación activo, o `null` si la HDU aún no tiene ciclo. Impedimentos lo guarda al registrar.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        aprobados:
          type: integer
          minimum: 0
          maximum: 10
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          description: aprobados / 10 × 100 (D16).
        porAprobar:
          type: integer
          minimum: 0
          description: Entregables en `POR_APROBAR`.
        observaciones:
          type: integer
          minimum: 0
          description: Entregables en `PENDIENTE` cuyo último evento de bitácora es `RECHAZAR`.
        siguienteEntregable:
          description: Primer entregable no aprobado; `null` con los 10 aprobados.
          oneOf:
            - type: object
              required: [clave, orden, nombre]
              additionalProperties: false
              properties:
                clave:
                  $ref: '#/components/schemas/ClaveEntregable'
                orden:
                  type: integer
                  minimum: 1
                  maximum: 10
                nombre:
                  type: string
            - type: 'null'
        certificado:
          oneOf:
            - type: object
              required: [folio, emitidoEn]
              additionalProperties: false
              properties:
                folio:
                  type: string
                emitidoEn:
                  $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        listaParaCertificar:
          type: boolean
          description: Entregables 1 a 8 aprobados y el 9 sin aprobar.
        listaParaCerrar:
          type: boolean
          description: Los 10 aprobados. Organización agrega la condición «HDU no cerrada».
        porAprobarDesde:
          description: Fecha del entregable más antiguo en `POR_APROBAR`, o `null`.
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        listaDesde:
          description: Fecha de aprobación del entregable 8 (lista para certificar) o del 10 (lista para cerrar); `null` si no está lista.
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        ultimaActividad:
          description: Fecha del último evento de bitácora de la HDU, o `null`.
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
    BloqueSeguimiento:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              type: string
              const: certificaciones.checklist
            estado:
              type: string
              const: ok
            datos:
              $ref: '#/components/schemas/SeguimientoHdu'
        - $ref: '#/components/schemas/BloqueIndisponible'
    ItemBandejaHdu:
      description: Fila de HDU de una bandeja. Los datos de Organización siempre vienen; el seguimiento puede estar `indisponible` (D34).
      allOf:
        - $ref: '#/components/schemas/HduResumen'
        - type: object
          required: [actualizadoEn, seguimiento]
          properties:
            actualizadoEn:
              $ref: '#/components/schemas/FechaHora'
              description: El mayor entre `estadoActualizadoEn`, la última asignación y `seguimiento.ultimaActividad` (si está disponible).
            seguimiento:
              $ref: '#/components/schemas/BloqueSeguimiento'
            bloqueo:
              $ref: '#/components/schemas/BloqueBloqueoFila'
              description: E4 (D87). Solo en las bandejas del Analista QA y del Líder QA.
            riesgo:
              $ref: '#/components/schemas/BloqueRiesgoFila'
              description: E4 (D87). Solo en la bandeja del Líder QA (D73, D80).
    PaginaBandejaHdu:
      type: object
      required: [items, total, pagina, tamanoPagina, orden]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemBandejaHdu'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
          description: Tamaño efectivo (un pedido mayor a 100 se recorta, D49).
        orden:
          type: string
          description: Orden aplicado, `columna:asc|desc`. Si el orden pedido depende de Certificaciones y no respondió, se informa el orden de respaldo (D46).
    BloqueListaHdu:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente:
              type: string
              const: organizacion.hdu
            estado:
              type: string
              const: ok
            datos:
              $ref: '#/components/schemas/PaginaBandejaHdu'
        - $ref: '#/components/schemas/BloqueIndisponible'
    BandejaAnalista:
      type: object
      required: [rol, generadaEn, supervisor, contadores, hdu, impedimentos]
      additionalProperties: false
      properties:
        rol:
          type: string
          const: ANALISTA_QA
        generadaEn:
          $ref: '#/components/schemas/FechaHora'
        supervisor:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.supervision}
                estado: {type: string, const: ok}
                datos: {$ref: '#/components/schemas/ResumenSupervisorQa'}
            - $ref: '#/components/schemas/BloqueIndisponible'
        contadores:
          type: object
          required: [abiertas, conObservaciones, esperandoAprobacion]
          additionalProperties: false
          properties:
            abiertas:
              $ref: '#/components/schemas/Contador'
              description: Mis HDU no cerradas (Organización).
            conObservaciones:
              $ref: '#/components/schemas/Contador'
              description: Entregables rechazados sin corregir de mis HDU (Certificaciones).
            esperandoAprobacion:
              $ref: '#/components/schemas/Contador'
              description: Entregables en `POR_APROBAR` de mis HDU (Certificaciones).
        hdu:
          $ref: '#/components/schemas/BloqueListaHdu'
        impedimentos:
          $ref: '#/components/schemas/ImpedimentosBandejaAnalista'
    TipoAccionQe:
      type: string
      description: '`APROBAR` (hay entregables en `POR_APROBAR`), `ASIGNAR` (sin analista), `CERTIFICAR` (1 a 8 aprobados y el 9 no), `CERRAR` (10 aprobados y HDU no cerrada).'
      enum: [APROBAR, ASIGNAR, CERTIFICAR, CERRAR]
    AccionPendienteQe:
      type: object
      description: Una fila por HDU y tipo de acción; una HDU con dos pendientes aparece dos veces.
      required: [hdu, tipo, entregablesPorAprobar, esperandoDesde, antiguedadDias]
      additionalProperties: false
      properties:
        hdu:
          $ref: '#/components/schemas/HduResumen'
        tipo:
          $ref: '#/components/schemas/TipoAccionQe'
        entregablesPorAprobar:
          type: [integer, 'null']
          minimum: 1
          description: Solo con `tipo` `APROBAR`.
        esperandoDesde:
          $ref: '#/components/schemas/FechaHora'
          description: '`APROBAR`: `porAprobarDesde`; `ASIGNAR`: creación de la HDU; `CERTIFICAR` y `CERRAR`: `listaDesde`.'
        antiguedadDias:
          type: integer
          minimum: 0
        bloqueo:
          $ref: '#/components/schemas/BloqueBloqueoFila'
          description: E4 (D81). Solo en filas `CERRAR`; el portal muestra la insignia «Con impedimento abierto» si `bloqueada`.
    BandejaQe:
      type: object
      description: El resumen de equipo de E1-F03 sigue en `GET /v1/inicio/qe`; esta bandeja no lo duplica.
      required: [rol, generadaEn, contadores, acciones, impedimentos]
      additionalProperties: false
      properties:
        rol:
          type: string
          const: QE
        generadaEn:
          $ref: '#/components/schemas/FechaHora'
        contadores:
          type: object
          required: [porAprobar, sinAnalista, listasCertificar, listasCerrar]
          additionalProperties: false
          properties:
            porAprobar:
              $ref: '#/components/schemas/ContadorPorAprobar'
            sinAnalista:
              $ref: '#/components/schemas/Contador'
            listasCertificar:
              $ref: '#/components/schemas/Contador'
            listasCerrar:
              $ref: '#/components/schemas/Contador'
        acciones:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.hdu}
                estado: {type: string, const: ok}
                datos:
                  type: object
                  required: [items, total, pagina, tamanoPagina, calculoParcial]
                  additionalProperties: false
                  properties:
                    items:
                      type: array
                      description: Más antigua primero.
                      items:
                        $ref: '#/components/schemas/AccionPendienteQe'
                    total:
                      type: integer
                      minimum: 0
                    pagina:
                      type: integer
                      minimum: 1
                    tamanoPagina:
                      type: integer
                      minimum: 1
                      maximum: 100
                    calculoParcial:
                      type: boolean
                      description: Verdadero si Certificaciones no respondió. Entonces solo vienen las acciones `ASIGNAR` y el portal avisa que el resto no se pudo calcular; nunca es un vacío falso (E7-F03#2).
            - $ref: '#/components/schemas/BloqueIndisponible'
        impedimentos:
          $ref: '#/components/schemas/ImpedimentosBandejaQe'
    ResumenCelulaLider:
      type: object
      required: [celula, porEstado, avancePromedioAbiertas]
      additionalProperties: false
      properties:
        celula:
          $ref: '#/components/schemas/CatalogoRef'
        porEstado:
          $ref: '#/components/schemas/ConteoPorEstado'
        avancePromedioAbiertas:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: certificaciones.checklist}
                estado: {type: string, const: ok}
                datos:
                  type: object
                  required: [porcentaje]
                  additionalProperties: false
                  properties:
                    porcentaje:
                      type: [number, 'null']
                      minimum: 0
                      maximum: 100
                      description: '`null` si la célula no tiene HDU abiertas.'
            - $ref: '#/components/schemas/BloqueIndisponible'
    BandejaLider:
      type: object
      description: Sin células vigentes, `celulas.datos.items` viene vacío, los contadores en 0 con `ok` y las listas vacías (E7-B02#1); el portal muestra el mensaje de «sin células».
      required: [rol, generadaEn, celulas, contadores, resumenPorCelula, hdu, impedimentos]
      additionalProperties: false
      properties:
        rol:
          type: string
          const: LIDER_QA
        generadaEn:
          $ref: '#/components/schemas/FechaHora'
        celulas:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.celulas}
                estado: {type: string, const: ok}
                datos: {$ref: '#/components/schemas/ListaCelulas'}
            - $ref: '#/components/schemas/BloqueIndisponible'
        contadores:
          type: object
          required: [celulas, hduAbiertas, hduCerradas, sinAnalista, certificados]
          additionalProperties: false
          properties:
            celulas:
              $ref: '#/components/schemas/Contador'
            hduAbiertas:
              $ref: '#/components/schemas/Contador'
            hduCerradas:
              $ref: '#/components/schemas/Contador'
            sinAnalista:
              $ref: '#/components/schemas/Contador'
            certificados:
              $ref: '#/components/schemas/Contador'
              description: HDU de sus células con certificado (Certificaciones).
        resumenPorCelula:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.hdu}
                estado: {type: string, const: ok}
                datos:
                  type: object
                  required: [items]
                  additionalProperties: false
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ResumenCelulaLider'
            - $ref: '#/components/schemas/BloqueIndisponible'
        hdu:
          $ref: '#/components/schemas/BloqueListaHdu'
        impedimentos:
          $ref: '#/components/schemas/ImpedimentosBandejaLider'
    TipoPendienteAdmin:
      type: string
      enum: [ANALISTA_SIN_QE, QE_SIN_ANALISTAS, LIDER_SIN_CELULAS, CELULA_SIN_LIDER]
    PendienteConfiguracion:
      type: object
      description: '`usuario` en los tres primeros tipos; `celula` solo en `CELULA_SIN_LIDER`. Solo usuarios activos.'
      required: [tipo, usuario, celula]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoPendienteAdmin'
        usuario:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        celula:
          oneOf:
            - $ref: '#/components/schemas/CatalogoRef'
            - type: 'null'
    BandejaAdmin:
      type: object
      description: Todo sale de Organización; no depende de Certificaciones (E7-B03-T11).
      required: [rol, generadaEn, contadores, pendientes, ultimosCambios, impedimentos]
      additionalProperties: false
      properties:
        rol:
          type: string
          const: ADMINISTRADOR
        generadaEn:
          $ref: '#/components/schemas/FechaHora'
        contadores:
          type: object
          required: [usuariosActivos, usuariosInactivos, analistasSinQe, qeSinAnalistas, lideresSinCelulas, celulasSinLider, hduTotal]
          additionalProperties: false
          properties:
            usuariosActivos:
              $ref: '#/components/schemas/ContadorUsuariosActivos'
            usuariosInactivos:
              $ref: '#/components/schemas/Contador'
            analistasSinQe:
              $ref: '#/components/schemas/Contador'
            qeSinAnalistas:
              $ref: '#/components/schemas/Contador'
            lideresSinCelulas:
              $ref: '#/components/schemas/Contador'
            celulasSinLider:
              $ref: '#/components/schemas/Contador'
            hduTotal:
              $ref: '#/components/schemas/Contador'
        pendientes:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.usuarios}
                estado: {type: string, const: ok}
                datos:
                  type: object
                  required: [items, total, pagina, tamanoPagina]
                  additionalProperties: false
                  properties:
                    items:
                      type: array
                      description: Ordenados por tipo (en el orden del enum) y luego por nombre.
                      items:
                        $ref: '#/components/schemas/PendienteConfiguracion'
                    total:
                      type: integer
                      minimum: 0
                    pagina:
                      type: integer
                      minimum: 1
                    tamanoPagina:
                      type: integer
                      minimum: 1
                      maximum: 100
            - $ref: '#/components/schemas/BloqueIndisponible'
        ultimosCambios:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.auditoria}
                estado: {type: string, const: ok}
                datos:
                  type: object
                  required: [items]
                  additionalProperties: false
                  properties:
                    items:
                      type: array
                      description: Las 10 entradas más recientes de la auditoría de usuarios.
                      maxItems: 10
                      items:
                        $ref: '#/components/schemas/RegistroAuditoriaUsuario'
            - $ref: '#/components/schemas/BloqueIndisponible'
        impedimentos:
          $ref: '#/components/schemas/ImpedimentosBandejaAdmin'
    BandejaAuditor:
      type: object
      description: Contadores y pestaña HDU. Las otras pestañas usan `/v1/auditor/*` (E7-B04).
      required: [rol, generadaEn, contadores, hdu, impedimentos]
      additionalProperties: false
      properties:
        rol:
          type: string
          const: AUDITOR
        generadaEn:
          $ref: '#/components/schemas/FechaHora'
        contadores:
          type: object
          required: [hduTotal, certificados, eventos7d, cambiosUsuarios7d]
          additionalProperties: false
          properties:
            hduTotal:
              $ref: '#/components/schemas/Contador'
            certificados:
              $ref: '#/components/schemas/Contador'
            eventos7d:
              $ref: '#/components/schemas/Contador'
              description: Eventos de bitácora de checklist de los últimos 7 días (Certificaciones).
            cambiosUsuarios7d:
              $ref: '#/components/schemas/Contador'
              description: Entradas de auditoría de usuarios de los últimos 7 días (Organización).
        hdu:
          $ref: '#/components/schemas/BloqueListaHdu'
          description: Sin bloqueo ni riesgo por fila (D71, D80).
        impedimentos:
          $ref: '#/components/schemas/ImpedimentosBandejaAuditor'

    # ---------------------------------------------------------- E7 · auditor
    EventoBitacoraGlobal:
      type: object
      description: Evento de bitácora de checklist con la HDU a la que pertenece (E7-B04#1).
      required: [id, hdu, accion, clave, nombreEntregable, actor, fecha, valorAnterior, valorNuevo, motivo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hdu:
          $ref: '#/components/schemas/HduReferencia'
        accion:
          $ref: '#/components/schemas/AccionChecklist'
        clave:
          $ref: '#/components/schemas/ClaveEntregable'
        nombreEntregable:
          type: string
        actor:
          $ref: '#/components/schemas/PersonaRol'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        valorAnterior:
          type: [object, 'null']
        valorNuevo:
          type: [object, 'null']
        motivo:
          type: [string, 'null']
    PaginaBitacoraGlobal:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/EventoBitacoraGlobal'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    CertificadoAuditoria:
      type: object
      required: [folio, hdu, emitidoEn, emitidoPor, huellaSha256, valido]
      additionalProperties: false
      properties:
        folio:
          type: string
        hdu:
          type: object
          required: [id, codigo, titulo]
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            codigo:
              type: string
            titulo:
              type: string
        emitidoEn:
          $ref: '#/components/schemas/FechaHora'
        emitidoPor:
          $ref: '#/components/schemas/Persona'
        huellaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        valido:
          type: boolean
          description: Mismo valor que entrega la verificación pública del folio (D21, D45). Portal - «Válido» o «No válido».
    PaginaCertificadosAuditoria:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Del más reciente al más antiguo por `emitidoEn`.
          items:
            $ref: '#/components/schemas/CertificadoAuditoria'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    RegistroAuditoriaUsuario:
      type: object
      description: Entrada de la auditoría de usuarios. `antes` y `despues` solo traen campos de la lista blanca (rol, nombre, correo, activo, supervisor, células; en exportaciones, recurso, filtros y filas). Nunca contraseñas, tokens ni secretos (E1-B12#3).
      required: [id, fecha, actor, operacion, entidad, entidadId, usuarioAfectado, antes, despues, motivo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        actor:
          $ref: '#/components/schemas/Actor'
        operacion:
          $ref: '#/components/schemas/OperacionAuditoriaUsuarios'
        entidad:
          type: string
          enum: [USUARIO, SUPERVISION, EXPORTACION]
        entidadId:
          $ref: '#/components/schemas/Uuid'
        usuarioAfectado:
          description: Usuario sobre el que se hizo el cambio (en supervisión, el analista); `null` en `EXPORTAR`.
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        antes:
          type: [object, 'null']
        despues:
          type: [object, 'null']
        motivo:
          type: [string, 'null']
    PaginaAuditoriaUsuarios:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/RegistroAuditoriaUsuario'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    RecursoExportacion:
      type: string
      enum: [HDU, AUDITORIA_USUARIOS, BITACORA, CERTIFICADOS, IMPEDIMENTOS, GESTION_IMPEDIMENTOS]

    # ------------------------------------------- E7 · ámbitos internos (D47)
    AmbitoLecturaHdu:
      type: object
      description: |
        HDU que el usuario del token puede leer. `todas: true` para
        Administrador y Auditor (`hduIds` vacío); para los demás, la lista
        explícita: Analista QA (asignadas), QE (responsable o de un analista
        que supervisa hoy), Líder QA (de sus células vigentes; vacía si no
        tiene).
      required: [usuarioId, rol, todas, hduIds]
      additionalProperties: false
      properties:
        usuarioId:
          $ref: '#/components/schemas/Uuid'
        rol:
          $ref: '#/components/schemas/Rol'
        todas:
          type: boolean
        hduIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    ConsultaHduLote:
      type: object
      required: [hduIds]
      additionalProperties: false
      properties:
        hduIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    ListaHduLote:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Una por id pedido que exista, en el mismo orden (D55, con ámbito total se omiten los ids desconocidos).
          items:
            $ref: '#/components/schemas/HduParaCertificacion'
    ListaSeguimientoHdu:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Una por id pedido, en el mismo orden.
          items:
            $ref: '#/components/schemas/SeguimientoHdu'
    RegistroExportacion:
      type: object
      required: [recurso, filtros, filas]
      additionalProperties: false
      properties:
        recurso:
          $ref: '#/components/schemas/RecursoExportacion'
        filtros:
          type: object
          description: Filtros de la consulta tal como se aplicaron (solo los parámetros del contrato).
        filas:
          type: integer
          minimum: 0

    # ------------------------------------------- E4 · impedimentos y riesgo
    TipoImpedimento:
      type: string
      description: |
        Catálogo de tipos de impedimento (D61), con CHECK en base de datos.
        `OTRO` exige una descripción de al menos 20 caracteres.
      enum: [AMBIENTE, DATOS_PRUEBA, ACCESO, REQUISITOS, DEPENDENCIA, DEFECTO_BLOQUEANTE, HERRAMIENTA, RECURSOS, OTRO]
      x-etiquetas:
        AMBIENTE: Ambiente de pruebas
        DATOS_PRUEBA: Datos de prueba
        ACCESO: Accesos y permisos
        REQUISITOS: Requisitos
        DEPENDENCIA: Dependencia de otro equipo
        DEFECTO_BLOQUEANTE: Defecto bloqueante
        HERRAMIENTA: Herramienta o integración
        RECURSOS: Personas o tiempo
        OTRO: Otro
    EstadoImpedimento:
      type: string
      description: |
        Estados de un impedimento (D62). `ABIERTO` y `ESCALADO` bloquean la
        HDU (D59) y su cierre (D60). `x-transiciones` lista las operaciones
        que admite cada estado; cualquier otra responde 409
        `TRANSICION_INVALIDA` (`ErrorTransicionImpedimento`).
      enum: [ABIERTO, ESCALADO, RESUELTO]
      x-etiquetas:
        ABIERTO: Abierto
        ESCALADO: Escalado
        RESUELTO: Resuelto
      x-transiciones:
        ABIERTO: [RESOLVER, ESCALAR, SEGUIMIENTO]
        ESCALADO: [RESOLVER, ESCALAR, SEGUIMIENTO]
        RESUELTO: [REABRIR]
    OperacionImpedimento:
      type: string
      description: Operaciones de gestión. Solo las ejecuta el QE responsable de la HDU (D57).
      enum: [RESOLVER, ESCALAR, REABRIR, SEGUIMIENTO]
    TipoAccionImpedimento:
      type: string
      description: Tipo de cada fila de `accion_impedimento` (solo inserción, D65).
      enum: [REGISTRAR, ESCALAR, RESOLVER, REABRIR, SEGUIMIENTO]
      x-etiquetas:
        REGISTRAR: Registro
        ESCALAR: Escalamiento
        RESOLVER: Resolución
        REABRIR: Reapertura
        SEGUIMIENTO: Seguimiento
    NivelRiesgo:
      type: string
      description: Nivel de riesgo de una HDU (D66). Semáforo rojo, amarillo y verde, siempre con su texto.
      enum: [BAJO, MEDIO, ALTO]
      x-etiquetas:
        BAJO: Bajo
        MEDIO: Medio
        ALTO: Alto
    OrigenRiesgo:
      type: string
      description: '`MANUAL`, fijado por el QE responsable; `SUGERIDO`, calculado (D66).'
      enum: [MANUAL, SUGERIDO]
    CodigoFactorRiesgo:
      type: string
      description: |
        Factores del riesgo sugerido (D67, tabla 3.4 del backlog E4). El nivel
        sugerido es el máximo de los factores aplicables.

        | Código | Condición | Nivel |
        | --- | --- | --- |
        | `IMPEDIMENTO_ABIERTO` | Al menos un impedimento `ABIERTO` o `ESCALADO` | MEDIO |
        | `IMPEDIMENTO_ANTIGUO` | Algún `ABIERTO` con `RIESGO_DIAS_IMPEDIMENTO_ALTO` (5) días o más | ALTO |
        | `IMPEDIMENTO_ESCALADO` | Al menos un `ESCALADO` | ALTO |
        | `SPRINT_VENCIDO` | El sprint vigente terminó antes de hoy | ALTO |
        | `ATRASO_SPRINT_ALTO` | Faltan `RIESGO_DIAS_SPRINT_ALTO` (3) días o menos y avance < `RIESGO_AVANCE_ALTO` (70) | ALTO |
        | `ATRASO_SPRINT_MEDIO` | Faltan `RIESGO_DIAS_SPRINT_MEDIO` (7) días o menos y avance < `RIESGO_AVANCE_MEDIO` (50) | MEDIO |
      enum: [IMPEDIMENTO_ABIERTO, IMPEDIMENTO_ANTIGUO, IMPEDIMENTO_ESCALADO, SPRINT_VENCIDO, ATRASO_SPRINT_ALTO, ATRASO_SPRINT_MEDIO]
    PropositoResponsable:
      type: string
      description: '`REGISTRO`, candidatos al registrar; `ESCALAMIENTO`, destinos de un escalamiento (D63, D64).'
      enum: [REGISTRO, ESCALAMIENTO]
    ResponsableImpedimento:
      type: object
      description: |
        Responsable de resolver el impedimento (D63). Persona de Quality360
        (`id` con valor) o tercero escrito a mano (`id` en `null`, `externo: true`).
        `nombre` es una instantánea. El responsable no otorga permisos (D57).
      required: [id, nombre, externo]
      additionalProperties: false
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        nombre:
          type: string
          maxLength: 150
        externo:
          type: boolean
    Impedimento:
      type: object
      description: Impedimento de una HDU (E4-B01#1). Las fechas y `diasAbierto` siguen D74.
      required: [id, hduId, certificacionId, tipo, titulo, descripcion, estado, responsable, creadoPor, fechaRegistro, abiertoDesde, fechaResolucion, diasAbierto, esNuevo, actualizadoEn, operacionesPermitidas]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hduId:
          $ref: '#/components/schemas/Uuid'
        certificacionId:
          description: Ciclo de certificación activo al registrar, o `null` si la HDU no tenía ciclo o Certificaciones no respondió (D58).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tipo:
          $ref: '#/components/schemas/TipoImpedimento'
        titulo:
          type: string
          minLength: 5
          maxLength: 200
        descripcion:
          type: string
          maxLength: 1000
        estado:
          $ref: '#/components/schemas/EstadoImpedimento'
        responsable:
          $ref: '#/components/schemas/ResponsableImpedimento'
        creadoPor:
          $ref: '#/components/schemas/PersonaRol'
        fechaRegistro:
          $ref: '#/components/schemas/FechaHora'
        abiertoDesde:
          $ref: '#/components/schemas/FechaHora'
          description: Igual a `fechaRegistro` al registrar; se reinicia al reabrir (D74).
        fechaResolucion:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        diasAbierto:
          type: integer
          minimum: 0
          description: Días de calendario (America/Santiago) entre `abiertoDesde` y hoy, o `fechaResolucion` si está resuelto (D74).
        esNuevo:
          type: boolean
          description: Registrado hace menos de 24 horas y no resuelto (D72, D86). El portal muestra la insignia «Nuevo».
        actualizadoEn:
          $ref: '#/components/schemas/FechaHora'
        operacionesPermitidas:
          type: array
          description: Operaciones que quien consulta puede ejecutar ahora (estado y relación con la HDU). Vacío si no es el QE responsable o si la HDU está cerrada (D75). Orienta la interfaz; el servicio vuelve a validar.
          items:
            $ref: '#/components/schemas/OperacionImpedimento'
    AccionImpedimentoRegistro:
      type: object
      description: Fila del historial de un impedimento (`accion_impedimento`, solo inserción, D65).
      required: [id, impedimentoId, tipo, estadoAnterior, estado, actor, fecha, comentario, detalle]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        impedimentoId:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoAccionImpedimento'
        estadoAnterior:
          description: '`null` en `REGISTRAR`.'
          oneOf:
            - $ref: '#/components/schemas/EstadoImpedimento'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoImpedimento'
          description: Estado resultante.
        actor:
          $ref: '#/components/schemas/PersonaRol'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        comentario:
          type: string
          description: Comentario, motivo de reapertura o, en `REGISTRAR`, el texto fijo «Registro del impedimento».
        detalle:
          description: Solo en `ESCALAR`.
          oneOf:
            - type: object
              required: [responsableAnterior, responsableNuevo]
              additionalProperties: false
              properties:
                responsableAnterior:
                  $ref: '#/components/schemas/ResponsableImpedimento'
                responsableNuevo:
                  $ref: '#/components/schemas/ResponsableImpedimento'
            - type: 'null'
    PermisosImpedimentosHdu:
      type: object
      description: |
        Lo que quien consulta puede hacer en la HDU (D75, matriz 3.6 del
        backlog E4). El portal muestra u omite los botones según estos valores
        y nunca deduce la relación por su cuenta. El servicio vuelve a validar.
      required: [puedeRegistrar, puedeGestionar, puedeVerRiesgo, puedeFijarRiesgo]
      additionalProperties: false
      properties:
        puedeRegistrar:
          type: boolean
          description: Analista asignado o QE responsable, con la HDU no cerrada.
        puedeGestionar:
          type: boolean
          description: QE responsable con la HDU no cerrada.
        puedeVerRiesgo:
          type: boolean
          description: Falso solo para el Analista QA (D73).
        puedeFijarRiesgo:
          type: boolean
          description: QE responsable con la HDU no cerrada.
    ImpedimentosHdu:
      type: object
      description: Sección «Impedimentos» del detalle de HDU (E4-F01, E4-F03).
      required: [hduId, hduCerrada, bloqueada, abiertos, escalados, resueltos, permisos, items]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        hduCerrada:
          type: boolean
        bloqueada:
          type: boolean
          description: Al menos un impedimento `ABIERTO` o `ESCALADO` (D59).
        abiertos:
          type: integer
          minimum: 0
        escalados:
          type: integer
          minimum: 0
        resueltos:
          type: integer
          minimum: 0
        permisos:
          $ref: '#/components/schemas/PermisosImpedimentosHdu'
        items:
          type: array
          description: Abiertos y escalados primero (`abiertoDesde` ascendente), luego resueltos (`fechaResolucion` descendente).
          items:
            $ref: '#/components/schemas/Impedimento'
    ImpedimentoDetalle:
      description: Impedimento con su HDU, permisos e historial completo, más antiguo primero (E4-F03, E4-B04#3).
      allOf:
        - $ref: '#/components/schemas/Impedimento'
        - type: object
          required: [hdu, hduCerrada, permisos, acciones]
          properties:
            hdu:
              $ref: '#/components/schemas/HduReferencia'
            hduCerrada:
              type: boolean
            permisos:
              $ref: '#/components/schemas/PermisosImpedimentosHdu'
            acciones:
              type: array
              items:
                $ref: '#/components/schemas/AccionImpedimentoRegistro'
    NuevoImpedimento:
      type: object
      description: |
        Registro (E4-B01). Va `responsableId` (un candidato de `REGISTRO`) o
        `responsableNombre` (tercero), no ambos. Sin ninguno, o con ambos,
        400 `VALIDACION` en `responsableNombre`. Con `tipo: OTRO`, la
        descripción exige 20 caracteres.
      required: [tipo, titulo, descripcion]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoImpedimento'
        titulo:
          type: string
          minLength: 5
          maxLength: 200
        descripcion:
          type: string
          minLength: 10
          maxLength: 1000
        responsableId:
          $ref: '#/components/schemas/Uuid'
        responsableNombre:
          type: string
          minLength: 3
          maxLength: 150
    SolicitudComentarioImpedimento:
      type: object
      description: Resolver o agregar seguimiento. Comentario en blanco → 422 `COMENTARIO_REQUERIDO`.
      required: [comentario]
      additionalProperties: false
      properties:
        comentario:
          type: string
          minLength: 3
          maxLength: 500
    SolicitudEscalamiento:
      type: object
      description: Destino (candidato de `ESCALAMIENTO` o tercero) y comentario (D64). Mismo destino que el responsable actual → 422 `RESPONSABLE_INVALIDO`.
      required: [comentario]
      additionalProperties: false
      properties:
        responsableId:
          $ref: '#/components/schemas/Uuid'
        responsableNombre:
          type: string
          minLength: 3
          maxLength: 150
        comentario:
          type: string
          minLength: 3
          maxLength: 500
    SolicitudReapertura:
      type: object
      description: Motivo en blanco → 422 `MOTIVO_REQUERIDO`.
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 500
    ResultadoAccionImpedimento:
      type: object
      required: [impedimento, accion, hdu]
      additionalProperties: false
      properties:
        impedimento:
          $ref: '#/components/schemas/Impedimento'
        accion:
          $ref: '#/components/schemas/AccionImpedimentoRegistro'
        hdu:
          type: object
          description: Bloqueo de la HDU después del cambio (E4-B02#2).
          required: [bloqueada, abiertos]
          additionalProperties: false
          properties:
            bloqueada:
              type: boolean
            abiertos:
              type: integer
              minimum: 0
              description: '`ABIERTO` + `ESCALADO`.'
    CandidatosResponsable:
      type: object
      description: Candidatos activos para el selector de responsable (tabla 3.5 del backlog E4). El portal agrega siempre «Otro (nombre)».
      required: [hduId, proposito, items, preseleccionadoId]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        proposito:
          $ref: '#/components/schemas/PropositoResponsable'
        items:
          type: array
          description: Sin repetidos (si el QE responsable es también el supervisor, aparece una vez).
          items:
            $ref: '#/components/schemas/PersonaRol'
        preseleccionadoId:
          description: En `REGISTRO`, el QE responsable; en `ESCALAMIENTO`, `null`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    DetalleFactorRiesgo:
      type: object
      description: |
        Valores con los que el portal arma la frase de cada factor (D76). Los
        umbrales salen de la configuración del servicio (D67); el portal no los
        fija. Campos por código:
        - `IMPEDIMENTO_ABIERTO`: `impedimentos` (abiertos + escalados).
        - `IMPEDIMENTO_ANTIGUO`: `impedimentoId`, `diasAbierto` (el más antiguo) y `umbralDias`.
        - `IMPEDIMENTO_ESCALADO`: `impedimentos` (escalados).
        - `SPRINT_VENCIDO`: `sprint`, `sprintFin` y `diasRestantes` (negativo).
        - `ATRASO_SPRINT_ALTO` y `ATRASO_SPRINT_MEDIO`: `sprint`, `sprintFin`, `diasRestantes`, `umbralDias`, `avance` y `umbralAvance`.
      additionalProperties: false
      properties:
        impedimentos:
          type: integer
          minimum: 1
        impedimentoId:
          $ref: '#/components/schemas/Uuid'
        diasAbierto:
          type: integer
          minimum: 0
        umbralDias:
          type: integer
          minimum: 0
        sprint:
          $ref: '#/components/schemas/CatalogoRef'
        sprintFin:
          $ref: '#/components/schemas/Fecha'
        diasRestantes:
          type: integer
          description: Fecha de fin menos hoy; el día de término es 0.
        avance:
          type: number
          minimum: 0
          maximum: 100
        umbralAvance:
          type: number
          minimum: 0
          maximum: 100
    FactorRiesgo:
      type: object
      required: [codigo, nivel, detalle]
      additionalProperties: false
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoFactorRiesgo'
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        detalle:
          $ref: '#/components/schemas/DetalleFactorRiesgo'
    RiesgoFijado:
      type: object
      description: Última fila de `riesgo_hdu` de la HDU (D65).
      required: [nivel, nivelAnterior, justificacion, sugeridoAlFijar, actor, fecha]
      additionalProperties: false
      properties:
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        nivelAnterior:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        justificacion:
          type: string
        sugeridoAlFijar:
          description: Nivel sugerido en el momento de fijar; `null` si no se pudo calcular.
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        actor:
          $ref: '#/components/schemas/PersonaRol'
        fecha:
          $ref: '#/components/schemas/FechaHora'
    RiesgoHdu:
      type: object
      description: |
        Panel «Riesgo» del detalle (E4-F04, E4-B03). Reglas D66–D68:
        - `nivelVigente` = `fijado.nivel` si existe; si no, `nivelSugerido`.
          `null` con `hduCerrada` y sin nivel fijado = «Sin evaluar».
        - Sugerencia: `estado: ok` con su nivel, o `indisponible` con
          `nivelSugerido: null`. Nunca `BAJO` por una fuente caída. Si falta
          el avance, los factores de atraso van en `factoresNoEvaluados`; si
          los factores evaluados ya dan `ALTO`, se informa `ALTO` con
          `calculoParcial: true`.
        - HDU cerrada: sin sugerencia (`motivoSinSugerencia: HDU_CERRADA`).
      required: [hduId, hduCerrada, nivelVigente, origen, fijado, nivelSugerido, estado, motivoSinSugerencia, calculoParcial, factores, factoresNoEvaluados, sugerenciaDistinta, fechaReferencia, permisos]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        hduCerrada:
          type: boolean
        nivelVigente:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        origen:
          oneOf:
            - $ref: '#/components/schemas/OrigenRiesgo'
            - type: 'null'
        fijado:
          oneOf:
            - $ref: '#/components/schemas/RiesgoFijado'
            - type: 'null'
        nivelSugerido:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoBloque'
          description: Estado de la sugerencia.
        motivoSinSugerencia:
          oneOf:
            - type: string
              enum: [HDU_CERRADA, FUENTE_NO_DISPONIBLE]
            - type: 'null'
        calculoParcial:
          type: boolean
        factores:
          type: array
          description: Factores aplicables, del nivel más alto al más bajo. Vacío con `BAJO` («Sin factores de riesgo»).
          items:
            $ref: '#/components/schemas/FactorRiesgo'
        factoresNoEvaluados:
          type: array
          description: Factores que no se pudieron evaluar por una fuente caída (D68).
          items:
            $ref: '#/components/schemas/CodigoFactorRiesgo'
        sugerenciaDistinta:
          type: boolean
          description: Hay nivel fijado y una sugerencia distinta. El portal avisa «La sugerencia actual es X» (D66).
        fechaReferencia:
          $ref: '#/components/schemas/Fecha'
          description: «Hoy» usado en el cálculo (America/Santiago, o `Q360_FECHA_REFERENCIA` fuera de producción).
        permisos:
          type: object
          required: [puedeFijarRiesgo]
          additionalProperties: false
          properties:
            puedeFijarRiesgo:
              type: boolean
    CambioRiesgo:
      type: object
      description: Justificación en blanco → 422 `JUSTIFICACION_REQUERIDA`; nivel fuera del catálogo → 400 `VALIDACION` (`VALOR_NO_PERMITIDO`).
      required: [nivel, justificacion]
      additionalProperties: false
      properties:
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        justificacion:
          type: string
          minLength: 3
          maxLength: 500
    ResultadoCambioRiesgo:
      type: object
      required: [cambio, riesgo]
      additionalProperties: false
      properties:
        cambio:
          type: boolean
          description: Falso si el nivel y la justificación son iguales a los vigentes; no se agrega fila.
        riesgo:
          $ref: '#/components/schemas/RiesgoHdu'
    RiesgoResumen:
      type: object
      description: |
        Riesgo vigente para listados y bandejas. `estado: indisponible` con
        `nivelVigente: null` = «No disponible»; `estado: ok` con
        `nivelVigente: null` = «Sin evaluar» (HDU cerrada sin nivel fijado).
        Un nivel fijado se informa aunque la sugerencia no se pueda calcular.
      required: [nivelVigente, origen, estado, calculoParcial]
      additionalProperties: false
      properties:
        nivelVigente:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        origen:
          oneOf:
            - $ref: '#/components/schemas/OrigenRiesgo'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoBloque'
        calculoParcial:
          type: boolean
    ItemListaImpedimento:
      description: Fila de `GET /v1/impedimentos` (E4-F02).
      allOf:
        - $ref: '#/components/schemas/Impedimento'
        - type: object
          required: [hdu, celula, analista, qeResponsable, riesgo, soloLectura]
          properties:
            hdu:
              $ref: '#/components/schemas/HduReferencia'
            celula:
              $ref: '#/components/schemas/CatalogoRef'
            analista:
              oneOf:
                - $ref: '#/components/schemas/Persona'
                - type: 'null'
            qeResponsable:
              $ref: '#/components/schemas/Persona'
            riesgo:
              $ref: '#/components/schemas/RiesgoResumen'
            soloLectura:
              type: boolean
              description: Verdadero si quien consulta no es el QE responsable de la HDU (QE supervisor, Líder, Administrador, Auditor). El portal muestra «Solo lectura».
    PaginaImpedimentos:
      type: object
      required: [items, total, pagina, tamanoPagina, orden, contadores]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemListaImpedimento'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
        orden:
          type: string
          description: Orden aplicado. Si el pedido depende del riesgo y Certificaciones no respondió, se informa el de respaldo `diasAbierto:desc` (D74).
        contadores:
          type: object
          description: Sobre todo el ámbito, sin filtros. Solo datos propios de Impedimentos.
          required: [abiertos, escalados, nuevos]
          additionalProperties: false
          properties:
            abiertos:
              type: integer
              minimum: 0
              description: '`ABIERTO` + `ESCALADO`.'
            escalados:
              type: integer
              minimum: 0
            nuevos:
              type: integer
              minimum: 0
              description: No resueltos registrados hace menos de 24 horas.
    ItemRiesgoHdu:
      type: object
      description: Fila de «Riesgo por HDU» (E4-F04#3).
      required: [hdu, celula, sprint, analista, qeResponsable, avance, impedimentosAbiertos, bloqueada, riesgo, actualizadoEn, soloLectura]
      additionalProperties: false
      properties:
        hdu:
          $ref: '#/components/schemas/HduReferencia'
        celula:
          $ref: '#/components/schemas/CatalogoRef'
        sprint:
          $ref: '#/components/schemas/CatalogoRef'
        analista:
          oneOf:
            - $ref: '#/components/schemas/Persona'
            - type: 'null'
        qeResponsable:
          $ref: '#/components/schemas/Persona'
        avance:
          description: aprobados / 10 × 100 (D16, D68); `null` si Certificaciones no respondió.
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: 'null'
        impedimentosAbiertos:
          type: integer
          minimum: 0
        bloqueada:
          type: boolean
        riesgo:
          $ref: '#/components/schemas/RiesgoResumen'
        actualizadoEn:
          description: Fecha del último nivel fijado, o `null` si nunca se fijó.
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        soloLectura:
          type: boolean
    PaginaRiesgoHdu:
      type: object
      required: [items, total, pagina, tamanoPagina, orden]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRiesgoHdu'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
        orden:
          type: string
    EntradaGestion:
      type: object
      description: |
        Entrada del historial de gestión (E4-B04): una acción de impedimento
        (`tipo: IMPEDIMENTO`) o un cambio de nivel de riesgo (`tipo: RIESGO`,
        acción `FIJAR_RIESGO`). En `RIESGO`, `anterior` y `nuevo` son
        niveles y `comentario` es la justificación.
      required: [id, tipo, accion, hdu, impedimento, actor, fecha, anterior, nuevo, comentario, sugeridoAlFijar, detalle]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [IMPEDIMENTO, RIESGO]
        accion:
          type: string
          enum: [REGISTRAR, ESCALAR, RESOLVER, REABRIR, SEGUIMIENTO, FIJAR_RIESGO]
        hdu:
          $ref: '#/components/schemas/HduReferencia'
        impedimento:
          description: '`null` en `RIESGO`.'
          oneOf:
            - type: object
              required: [id, titulo, tipo]
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                titulo:
                  type: string
                tipo:
                  $ref: '#/components/schemas/TipoImpedimento'
            - type: 'null'
        actor:
          $ref: '#/components/schemas/PersonaRol'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        anterior:
          type: [string, 'null']
        nuevo:
          type: string
        comentario:
          type: [string, 'null']
        sugeridoAlFijar:
          description: Solo en `RIESGO`.
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        detalle:
          type: [object, 'null']
          description: En `ESCALAR`, `{responsableAnterior, responsableNuevo}`.
    HistorialGestionHdu:
      type: object
      required: [hduId, orden, items]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        orden:
          type: string
          enum: ['fecha:asc', 'fecha:desc']
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntradaGestion'
    PaginaGestionImpedimentos:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/EntradaGestion'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100
    ItemAuditorImpedimento:
      description: Fila de la vista «Impedimentos» del Auditor (E4-B04).
      allOf:
        - $ref: '#/components/schemas/Impedimento'
        - type: object
          required: [hdu]
          properties:
            hdu:
              $ref: '#/components/schemas/HduReferencia'
    PaginaAuditorImpedimentos:
      type: object
      required: [items, total, pagina, tamanoPagina]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Del registro más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/ItemAuditorImpedimento'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          minimum: 1
          maximum: 100

    # ------------------------------------- E4 · contratos internos (D85, D86)
    HduEvaluable:
      type: object
      description: Datos que Organización ya tiene y envía para evaluar una HDU (D69).
      required: [hduId, estado, sprintFin, avance]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoHdu'
        sprintFin:
          description: Fin del sprint vigente, o `null` si no tiene.
          oneOf:
            - $ref: '#/components/schemas/Fecha'
            - type: 'null'
        avance:
          description: '`SeguimientoHdu.porcentaje`; `null` si Certificaciones no respondió.'
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: 'null'
    SolicitudEvaluacionImpedimentos:
      type: object
      required: [hdu]
      additionalProperties: false
      properties:
        hdu:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/HduEvaluable'
        incluirImpedimentos:
          type: boolean
          default: false
          description: Si es verdadero, la respuesta trae los impedimentos `ABIERTO` y `ESCALADO` del lote (para las listas de las bandejas).
    EvaluacionImpedimentosHdu:
      type: object
      required: [hduId, bloqueada, abiertos, escalados, nuevos, riesgo, nivelFijado, nivelSugerido]
      additionalProperties: false
      properties:
        hduId:
          $ref: '#/components/schemas/Uuid'
        bloqueada:
          type: boolean
        abiertos:
          type: integer
          minimum: 0
          description: '`ABIERTO` + `ESCALADO`.'
        escalados:
          type: integer
          minimum: 0
        nuevos:
          type: integer
          minimum: 0
        riesgo:
          $ref: '#/components/schemas/RiesgoResumen'
        nivelFijado:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
        nivelSugerido:
          oneOf:
            - $ref: '#/components/schemas/NivelRiesgo'
            - type: 'null'
    ResultadoEvaluacionImpedimentos:
      type: object
      required: [fechaReferencia, items, impedimentos]
      additionalProperties: false
      properties:
        fechaReferencia:
          $ref: '#/components/schemas/Fecha'
        items:
          type: array
          description: Una evaluación por HDU pedida, en el mismo orden.
          items:
            $ref: '#/components/schemas/EvaluacionImpedimentosHdu'
        impedimentos:
          type: array
          description: Con `incluirImpedimentos`, los `ABIERTO` y `ESCALADO` del lote, ordenados por `abiertoDesde` ascendente; si no, vacío.
          items:
            $ref: '#/components/schemas/Impedimento'
    ImpedimentoBloqueante:
      type: object
      required: [id, titulo, tipo, estado, diasAbierto]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        titulo:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoImpedimento'
        estado:
          type: string
          enum: [ABIERTO, ESCALADO]
        diasAbierto:
          type: integer
          minimum: 0
    ListaImpedimentosBloqueantes:
      type: object
      description: Impedimentos que impiden cerrar una HDU (D60, D77). `items` trae hasta 20, los más antiguos primero; `total` los cuenta todos.
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImpedimentoBloqueante'
    ImpedimentosAbiertosHdu:
      description: Respuesta de la consulta de cierre (`GET /v1/interno/hdu/{hduId}/impedimentos/abiertos`).
      allOf:
        - $ref: '#/components/schemas/ListaImpedimentosBloqueantes'
        - type: object
          required: [hduId]
          properties:
            hduId:
              $ref: '#/components/schemas/Uuid'

    # ----------------------------------------- E4 · bloques de bandeja (D87)
    BloqueBloqueoFila:
      description: Bloqueo de una fila de HDU en la bandeja (columna «Bloqueo»).
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente: {type: string, const: impedimentos.impedimentos}
            estado: {type: string, const: ok}
            datos:
              type: object
              required: [bloqueada, abiertos]
              additionalProperties: false
              properties:
                bloqueada:
                  type: boolean
                abiertos:
                  type: integer
                  minimum: 0
        - $ref: '#/components/schemas/BloqueIndisponible'
    BloqueRiesgoFila:
      description: Riesgo vigente de una fila de HDU (columna «Riesgo» del Líder).
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente: {type: string, const: impedimentos.riesgo}
            estado: {type: string, const: ok}
            datos:
              $ref: '#/components/schemas/RiesgoResumen'
        - $ref: '#/components/schemas/BloqueIndisponible'
    ItemImpedimentoBandeja:
      type: object
      description: Fila de impedimento en una bandeja. Organización la arma con la evaluación de Impedimentos y sus propios datos de la HDU.
      required: [id, hdu, celula, analista, tipo, titulo, estado, responsable, diasAbierto, fechaRegistro, esNuevo, escaladoAMi, riesgo]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hdu:
          $ref: '#/components/schemas/HduReferencia'
        celula:
          $ref: '#/components/schemas/CatalogoRef'
        analista:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        tipo:
          $ref: '#/components/schemas/TipoImpedimento'
        titulo:
          type: string
        estado:
          type: string
          enum: [ABIERTO, ESCALADO]
        responsable:
          $ref: '#/components/schemas/ResponsableImpedimento'
        creadoPor:
          $ref: '#/components/schemas/PersonaRol'
        diasAbierto:
          type: integer
          minimum: 0
        fechaRegistro:
          $ref: '#/components/schemas/FechaHora'
        esNuevo:
          type: boolean
        escaladoAMi:
          type: boolean
          description: Estado `ESCALADO` y `responsable.id` igual a quien consulta.
        riesgo:
          $ref: '#/components/schemas/RiesgoResumen'
    BloqueListaImpedimentos:
      oneOf:
        - type: object
          required: [fuente, estado, datos]
          additionalProperties: false
          properties:
            fuente: {type: string, const: impedimentos.impedimentos}
            estado: {type: string, const: ok}
            datos:
              type: object
              required: [items, total]
              additionalProperties: false
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ItemImpedimentoBandeja'
                total:
                  type: integer
                  minimum: 0
                  description: Todos los que cumplen la regla de la lista, aunque `items` traiga menos.
        - $ref: '#/components/schemas/BloqueIndisponible'
    ImpedimentosBandejaAnalista:
      type: object
      description: Sin riesgo (D73).
      required: [contadores]
      additionalProperties: false
      properties:
        contadores:
          type: object
          required: [impedimentosAbiertos]
          additionalProperties: false
          properties:
            impedimentosAbiertos:
              $ref: '#/components/schemas/Contador'
              description: '`ABIERTO` + `ESCALADO` de mis HDU.'
    ImpedimentosBandejaQe:
      type: object
      description: Ámbito de la bandeja del QE (HDU donde es responsable, E7-F03#3). La lista no suma filas a `acciones` (D71).
      required: [contadores, lista]
      additionalProperties: false
      properties:
        contadores:
          type: object
          required: [impedimentosAbiertos, impedimentosNuevos, hduRiesgoAlto]
          additionalProperties: false
          properties:
            impedimentosAbiertos:
              $ref: '#/components/schemas/Contador'
            impedimentosNuevos:
              $ref: '#/components/schemas/Contador'
              description: No resueltos registrados hace menos de 24 horas (D72).
            hduRiesgoAlto:
              $ref: '#/components/schemas/Contador'
              description: HDU no cerradas con riesgo vigente `ALTO`. `indisponible` si alguna HDU del ámbito tiene el riesgo `indisponible` (nunca cuenta de menos).
        lista:
          $ref: '#/components/schemas/BloqueListaImpedimentos'
          description: Hasta 10, orden D74 (riesgo vigente y días abiertos).
    ImpedimentosBandejaLider:
      type: object
      description: Solo lectura. Sin células, contadores en 0 con `ok` y lista vacía.
      required: [contadores, lista]
      additionalProperties: false
      properties:
        contadores:
          type: object
          required: [impedimentosAbiertos, hduBloqueadas, escaladosAMi]
          additionalProperties: false
          properties:
            impedimentosAbiertos:
              $ref: '#/components/schemas/Contador'
            hduBloqueadas:
              $ref: '#/components/schemas/Contador'
            escaladosAMi:
              $ref: '#/components/schemas/Contador'
        lista:
          $ref: '#/components/schemas/BloqueListaImpedimentos'
          description: Todos los abiertos y escalados de sus células, hasta 50; los escalados a él primero y luego orden D74 (D79).
    ImpedimentosBandejaAdmin:
      type: object
      description: Solo consulta (D57, D83). No altera los bloques certificados ni su independencia de Certificaciones.
      required: [contadores, escalados]
      additionalProperties: false
      properties:
        contadores:
          type: object
          required: [impedimentosAbiertos, hduBloqueadas, hduRiesgoAlto]
          additionalProperties: false
          properties:
            impedimentosAbiertos:
              $ref: '#/components/schemas/Contador'
            hduBloqueadas:
              $ref: '#/components/schemas/Contador'
            hduRiesgoAlto:
              $ref: '#/components/schemas/Contador'
              description: Necesita el avance de Certificaciones; si no responde, puede quedar `indisponible` sin afectar al resto de la bandeja.
        escalados:
          $ref: '#/components/schemas/BloqueListaImpedimentos'
          description: Escalados a este Administrador, hasta 50, los más antiguos primero.
    ImpedimentosBandejaAuditor:
      type: object
      required: [contadores]
      additionalProperties: false
      properties:
        contadores:
          type: object
          required: [impedimentosAbiertos, hduBloqueadas]
          additionalProperties: false
          properties:
            impedimentosAbiertos:
              $ref: '#/components/schemas/Contador'
            hduBloqueadas:
              $ref: '#/components/schemas/Contador'

  headers:
    XTraceId:
      description: Identificador de traza de la solicitud.
      schema:
        type: string
    RetryAfter:
      description: Segundos que conviene esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1

  parameters:
    ClaveEntregablePath:
      name: clave
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ClaveEntregable'
    FolioPath:
      name: folio
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanoPagina:
      name: tamanoPagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsuarioIdPath:
      name: id
      in: path
      required: true
      description: UUID del usuario (igual al `sub` de Supabase Auth).
      schema:
        $ref: '#/components/schemas/Uuid'
    AnalistaIdPath:
      name: id
      in: path
      required: true
      description: UUID del Analista QA.
      schema:
        $ref: '#/components/schemas/Uuid'
    HduIdPath:
      name: id
      in: path
      required: true
      description: UUID de la HDU.
      schema:
        $ref: '#/components/schemas/Uuid'
    # E7 · filtros de bandejas y consultas del Auditor (D49)
    TamanoPaginaBandeja:
      name: tamanoPagina
      in: query
      required: false
      description: 25 por defecto. Un valor mayor a 100 se recorta a 100 sin error; la respuesta informa el tamaño efectivo (E7-B03-T08).
      schema:
        type: integer
        minimum: 1
        default: 25
    FiltroCelula:
      name: celulaId
      in: query
      required: false
      description: Para el Líder QA, solo una de sus células vigentes; otra responde 403 `ACCESO_DENEGADO` (E7-B02#1).
      schema:
        $ref: '#/components/schemas/Uuid'
    FiltroSprint:
      name: sprintId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    FiltroEstadoHdu:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoHdu'
    FiltroQe:
      name: qeId
      in: query
      required: false
      description: QE responsable.
      schema:
        $ref: '#/components/schemas/Uuid'
    FiltroAnalista:
      name: analistaId
      in: query
      required: false
      description: Analista asignado.
      schema:
        $ref: '#/components/schemas/Uuid'
    FiltroBusqueda:
      name: q
      in: query
      required: false
      description: Coincidencia parcial en código o título, sin distinguir mayúsculas.
      schema:
        type: string
        minLength: 2
        maxLength: 120
    FiltroDesde:
      name: desde
      in: query
      required: false
      description: Inicio del rango, inclusivo.
      schema:
        $ref: '#/components/schemas/FechaHora'
    FiltroHasta:
      name: hasta
      in: query
      required: false
      description: Fin del rango, inclusivo. Anterior a `desde` → 400.
      schema:
        $ref: '#/components/schemas/FechaHora'
    Orden:
      name: orden
      in: query
      required: false
      description: '`columna:asc|desc`. Columnas: `codigo`, `celula`, `sprint`, `prioridad`, `estado`, `avance`, `actualizada`, `fecha`. Sin orden, el de cada bandeja (sección 6 del backlog E7). Una columna no válida → 400.'
      schema:
        type: string
        pattern: '^[a-z]+:(asc|desc)$'
    FiltroSoloBloqueadas:
      name: soloBloqueadas
      in: query
      required: false
      description: E4 (D87). Solo HDU con impedimentos `ABIERTO` o `ESCALADO`. Depende de Impedimentos; si no responde, la lista viene `indisponible`, nunca sin filtrar.
      schema:
        type: boolean
    XTraceIdSolicitud:
      name: x-trace-id
      in: header
      required: false
      description: Traza entrante; si falta, se genera.
      schema:
        type: string

  responses:
    Validacion:
      description: Datos inválidos. `detalles[]` indica cada campo.
      x-codigos: [VALIDACION]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: VALIDACION
            mensaje: Los datos enviados no son válidos.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles:
              - campo: correo
                codigo: REQUERIDO
                mensaje: El correo es obligatorio.
    NoAutenticado:
      description: Sin sesión válida (`NO_AUTENTICADO`) o sesión vencida (`SESION_EXPIRADA`).
      x-codigos: [NO_AUTENTICADO, SESION_EXPIRADA]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SESION_EXPIRADA
            mensaje: Tu sesión expiró. Inicia sesión nuevamente.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    AccesoDenegado:
      description: Rol no permitido, usuario inactivo o recurso fuera del ámbito. Mensaje genérico (D12).
      x-codigos: [ACCESO_DENEGADO]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ACCESO_DENEGADO
            mensaje: No tienes acceso a este recurso.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    NoEncontrado:
      description: El recurso no existe.
      x-codigos: [NO_ENCONTRADO]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DemasiadasSolicitudes:
      description: Límite de tasa excedido.
      x-codigos: [DEMASIADAS_SOLICITUDES]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorInterno:
      description: Error inesperado.
      x-codigos: [ERROR_INTERNO]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServicioNoDisponible:
      description: El servicio de destino no respondió dentro del tiempo límite o está caído.
      x-codigos: [SERVICIO_NO_DISPONIBLE]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExportacionCsv:
      description: |
        CSV con los mismos filtros y columnas que la consulta (D35, D48):
        UTF-8 con BOM, separador `;`, fila de encabezado, fechas ISO 8601 en
        UTC. Sin coincidencias, solo el encabezado. Antes de responder, la
        exportación queda registrada en la auditoría (`EXPORTAR`); si el
        registro falla, no se entrega el archivo (503).
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
        Content-Disposition:
          description: '`attachment; filename="quality360-<recurso>-<AAAA-MM-DD>.csv"`'
          schema:
            type: string
        X-Q360-Filas:
          description: Filas de datos exportadas, sin el encabezado.
          schema:
            type: integer
            minimum: 0
      content:
        text/csv:
          schema:
            type: string
    ExportacionExcedeLimite:
      description: El resultado supera el límite de filas (50.000; configurable con `EXPORTACION_LIMITE_FILAS` para pruebas). No se genera el archivo ni se registra la exportación.
      x-codigos: [EXPORTACION_EXCEDE_LIMITE]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: EXPORTACION_EXCEDE_LIMITE
            mensaje: La exportación supera las 50.000 filas. Acota los filtros.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    ProveedorIdentidadNoDisponible:
      description: Supabase Auth no confirmó el cambio. No se aplicó nada.
      x-codigos: [PROVEEDOR_IDENTIDAD_NO_DISPONIBLE]
      headers:
        x-trace-id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
