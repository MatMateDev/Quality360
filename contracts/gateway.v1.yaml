  /v1/analistas/{id}/supervisor:
    parameters:
      - $ref: '#/components/parameters/AnalistaIdPath'
    put:
      operationId: asignarSupervisor
      tags: [Supervisión]
      summary: Asignar o cambiar el QE supervisor de un analista
      description: |
        - El supervisor debe ser QE y el supervisado Analista QA, ambos activos;
          si no, 422 `SUPERVISION_INVALIDA` (E1-B09#1).
        - Si el analista ya tiene otro QE vigente, `motivo` es obligatorio
          (422 `MOTIVO_REQUERIDO`, E1-F10#2). En una sola transacción se cierra
          la relación anterior (`hasta = now()`) y se crea la nueva con el
          motivo (E1-B09#2, E1-B12#2). Nunca hay dos QE vigentes.
        - Un QE puede supervisar varios analistas (E1-B09#3).
        - Mismo QE vigente: 200 con `cambio: false`, sin historial.
        - Auditoría `ASIGNAR_SUPERVISOR` o `CAMBIAR_SUPERVISOR` (E1-B12#1).
      x-roles: [ADMINISTRADOR]
      x-hdu: [E1-F10#1, E1-F10#2, E1-B09#1, E1-B09#2, E1-B09#3, E1-B12#1, E1-B12#2]
