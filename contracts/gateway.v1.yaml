        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

components:
  securitySchemes:
    sesionSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth. Vencido → 401 `SESION_EXPIRADA`; ausente o inválido → 401 `NO_AUTENTICADO`.

  schemas:
    Salud:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          const: ok

    InicioAdmin:
      type: object
      required: [usuarios, supervision]
      additionalProperties: false
      properties:
        usuarios:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.usuarios}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenUsuariosAdmin'}
            - $ref: '#/components/schemas/BloqueIndisponible'
        supervision:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.supervision}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenSupervisionAdmin'}
            - $ref: '#/components/schemas/BloqueIndisponible'
    InicioQe:
      type: object
      required: [equipo, hdu]
      additionalProperties: false
      properties:
        equipo:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.supervision}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenEquipoQe'}
            - $ref: '#/components/schemas/BloqueIndisponible'
        hdu:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.hdu}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenHduQe'}
            - $ref: '#/components/schemas/BloqueIndisponible'
    InicioQa:
      type: object
      required: [supervisor, hdu]
      additionalProperties: false
      properties:
        supervisor:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.supervision}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenSupervisorQa'}
            - $ref: '#/components/schemas/BloqueIndisponible'
        hdu:
          oneOf:
            - type: object
              required: [fuente, estado, datos]
              additionalProperties: false
              properties:
                fuente: {type: string, const: organizacion.hdu}
                estado: {type: string, const: ok}
                datos: {$ref: './comun.v1.yaml#/components/schemas/ResumenHduQa'}
            - $ref: '#/components/schemas/BloqueIndisponible'
    HduDetalle:
      description: Detalle de Organización más el bloque `checklist` de Certificaciones (E2-F04#1).
      allOf:
        - $ref: './comun.v1.yaml#/components/schemas/HduDetalleBase'
        - type: object
          required: [checklist]
          properties:
            checklist:
              $ref: './comun.v1.yaml#/components/schemas/BloqueChecklist'

    # Alias de esquemas comunes
    Uuid: {$ref: './comun.v1.yaml#/components/schemas/Uuid'}
    Rol: {$ref: './comun.v1.yaml#/components/schemas/Rol'}
    EstadoHdu: {$ref: './comun.v1.yaml#/components/schemas/EstadoHdu'}
    Error: {$ref: './comun.v1.yaml#/components/schemas/Error'}
    ErrorTransicionInvalida: {$ref: './comun.v1.yaml#/components/schemas/ErrorTransicionInvalida'}
    ErrorCierreRechazado: {$ref: './comun.v1.yaml#/components/schemas/ErrorCierreRechazado'}
    ErrorRelacionesIncompatibles: {$ref: './comun.v1.yaml#/components/schemas/ErrorRelacionesIncompatibles'}
    BloqueIndisponible: {$ref: './comun.v1.yaml#/components/schemas/BloqueIndisponible'}
    Perfil: {$ref: './comun.v1.yaml#/components/schemas/Perfil'}
    EquipoQe: {$ref: './comun.v1.yaml#/components/schemas/EquipoQe'}
    ListaAnalistasAsignables: {$ref: './comun.v1.yaml#/components/schemas/ListaAnalistasAsignables'}
    Usuario: {$ref: './comun.v1.yaml#/components/schemas/Usuario'}
    PaginaUsuarios: {$ref: './comun.v1.yaml#/components/schemas/PaginaUsuarios'}
    NuevoUsuario: {$ref: './comun.v1.yaml#/components/schemas/NuevoUsuario'}
    ActualizacionUsuario: {$ref: './comun.v1.yaml#/components/schemas/ActualizacionUsuario'}
    CambioRol: {$ref: './comun.v1.yaml#/components/schemas/CambioRol'}
    AsignacionSupervisor: {$ref: './comun.v1.yaml#/components/schemas/AsignacionSupervisor'}
    ResultadoCambioSupervision: {$ref: './comun.v1.yaml#/components/schemas/ResultadoCambioSupervision'}
    HistorialSupervision: {$ref: './comun.v1.yaml#/components/schemas/HistorialSupervision'}
    PaginaAuditoria: {$ref: './comun.v1.yaml#/components/schemas/PaginaAuditoria'}
    ListaCelulas: {$ref: './comun.v1.yaml#/components/schemas/ListaCelulas'}
    ListaSprints: {$ref: './comun.v1.yaml#/components/schemas/ListaSprints'}
    PaginaHdu: {$ref: './comun.v1.yaml#/components/schemas/PaginaHdu'}
    NuevaHdu: {$ref: './comun.v1.yaml#/components/schemas/NuevaHdu'}
    HduDetalleBase: {$ref: './comun.v1.yaml#/components/schemas/HduDetalleBase'}
    AsignacionAnalista: {$ref: './comun.v1.yaml#/components/schemas/AsignacionAnalista'}
    ResultadoAsignacion: {$ref: './comun.v1.yaml#/components/schemas/ResultadoAsignacion'}
    SolicitudCambioEstado: {$ref: './comun.v1.yaml#/components/schemas/SolicitudCambioEstado'}
    ResultadoCambioEstado: {$ref: './comun.v1.yaml#/components/schemas/ResultadoCambioEstado'}
    HistorialHdu: {$ref: './comun.v1.yaml#/components/schemas/HistorialHdu'}

  parameters:
    Pagina: {$ref: './comun.v1.yaml#/components/parameters/Pagina'}
    TamanoPagina: {$ref: './comun.v1.yaml#/components/parameters/TamanoPagina'}
    UsuarioIdPath: {$ref: './comun.v1.yaml#/components/parameters/UsuarioIdPath'}
    AnalistaIdPath: {$ref: './comun.v1.yaml#/components/parameters/AnalistaIdPath'}
    HduIdPath: {$ref: './comun.v1.yaml#/components/parameters/HduIdPath'}

  responses:
    Validacion: {$ref: './comun.v1.yaml#/components/responses/Validacion'}
    NoAutenticado: {$ref: './comun.v1.yaml#/components/responses/NoAutenticado'}
    AccesoDenegado: {$ref: './comun.v1.yaml#/components/responses/AccesoDenegado'}
    NoEncontrado: {$ref: './comun.v1.yaml#/components/responses/NoEncontrado'}
    DemasiadasSolicitudes: {$ref: './comun.v1.yaml#/components/responses/DemasiadasSolicitudes'}
    ErrorInterno: {$ref: './comun.v1.yaml#/components/responses/ErrorInterno'}
    ServicioNoDisponible: {$ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'}
    ProveedorIdentidadNoDisponible: {$ref: './comun.v1.yaml#/components/responses/ProveedorIdentidadNoDisponible'}
