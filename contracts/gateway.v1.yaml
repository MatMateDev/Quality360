  /v1/hdu:
    get:
      operationId: listarHdu
      tags: [HDU]
      summary: Listar HDU del ámbito del usuario
      description: |
        Ámbito por rol, aplicado siempre antes de los filtros (E2-B03):
        - Analista QA: HDU con `analistaId` igual a su id (E2-F03#3).
        - QE: HDU donde es QE responsable o cuyo analista supervisa hoy.
        - Administrador: todas.

        Los filtros se combinan con Y. `items` vacío solo si la consulta
        terminó bien sin coincidencias (E2-F03#2). Un filtro con un UUID que no
        existe devuelve lista vacía; un UUID o estado mal formado, 400.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA]
      x-hdu: [E2-F01#1, E2-F02#1, E2-F03#1, E2-F03#2, E2-F03#3, E2-B03#1, E2-B03#2, E2-B03#3]
      parameters:
        - name: celulaId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: sprintId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoHdu'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de HDU del ámbito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaHdu'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      operationId: crearHdu
      tags: [HDU]
      summary: Registrar una HDU
      description: |
        Solo QE. Orden de validación: esquema (400, con cada campo faltante,
        E2-F01#2 y E2-B01#2) → célula y sprint existentes (422) → unicidad del
        código (409, E2-F01#3 y E2-B01#3).

        Se crea en `PENDIENTE`, sin analista, con el QE autenticado como
        `qeResponsable` y `creadoPor`, y con `creadoEn` (E2-B01#1). En la misma
        transacción registra el evento de historial `ESTADO` (`null` →
        `PENDIENTE`) y la auditoría `CREAR_HDU`.
      x-roles: [QE]
      x-hdu: [E2-F01#1, E2-F01#2, E2-F01#3, E2-B01#1, E2-B01#2, E2-B01#3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaHdu'
      responses:
        '201':
          description: HDU creada.
          headers:
            Location:
              description: '`/v1/hdu/{id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HduDetalleBase'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          description: 'Ya existe una HDU con ese código. `detalles` incluye `{campo: codigo, codigo: DUPLICADO}`.'
          x-codigos: [CODIGO_HDU_DUPLICADO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CODIGO_HDU_DUPLICADO
                mensaje: Ya existe una HDU con ese identificador.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                detalles:
                  - {campo: codigo, codigo: DUPLICADO, mensaje: Ya existe una HDU con el identificador PAGOS-1042.}
        '422':
          description: La célula o el sprint no existen. `detalles` indica `celulaId` o `sprintId` con `NO_EXISTE`.
          x-codigos: [CATALOGO_INVALIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /v1/hdu/{id}:
    parameters:
      - $ref: '#/components/parameters/HduIdPath'
    get:
      operationId: obtenerHdu
      tags: [HDU]
      summary: Detalle de una HDU
      description: |
        Composición:
        - Organización `GET /v1/hdu/{id}`: obligatoria. Su 403 o 404 se
          devuelve tal cual; si no responde, 503.
        - Certificaciones `GET /v1/hdu/{id}/checklist`: bloque `checklist`. Un
          503, error o tiempo agotado lo deja `indisponible`. En esta corrida
          siempre es `indisponible` y el portal muestra «no disponible».

        Acceso: el mismo ámbito de `GET /v1/hdu`. Fuera de ámbito, 403
        `ACCESO_DENEGADO` (E2-F04#2, D12). Para QE y Analista QA una HDU
        inexistente también responde 403; el 404 solo lo recibe el
        Administrador.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA]
      x-hdu: [E1-B02#2, E2-F02#1, E2-F04#1, E2-F04#2, E2-F04#3, E2-B03#1, E2-B03#2]
      responses:
        '200':
          description: Detalle con responsables, estado, fecha del último cambio, transiciones permitidas, permisos y checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HduDetalle'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /v1/hdu/{id}/analista:
    parameters:
      - $ref: '#/components/parameters/HduIdPath'
    put:
      operationId: asignarAnalistaHdu
      tags: [HDU]
      summary: Asignar o reasignar el analista de una HDU
      description: |
        - Pueden hacerlo el QE responsable de la HDU y el Administrador; otro
          usuario recibe 403.
        - El analista debe ser Analista QA activo (422 `ANALISTA_INVALIDO`). Si
          quien asigna es QE, además debe pertenecer a su equipo vigente
          (422 `ANALISTA_FUERA_DE_EQUIPO`, E2-F02#2).
        - Si la HDU ya tiene otro analista, `motivo` es obligatorio
          (422 `MOTIVO_REQUERIDO`); el portal pide confirmación antes (E2-F02#3).
        - HDU `CERRADA`: 409 `HDU_CERRADA`.
        - Mismo analista: 200 con `cambio: false`, sin historial.
        - Con cambio, en la misma transacción: evento `ASIGNACION` con analista
          anterior, nuevo y motivo (E2-B04#2), y auditoría `ASIGNAR_ANALISTA` o
          `REASIGNAR_ANALISTA`. La HDU pasa a ser visible para el nuevo
          analista (E2-F02#1).
      x-roles: [QE, ADMINISTRADOR]
      x-hdu: [E2-F02#1, E2-F02#2, E2-F02#3, E2-B04#2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionAnalista'
      responses:
        '200':
          description: Resultado de la asignación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAsignacion'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La HDU está cerrada.
          x-codigos: [HDU_CERRADA]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Analista no válido, fuera del equipo del QE, o falta el motivo de reasignación.
          x-codigos: [ANALISTA_INVALIDO, ANALISTA_FUERA_DE_EQUIPO, MOTIVO_REQUERIDO]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: ANALISTA_FUERA_DE_EQUIPO
                mensaje: El analista no pertenece al equipo vigente del QE responsable.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                detalles:
                  - {campo: analistaId, codigo: NO_PERMITIDO, mensaje: El analista no pertenece a tu equipo vigente.}
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /v1/hdu/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/HduIdPath'
    post:
      operationId: cambiarEstadoHdu
      tags: [HDU]
      summary: Cambiar el estado de una HDU
      description: |
        - Pueden hacerlo el analista asignado, un QE con la HDU en su ámbito y
          el Administrador.
        - Solo transiciones de D10 (ver `EstadoHdu`). Otra, incluido el mismo
          estado, responde 409 `TRANSICION_INVALIDA` con
          `transicionesPermitidas` (E2-B02#2).
        - Hacia `CERRADA`, Organización consulta
          `GET /v1/hdu/{id}/checklist` de Certificaciones con 2 s de tiempo
          límite (D11):
          - `completo: true` → cierra.
          - `completo: false` → 409 `CHECKLIST_INCOMPLETO`.
          - 503, error o tiempo agotado → 409 `CHECKLIST_NO_DISPONIBLE`. Es el
            resultado de esta corrida (E2-B02#3).
        - Aceptado: actualiza `estadoActualizadoEn` y, en la misma transacción,
          registra el evento `ESTADO` (anterior, nuevo, actor, fecha) y la
          auditoría `CAMBIAR_ESTADO_HDU` (E2-B02#1, E2-B04#1, E2-F04#3).
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA]
      x-hdu: [E2-F04#3, E2-B02#1, E2-B02#2, E2-B02#3, E2-B04#1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCambioEstado'
      responses:
        '200':
          description: Transición aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCambioEstado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Transición inválida o cierre rechazado.
          x-codigos: [TRANSICION_INVALIDA, CHECKLIST_INCOMPLETO, CHECKLIST_NO_DISPONIBLE]
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorTransicionInvalida'
                  - $ref: '#/components/schemas/ErrorCierreRechazado'
              examples:
                transicionInvalida:
                  summary: PENDIENTE → CERRADA (E2-B02#2)
                  value:
                    codigo: TRANSICION_INVALIDA
                    mensaje: La HDU no puede pasar a ese estado.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    detalles: []
                    estadoActual: PENDIENTE
                    estadoSolicitado: CERRADA
                    transicionesPermitidas: [DISENO_PRUEBAS]
                checklistNoDisponible:
                  summary: Cierre sin checklist verificable (E2-B02#3, D11)
                  value:
                    codigo: CHECKLIST_NO_DISPONIBLE
                    mensaje: 'No se puede cerrar la HDU: el checklist de entregables no está disponible para verificarse.'
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    detalles: []
                    checklist: {fuente: certificaciones.checklist, estado: indisponible}
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

