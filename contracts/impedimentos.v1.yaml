        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '422':
          $ref: './comun.v1.yaml#/components/responses/ExportacionExcedeLimite'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: './comun.v1.yaml#/components/responses/ServicioNoDisponible'

  # ------------------------------------------------ internos (no los publica el gateway)
  /v1/interno/impedimentos/evaluacion:
    post:
      operationId: evaluarImpedimentosLote
      tags: [Interno]
      summary: Bloqueo, conteos y riesgo de varias HDU
      description: |
        Lectura en lote (POST solo para enviar hasta 1000 HDU) que usa
        Organización al componer las bandejas (D69, D87). Organización envía
        los datos que ya tiene (estado, fin del sprint y avance), así que
        Impedimentos no vuelve a pedirlos. Propaga el token del usuario
        (2 s, `IMPEDIMENTOS_TIMEOUT_MS`). Impedimentos consulta una vez
        `GET /v1/interno/hdu/ambito` y, si algún id está fuera del ámbito,
        responde 403 sin datos parciales (D47). Una HDU sin impedimentos
        responde `bloqueada: false` y conteos en 0: es un dato válido.
        Para el Analista QA, `riesgo` y los niveles vienen igual pero
        Organización no los publica (D73).
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA, LIDER_QA, AUDITOR]
      x-hdu: [E4-F01#3, E4-F03#2, E4-B01#2, E4-B02#2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './comun.v1.yaml#/components/schemas/SolicitudEvaluacionImpedimentos'
      responses:
        '200':
          description: Una evaluación por HDU, en el orden pedido.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ResultadoEvaluacionImpedimentos'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'

  /v1/interno/hdu/{hduId}/impedimentos/abiertos:
    parameters:
      - $ref: '#/components/parameters/HduId'
    get:
      operationId: listarImpedimentosBloqueantesHdu
      tags: [Interno]
      summary: Impedimentos que impiden cerrar una HDU
      description: |
        Organización lo llama al pedir `CERRADA`, después de validar la
        transición (D10) y el checklist (D11), con el token del usuario y 2 s
        de tiempo límite (D60, D77). `total > 0` → Organización responde 409
        `HDU_BLOQUEADA` con esta lista. Si no responde, Organización responde
        503 «No pudimos verificar los impedimentos de la HDU». Autoriza con
        `GET /v1/interno/hdu/{id}/acceso`: basta con cualquier relación.
      x-roles: [ADMINISTRADOR, QE, ANALISTA_QA]
      x-hdu: [E4-B02#2]
      responses:
        '200':
          description: Abiertos y escalados (hasta 20) y su total.
          content:
            application/json:
              schema:
                $ref: './comun.v1.yaml#/components/schemas/ImpedimentosAbiertosHdu'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'

  # ------------------------------------------------ carga semilla (Integraciones, D88)
  /v1/interno/carga/impedimentos:
    post:
      operationId: cargarImpedimento
      tags: [Carga semilla]
      summary: Alta idempotente de un impedimento con su historial
      description: |
        Solo para la semilla E4 (fixture de la sección 7 del backlog E4), con
        `credencialServicio` y `PERMITIR_CARGA_SEMILLA=true` (si no, 403).
        Idempotente por `hduId` + `titulo`. Inserta el impedimento y sus
        acciones con las fechas indicadas: el estado, `abierto_desde` y
        `fecha_resolucion` se derivan de la última acción. No valida la
        relación con la HDU ni consulta otros servicios. Reiniciar el fixture
        (borrar) no es posible con `svc_impedimentos` (D88): lo hace el
        arnés de pruebas con el dueño de la base.
      x-roles: [SERVICIO]
      x-hdu: []
      security:
        - credencialServicio: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargaImpedimento'
      responses:
        '200':
          description: Ya existía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCarga'
        '201':
          description: Creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCarga'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'

  /v1/interno/carga/riesgo:
    post:
      operationId: cargarRiesgo
      tags: [Carga semilla]
      summary: Alta idempotente de un nivel de riesgo fijado
      description: Solo para la semilla E4, con `credencialServicio`. Idempotente por `hduId` + `fecha`.
      x-roles: [SERVICIO]
      x-hdu: []
      security:
        - credencialServicio: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargaRiesgo'
      responses:
        '200':
          description: Ya existía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCarga'
        '201':
          description: Creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCarga'
        '400':
          $ref: './comun.v1.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.v1.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.v1.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: './comun.v1.yaml#/components/responses/ErrorInterno'

components:
  securitySchemes:
    sesionSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth propagado por el llamador.
    credencialServicio:
      type: apiKey
      in: header
      name: X-Q360-Servicio-Token
      description: Credencial de servicio a servicio (ADR 0007), solo para `/v1/interno/carga/*` desde Integraciones. El gateway descarta esta cabecera si llega desde afuera.

  schemas:
    AccionCarga:
      type: object
      required: [tipo, estado, actor, fecha, comentario]
      additionalProperties: false
      properties:
        tipo:
          $ref: './comun.v1.yaml#/components/schemas/TipoAccionImpedimento'
        estadoAnterior:
          $ref: './comun.v1.yaml#/components/schemas/EstadoImpedimento'
        estado:
          $ref: './comun.v1.yaml#/components/schemas/EstadoImpedimento'
        actor:
          $ref: './comun.v1.yaml#/components/schemas/PersonaRol'
        fecha:
          $ref: './comun.v1.yaml#/components/schemas/FechaHora'
        comentario:
          type: string
          maxLength: 500
        responsableNuevo:
          description: Solo en `ESCALAR`.
          $ref: './comun.v1.yaml#/components/schemas/ResponsableImpedimento'
    CargaImpedimento:
      type: object
      description: La primera acción debe ser `REGISTRAR`, con la fecha de registro.
      required: [hduId, tipo, titulo, descripcion, responsableInicial, creadoPor, acciones]
      additionalProperties: false
      properties:
        hduId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        certificacionId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        tipo:
          $ref: './comun.v1.yaml#/components/schemas/TipoImpedimento'
        titulo:
          type: string
          minLength: 5
          maxLength: 200
        descripcion:
          type: string
          minLength: 10
          maxLength: 1000
        responsableInicial:
          $ref: './comun.v1.yaml#/components/schemas/ResponsableImpedimento'
        creadoPor:
          $ref: './comun.v1.yaml#/components/schemas/PersonaRol'
        acciones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccionCarga'
    CargaRiesgo:
      type: object
      required: [hduId, nivel, justificacion, actor, fecha]
      additionalProperties: false
      properties:
        hduId:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'
        nivel:
          $ref: './comun.v1.yaml#/components/schemas/NivelRiesgo'
        nivelAnterior:
          $ref: './comun.v1.yaml#/components/schemas/NivelRiesgo'
        sugeridoAlFijar:
          $ref: './comun.v1.yaml#/components/schemas/NivelRiesgo'
        justificacion:
          type: string
          minLength: 3
          maxLength: 500
        actor:
          $ref: './comun.v1.yaml#/components/schemas/PersonaRol'
        fecha:
          $ref: './comun.v1.yaml#/components/schemas/FechaHora'
    ResultadoCarga:
      type: object
      required: [creado, id]
      additionalProperties: false
      properties:
        creado:
          type: boolean
        id:
          $ref: './comun.v1.yaml#/components/schemas/Uuid'

  parameters:
    HduId:
      name: hduId
      in: path
      required: true
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    ImpedimentoId:
      name: id
      in: path
      required: true
      description: UUID del impedimento.
      schema:
        $ref: './comun.v1.yaml#/components/schemas/Uuid'
    BusquedaImpedimento:
      name: q
      in: query
      required: false
      description: Coincidencia parcial en el código o título de la HDU o en el título del impedimento, sin distinguir mayúsculas.
      schema:
        type: string
        minLength: 2
        maxLength: 120
    OrdenImpedimentos:
      name: orden
      in: query
      required: false
      description: '`columna:asc|desc` con `riesgo`, `diasAbierto` o `fechaRegistro`. Sin valor, el orden D74. Otra columna → 400.'
      schema:
        type: string
        pattern: '^(riesgo|diasAbierto|fechaRegistro):(asc|desc)$'
    OrdenRiesgo:
      name: orden
      in: query
      required: false
      description: '`columna:asc|desc` con `riesgo`, `impedimentosAbiertos`, `codigo` o `avance`. Otra columna → 400.'
      schema:
        type: string
        pattern: '^(riesgo|impedimentosAbiertos|codigo|avance):(asc|desc)$'

  responses:
    AccionAceptada:
      description: Acción registrada; impedimento y bloqueo de la HDU después del cambio.
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/ResultadoAccionImpedimento'
    HduCerrada:
      description: La HDU está cerrada y no admite impedimentos nuevos ni cambios de riesgo (D60).
      x-codigos: [HDU_CERRADA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: HDU_CERRADA
            mensaje: La HDU está cerrada y no admite cambios.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles: []
    ConflictoImpedimento:
      description: HDU cerrada o transición no permitida desde el estado actual (D62, E4-B02#3).
      x-codigos: [HDU_CERRADA, TRANSICION_INVALIDA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: './comun.v1.yaml#/components/schemas/ErrorTransicionImpedimento'
              - $ref: './comun.v1.yaml#/components/schemas/Error'
          examples:
            resueltoNoEscala:
              summary: Escalar un resuelto (E4-B02#3)
              value:
                codigo: TRANSICION_INVALIDA
                mensaje: Un impedimento resuelto solo puede reabrirse.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                detalles: []
                estadoActual: RESUELTO
                operacion: ESCALAR
                operacionesPermitidas: [REABRIR]
    ResponsableInvalido:
      description: El responsable no está entre los candidatos de `REGISTRO`.
      x-codigos: [RESPONSABLE_INVALIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
          example:
            codigo: RESPONSABLE_INVALIDO
            mensaje: El responsable indicado no está entre los candidatos de esta HDU.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            detalles:
              - campo: responsableId
                codigo: NO_PERMITIDO
                mensaje: Elige a un responsable de la lista o escribe su nombre.
    EscalamientoInvalido:
      description: Destino fuera de los candidatos de `ESCALAMIENTO` o comentario en blanco.
      x-codigos: [RESPONSABLE_INVALIDO, COMENTARIO_REQUERIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    ComentarioRequerido:
      description: Comentario en blanco.
      x-codigos: [COMENTARIO_REQUERIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    MotivoRequerido:
      description: Motivo en blanco.
      x-codigos: [MOTIVO_REQUERIDO]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
    JustificacionRequerida:
      description: Justificación en blanco.
      x-codigos: [JUSTIFICACION_REQUERIDA]
      headers:
        x-trace-id:
          $ref: './comun.v1.yaml#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: './comun.v1.yaml#/components/schemas/Error'
